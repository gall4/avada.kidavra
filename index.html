<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6B8A">
<title>Справочник участкового терапевта</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A9%BA%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F2F5F6;--card:#FFFFFF;--ink:#142329;--muted:#5B6C73;--line:#D8E1E4;
  --accent:#0B6B8A;--accent-ink:#FFFFFF;--soft:#E3EEF2;--mark:#FFE08A;--markink:#142329;--fav:#B77B00;
  --fs:17px;--c-sh:#1D6FB8;--c-al:#C8641B;--c-le:#7B4FB5;--c-pr:#12875A;--c-fm:#B0377E;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Charter,Georgia,"Times New Roman",serif;
}
:root[data-theme="dark"]{
  --bg:#0E171B;--card:#152229;--ink:#E3EDF0;--muted:#8FA4AC;--line:#25363E;
  --accent:#5CC0DD;--accent-ink:#06222B;--soft:#1B2E37;--mark:#6B5A12;--markink:#FFF6D6;--fav:#E8B84A;
  --c-sh:#6AB0F0;--c-al:#F2994A;--c-le:#B596E8;--c-pr:#4FD39A;--c-fm:#F08DB7;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E171B;--card:#152229;--ink:#E3EDF0;--muted:#8FA4AC;--line:#25363E;
    --accent:#5CC0DD;--accent-ink:#06222B;--soft:#1B2E37;--mark:#6B5A12;--markink:#FFF6D6;--fav:#E8B84A;
    --c-sh:#6AB0F0;--c-al:#F2994A;--c-le:#B596E8;--c-pr:#4FD39A;--c-fm:#F08DB7;
  }
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 12px;
  background:var(--accent);color:var(--accent-ink)}
.top .brand{font-family:var(--serif);font-weight:700;font-size:1.05rem;white-space:nowrap;display:none}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;height:42px;border:0;border-radius:10px;padding:0 38px 0 14px;font:inherit;
  background:var(--card);color:var(--ink)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search .x{position:absolute;right:4px;top:3px;width:36px;height:36px;border:0;background:none;color:var(--muted);font-size:1.3rem;display:none}
.search.has .x{display:block}
.ibtn{height:42px;min-width:42px;border:0;border-radius:10px;background:rgba(255,255,255,.16);color:var(--accent-ink);padding:0 10px;font-weight:600}
.ibtn:hover{background:rgba(255,255,255,.28)}

.app{display:grid;grid-template-columns:1fr;min-height:calc(100% - 62px)}
#list{padding:12px 12px 40px;overflow:auto}
#view{display:none;padding:0 0 60px;min-width:0}
body.in-topic #list{display:none}
body.in-topic #view{display:block}

@media (min-width:880px){
  .top .brand{display:block}
  .app{grid-template-columns:340px 1fr;height:calc(100vh - 62px);min-height:0}
  #list{display:block!important;border-right:1px solid var(--line);height:100%;background:var(--bg)}
  #view{display:block!important;height:100%;overflow:auto}
  .backbtn{display:none!important}
}

.grp{margin:14px 0 4px}
.grp h2{margin:0;font-family:var(--serif);font-size:1rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:6px 4px}
.grp h2 small{font-family:var(--sans);font-weight:400}
.grp.shut ul{display:none}
.grp ul,.res{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:6px;border-radius:10px}
.item a{flex:1;display:block;padding:10px 10px;color:var(--ink);text-decoration:none;border-radius:10px;min-width:0}
.item a:hover{background:var(--soft)}
.item.on a{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.star{border:0;background:none;color:var(--muted);font-size:1.15rem;width:40px;height:40px;border-radius:10px;flex:none}
.star.on{color:var(--fav)}
.star:hover{background:var(--soft)}
.res li{margin:0 0 8px}
.res a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);text-decoration:none}
.res a:hover{border-color:var(--accent)}
.res b{font-family:var(--serif);font-size:1.02rem}
.tag{display:inline-block;font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:2px}
.snip{display:block;color:var(--muted);font-size:.86rem;margin-top:4px}
.empty{color:var(--muted);padding:24px 6px}
mark{background:var(--mark);color:var(--markink);border-radius:3px;padding:0 1px}

.tophead{padding:14px 16px 0;max-width:860px;margin:0 auto}
.backbtn{border:0;background:none;color:var(--accent);padding:6px 0;font-weight:600;margin-bottom:4px}
.tophead h1{font-family:var(--serif);font-size:1.6rem;line-height:1.2;margin:0 0 4px}
.tophead .meta{color:var(--muted);font-size:.85rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tophead .acts{display:flex;gap:8px;margin:10px 0 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
.btn.on{color:var(--fav);border-color:var(--fav)}
.tabs{position:sticky;top:62px;z-index:10;background:var(--bg);padding:10px 16px 0;margin-top:8px;border-bottom:1px solid var(--line)}
.tabs .in{max-width:860px;margin:0 auto;display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab i{font-style:normal;font-weight:400;color:var(--muted);margin-left:4px;font-size:.8rem}
@media (min-width:880px){.tabs{top:0}}

.content{max-width:860px;margin:0 auto;padding:14px 16px 0}
.content>*{position:relative}
.content p,.content ul,.content ol,.content blockquote{margin:0 0 .75em}
.content ul,.content ol{padding-left:1.4em}
.content li{margin:.2em 0}
.content li>p{margin:0}
.content blockquote{border-left:3px solid var(--line);padding:.1em 0 .1em 12px;color:var(--ink);background:none}
.content strong{font-weight:700}
.content .tw{overflow-x:auto;margin:0 0 1em;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.content table{border-collapse:collapse;font-size:.88rem;min-width:100%}
.content th,.content td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.content img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:zoom-in;display:block;margin:.4em 0}
.content blockquote,.content p,.content ul,.content ol{padding-right:34px}
.content ul,.content ol{padding-right:34px}
.cp{position:absolute;right:0;top:-2px;width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);opacity:0}
.content>*:hover>.cp,.cp:focus-visible{opacity:1}
.cp:hover{background:var(--soft);color:var(--accent)}
@media (hover:none){.cp{opacity:.55}}
.cp.ok{opacity:1;color:var(--accent)}
.note{margin:28px auto 0;max-width:860px;padding:0 16px;color:var(--muted);font-size:.82rem}
.welcome{max-width:560px;margin:12vh auto 0;padding:0 20px;color:var(--muted)}
.welcome h1{font-family:var(--serif);color:var(--ink);font-size:1.5rem;margin:0 0 8px}
kbd{border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--card);font:inherit;font-size:.85em}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .15s;z-index:50}
#toast.show{opacity:1}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;overflow:auto;display:none;padding:16px}
#lb.show{display:block}
#lb img{max-width:none;width:min(1400px,200%);height:auto;background:#fff;display:block;margin:0 auto;border-radius:6px}
#lb button{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#000;font-size:1.4rem}

.s-sh{--c:var(--c-sh)}.s-al{--c:var(--c-al)}.s-le{--c:var(--c-le)}.s-pr{--c:var(--c-pr)}.s-fm{--c:var(--c-fm)}
.item{border-left:4px solid var(--c,transparent);border-radius:3px 10px 10px 3px;margin-bottom:2px}
.grp h2{border-left:4px solid var(--c,transparent);padding-left:8px;border-radius:2px}
.res a{border-left:5px solid var(--c,var(--line))}
.tag{color:var(--c,var(--muted));border-color:var(--c,var(--line))}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.lg{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px 5px 9px;font-size:.8rem}
.lg::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--c)}
.lg.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);font-weight:600}
.srcline{display:flex;align-items:center;gap:6px}
.srcline::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.welcome ul{padding-left:0;list-style:none;margin:10px 0}
.welcome li{display:flex;align-items:center;gap:8px;margin:4px 0}
.welcome li::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}

.srcbanner{display:inline-flex;align-items:center;gap:8px;margin:10px 0 0;border:1px solid var(--c);border-radius:999px;padding:5px 14px 5px 10px;font-size:.88rem;background:color-mix(in srgb,var(--c) 14%,var(--card))}
.srcbanner::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.srcbanner b{color:var(--ink)}
.tophead>.srcwrap{max-width:860px;margin:0 auto;padding:0 16px}
.lg.favbtn::before{content:"★";width:auto;height:auto;background:none;border-radius:0;color:var(--fav);font-size:.95rem;line-height:1}
.lg.favbtn.on{border-color:var(--fav);box-shadow:inset 0 0 0 1px var(--fav)}

.grp.s-pr{border:2px solid var(--c);border-radius:14px;padding:4px 8px 6px;margin:8px 0 14px;background:color-mix(in srgb,var(--c) 9%,var(--bg))}
.grp.s-pr h2{color:var(--c);font-weight:800;border-left:0;padding-left:4px}
.grp.s-pr h2 small{color:var(--c)}
.item.s-pr{border-left-color:var(--c)}

.fpanel{max-width:860px;margin:0 auto;padding:0 16px}
.fgrid{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0}
@media (min-width:640px){.fgrid{grid-template-columns:1fr 1fr}.fgrid .wide{grid-column:1/-1}}
.fld label{display:block;font-size:.82rem;color:var(--muted);margin:0 0 3px}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
.fld textarea{resize:vertical;min-height:4.2em}
.fbtns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.fhint{color:var(--muted);font-size:.82rem;margin:4px 0 10px}
.sheetwrap{max-width:860px;margin:0 auto;padding:0 16px 20px;overflow-x:auto}
.sheet{background:#fff;color:#000;font:12pt/1.35 "Times New Roman",Times,"Liberation Serif",serif;width:21cm;max-width:none;min-height:14cm;padding:1cm 1.5cm 2cm 3cm;box-shadow:0 1px 8px rgba(0,0,0,.25);margin:0 auto}
.sheet p{margin:0 0 .6em}
.sheet .sh-head{display:flex;align-items:center;gap:12px;min-height:1.2cm;margin-bottom:.5cm;white-space:pre-line;font-size:10pt}
.sheet .sh-head img{max-height:2.2cm;max-width:8cm;border:0;border-radius:0;margin:0;cursor:default;display:block}
.sheet .sh-title{text-align:center;font-weight:bold;margin-bottom:.8em}
.sheet .sh-foot{display:flex;justify-content:space-between;gap:16px;margin-top:3.2cm}
.sheet .blank{border-bottom:1px solid #000;display:inline-block;min-width:3.5cm}
.sheet:focus{outline:2px dashed var(--accent);outline-offset:4px}
@media screen and (max-width:700px){.sheet{width:100%;padding:16px;min-height:0}.sheet .sh-foot{flex-direction:column;margin-top:1.5cm}}
@page{size:A4;margin:1cm 1.5cm 2cm 3cm}
.modes{display:flex;gap:6px;margin:0 0 10px}
.mode{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 6px;font-weight:600;font-size:.92rem}
.mode.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ico{margin-right:8px}
.item.form a{font-weight:600}
.lg.resetchip{border-style:dashed;color:var(--muted)}
.lg.resetchip::before{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{html,body{height:auto!important;background:#fff!important}.noprint{display:none!important}.sheetwrap{padding:0;overflow:visible;max-width:none}.sheet{box-shadow:none;padding:0;width:auto;min-height:0;margin:0}.top,#list,.tabs,.cp,.acts,.backbtn{display:none!important}.app{display:block;height:auto}#view{display:block!important;overflow:visible}}

:root{--c-kr:#0B6B8A}:root[data-theme="dark"]{--c-kr:#5CC0DD}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-kr:#5CC0DD}}
.s-kr{--c:var(--c-kr)}
.content h3{font-family:var(--serif);font-size:1.05rem;margin:1.1em 0 .4em}
.lb{display:inline-block;font-size:.66rem;font-weight:600;border:1px solid currentColor;border-radius:999px;padding:0 6px;margin-left:5px;vertical-align:1px;white-space:nowrap}
.lb-kr{color:var(--c-pr)}.lb-le{color:var(--c-le)}.lb-sp{color:var(--c-sh)}.lb-pk{color:var(--c-al)}
body.nolb .lb{display:none}
.ck{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.ck input{margin-top:.3em;width:18px;height:18px;flex:none}
.ck input:checked+span{font-weight:600}
.tpl{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.dx{background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin:0 0 1em}
.dxp{margin:0 0 .6em;line-height:2.1}
.dxc{font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:3px 6px;max-width:100%}
.pickbar{position:sticky;bottom:0;z-index:15;display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-top:2px solid var(--accent)}
.pickbar span{flex:1;font-weight:600}
.calcres{background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:12px 14px;margin:10px 0;white-space:pre-line;font-weight:600;line-height:1.6}
.fpanel .hint{color:var(--muted);font-size:.82rem;margin:4px 0 10px}
</style>
</head>
<body>
<header class="top">
  <span class="brand">Справочник терапевта</span>
  <div class="search" id="sbox">
    <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="Поиск: диагноз, препарат, симптом…" autocomplete="off" aria-label="Поиск по справочнику">
    <button class="x" id="qx" aria-label="Очистить поиск">×</button>
  </div>
  <button class="ibtn" id="fminus" aria-label="Уменьшить шрифт">A−</button>
  <button class="ibtn" id="fplus" aria-label="Увеличить шрифт">A+</button>
  <button class="ibtn" id="theme" aria-label="Сменить тему">◐</button>
</header>
<div class="app">
  <nav id="list" aria-label="Разделы"></nav>
  <main id="view"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

ти щелочной фосфатазы в крови, определение активности гамма-глютамилтрансферазы в крови, определение активности лактатдегидрогеназы в крови, исследование уровня глюкозы в крови, гомоцистеин)<\/li><li>Для исключения полидефицитных состояний: показателей обмена железа: исследование уровня ферритина в крови, исследование уровня трансферрина сыворотки крови, исследование железосвязывающей способность сыворотки (ОЖСС), исследование уровня железа сыворотки крови и исследование насыщения трансферрина железом (НТЖ)<\/li><li>Определение уровня витамина В12 (цианокобаламин) в крови, исследование уровня фолиевой кислоты в сыворотке крови<\/li><li>Цитологическое исследование мазка костного мозга (миелограмма)<\/li><li>Госпитализированным пациентам: определение антител классов M, G (IgM, IgG) к вирусу иммунодефицита человека ВИЧ-1 (Human immunodeficiency virus HIV 1) в крови; определение антител классов M, G (IgM, IgG) к вирусу иммунодефицита человека ВИЧ-2 (Human immunodeficiency virus HIV 2) в связи с высокой частотой ассоциации дефицита витамина В12 с ВИЧ-инфекцией<\/li><li>Ультразвуковое исследование органов брюшной полости (комплексное)<\/li><li>Ультразвуковое исследование щитовидной железы и паращитовидных желез<\/li><li>Регистрация электрокардиограммы<\/li><li>Эзофагогастродуоденоскопия (ЭГДС)<\/li><li>Видеоколоноскопия<\/li><li>Консультация невролога<\/li><\/ul>", "s": "ОАК (гематокрита, исследования уровня эритроцитов в крови, исследования уровня ретикулоцитов в крови, определение среднего содержания и средней концентрации гемоглобина в эритроцитах, определение размеров эритроцитов) Б/Х анализ крови: (исследование общего белка в крови, исследование уровня альбумина в крови, исследование уровня общего билирубина в крови, исследование уровня свободного и связанного билирубина в крови, определение активности аспартатаминотрансферазы в крови, определение активности аланинаминотрансферазы в крови, определение уровня креатинина в крови, исследование уровня мочевины в крови, о влений не более 200-500 мкг/сут\"><span>Цианокобаламин парентерально<\/span><\/label><\/td><td>200-400 мкг/сут в/в или в/м, 2-4 недели (насыщение); после нормализации показателей ещё 10-14 дней. Без неврологических проявлений не более 200-500 мкг/сут<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Профилактика рецидива у групп риска — 500 мкг/сут, 5-15 инъекций на курс, ежегодно; при неустранимой причине поддерживающее введение пожизненно\"><span>Профилактика рецидива у групп риска<\/span><\/label><\/td><td>500 мкг/сут, 5-15 инъекций на курс, ежегодно; при неустранимой причине поддерживающее введение пожизненно<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Неврологические нарушения — Парентеральное введение неотложно; отдельная доза в тексте не дана\"><span>Неврологические нарушения<\/span><\/label><\/td><td>Парентеральное введение неотложно; отдельная доза в тексте не дана<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Внутрь — В документе доза не указана\"><span>Внутрь<\/span><\/label><\/td><td>В документе доза не указана<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Контроль — Улучшение после 3-5 инъекций; ретикулоцитарный криз на 5-7 день; Hb растёт через 7-10 дней; после курса ОАК с ретикулоцитами каждые 3-4 месяца; биохимия раз в год\"><span>Контроль<\/span><\/label><\/td><td>Улучшение после 3-5 инъекций; ретикулоцитарный криз на 5-7 день; Hb растёт через 7-10 дней; после курса ОАК с ретикулоцитами каждые 3-4 месяца; биохимия раз в год<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Железо, фолат — Если на фоне B12 выявится дефицит железа: стандартное лечение железом (доз нет); дозы фолиевой кислоты не описаны\"><span>Железо, фолат<\/span><\/label><\/td><td>Если на фоне B12 выявится дефицит железа: стандартное лечение железом (доз нет); дозы фолиевой кислоты не описаны<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Переливание — По показаниям при плохой адаптации: 1-2 дозы эритроцитов; у пожилых часто при Hb 75-85 г/л\"><span>Переливание<\/span><\/label><\/td><td>По показаниям при плохой адаптации: 1-2 дозы эритроцитов; у пожилых часто при Hb 75-85 г/л<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Обследование — ЭГДС и колоноскопия всем с впервые установленным диагнозом; осмотр невролога; сифилис, ВИЧ, гепатиты B и C\"><span>Обследование<\/span><\/label><\/td><td>ЭГДС и колоноскопия всем с впервые установленным диагнозом; осмотр невролога; сифилис, ВИЧ, гепатиты B и C<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"При аллергии на инъекцию — Преднизолон 0,5 мг/кг внутрь и антигистаминные\"><span>При аллергии на инъекцию<\/span><\/label><\/td><td>Преднизолон 0,5 мг/кг внутрь и антигистаминные<\/td><\/tr><\/tbody><\/table><\/div>", "s": "- Цианкобаламин в/в, в/м, п/к, внутрь - Гемотрансфузии - Оксигенотерапия В документе даны группы препаратов и только часть доз; полные схемы смотрите ниже. 5а. Схемы и дозы по самой КР (прочитано мной по тексту КР): КР «Витамин-В12-дефицитная анемия» (дети/взрослые, год в тексте не указан) Что Доза, схема, срок Цианокобаламин парентерально 200-400 мкг/сут в/в или в/м, 2-4 недели (насыщение); после нормализации показателей ещё 10-14 дней. Без неврологических проявлений не более 200-500 мкг/сут Профилактика рецидива у групп риска 500 мкг/сут, 5-15 инъекций на курс, ежегодно; при неустранимой причине поддерживающее введение пожизненно Неврологические нарушения Парентеральное введение неотложно; отдельная доза в тексте не дана Внутрь В документе доза не указана Контроль Улучшение после 3-5 инъекций; ретикулоцитарный криз на 5-7 день; Hb растёт через 7-10 дней; после курса ОАК с ретикулоцитами каждые 3-4 месяца; биохимия раз в год Железо, фолат Если на фоне B12 выявится дефицит железа: стандартное лечение железом (доз нет); дозы фолиевой кислоты не описаны Переливание По показаниям при плохой адаптации: 1-2 дозы эритроцитов; у пожилых часто при Hb 75-85 г/л Обследование ЭГДС и колоноскопия всем с впервые установленным диагнозом; осмотр невролога; сифилис, ВИЧ, гепатиты B и C При аллергии на инъекцию Преднизолон 0,5 мг/кг внутрь и антигистаминные"}, {"k": "t6", "l": "Схемы из вашего справочника", "h": "<p>Тема p02: Анемия: тактика обследования<\/p><ul><li>Минимум, с которого начинаем: ОАК + ретикулоциты<\/li><li>Hb ↓ — подтверждаем анемию.<\/li><li>MCV (средний объём эритроцита):<\/li><li>&lt; 80 — микроцитарная<\/li><li>80–100 — нормоцитарная<\/li><li>&gt; 100 — макроцитарная<\/li><li>RDW ↑ — клетки разного размера (характерно для дефицитов).<\/li><li>Ретикулоциты:<\/li><li>норма/↓ — гипорегенераторная (не хватает железа, B12, фолата, угнетён костный мозг)<\/li><li>↑ — гиперрегенераторная (ищем кровопотерю или гемолиз)<\/li><li>Ферритин<\/li><li>↓ — железодефицитная анемия.<\/li><li>N/↑ при анемии и воспалении — ищем хронический процесс.<\/li><li>B12 и фолиевая кислота (при макроцитозе)<\/li><li>B12 ↓ → B12-дефицитная анемия.<\/li><li>Фолат ↓ → фолиеводефицитная.<\/li><li>При подозрении на гемолиз<\/li><li>ЛДГ ↑, билирубин ↑, гаптоглобин ↓, мазок — шизоциты.<\/li><li>Главное<\/li><li>ОАК + ретикулоциты уже дают направление.<\/li><li>Ферритин обязателен при микроцитозе.<\/li><li>B12/фолат — только если MCV &gt; 100.<\/li><li>Не нужно назначать весь спектр «железо + ОЖСС + трансферрин» сразу — достаточно ферритина.<\/li><\/ul>", "s": "Тема p02: Анемия: тактика обследования Минимум, с которого начинаем: ОАК + ретикулоциты Hb ↓ — подтверждаем анемию. MCV (средний объём эритроцита): 80–100 — нормоцитарная > 100 — макроцитарная RDW ↑ — клетки разного размера (характерно для дефицитов). Ретикулоциты: норма/↓ — гипорегенераторная (не хватает железа, B12, фолата, угнетён костный мозг) ↑ — гиперрегенераторная (ищем кровопотерю или гемолиз) Ферритин ↓ — железодефицитная анемия. N/↑ при анемии и воспалении — ищем хронический процесс. B12 и фолиевая кислота (при макроцитозе) B12 ↓ → B12-дефицитная анемия. Фолат ↓ → фолиеводефицитная. При подозрении на гемолиз ЛДГ ↑, билирубин ↑, гаптоглобин ↓, мазок — шизоциты. Главное ОАК + ретикулоциты уже дают направление. Ферритин обязателен при микроцитозе. B12/фолат — только если MCV > 100. Не нужно назначать весь спектр «железо + ОЖСС + трансферрин» сразу — достаточно ферритина."}, {"k": "t7", "l": "Замечания", "h": "<ul><li>Справочник (p02): при макроцитозе (MCV более 100) определить B12 и фолат; B12 ниже нормы означает B12-дефицитную анемию. Схем лечения в справочнике нет.<\/li><li>Дозы цианокобаламина: блок 5а ниже (по КР, год в тексте не указан). Дополнительно по документу: ЭГДС (атрофический гастрит), консультация невролога. Пероральные дозы в КР не указаны. Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам.<\/li><\/ul>", "s": "Справочник (p02): при макроцитозе (MCV более 100) определить B12 и фолат; B12 ниже нормы означает B12-дефицитную анемию. Схем лечения в справочнике нет. Дозы цианокобаламина: блок 5а ниже (по КР, год в тексте не указан). Дополнительно по документу: ЭГДС (атрофический гастрит), консультация невролога. Пероральные дозы в КР не указаны. Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам."}, {"k": "info", "l": "О листе", "h": "<p>Шаблон приёма, формулировки диагнозов, коды и обследование взяты из присланного вами документа (краткие КР). Источник: Клинические рекомендации «Витамин-В12-дефицитная анемия», 2024 год. Схемы лечения из вашего справочника добавлены отдельным блоком. Дата сборки: 18.11.2026.<\/p>", "s": ""}]}, {"id": "k02", "t": "Аллергический ринит", "g": "c8", "kw": "J30.1 J30.2 J30.3 J30.4", "tabs": [{"k": "t1", "l": "Жалобы и осмотр", "h": "<p><strong>Копируйте в карту, пустые места заполняйте<\/strong><\/p><p class=\"tpl\">Жалобы: на заложенность носа/дыхание ртом, сопение/храп, изменение голоса, выделения из носа, чихание/ зуд, жжение в носу, снижение обоняния/ слабость, недомогание, раздражительность, головная боль, повышенная утомляемость, нарушение сна, повышение температуры(редко)<\/p><p class=\"tpl\">Анамнез заболевания: вышеописанные жалобы отмечает в течение ( указать продолжительность симптомов). Отмечает связь с контактом причинно-значимого аллергена/ не отмечает. Терапию самостоятельно принимал/не принимал. Обратился в поликлинику по м/ж.<\/p><p class=\"tpl\">Анамнез жизни: Не отягощен, без особенностей/ описать. ВИЧ, Гепатит В, С, сифилис, туберкулез отрицает. Операции, гемотрансфузии отрицает. Вредные привычки: отрицает<\/p><p class=\"tpl\">Эпидемиологический анамнез: Выезды в эпидемиологически неблагополучные территории и другие страны отрицает. В контакте с инфекционными больными не находился<\/p><p class=\"tpl\">Аллергологический анамнез: не отягощен/ перечислить возможные аллергические реакции на пищевые продукты, препараты и т. п., указать характер проявлений: отек Квинке, крапивница, зуд и т. д<\/p><p class=\"tpl\">Лекарственная непереносимость: отрицает/ да (перечислить лекарственные препараты и указать характер проявлений : отек Квинке, крапивница, зуд и тд.)<\/p><p class=\"tpl\">Хронические заболевания: отрицает/ перечислить если есть<\/p><p class=\"tpl\">Наследственный анамнез: отягощен/ не отягощен<\/p><p class=\"tpl\">Вредные привычки: отрицает / употребляет алкоголь/ курение ( стаж курения и сколько выкуриваемых сигарет в день)<\/p><p class=\"tpl\">Страховой анамнез: работает / не работает/ кем<\/p><p class=\"tpl\">Инвалидность: нет/ есть (указать группу)<\/p><p class=\"tpl\">Объективный осмотр:<\/p><p class=\"tpl\">Общее состояние: средней степени тяжести/относительно удовлетворительное. Сознание: ясное. Кожные покровы и видимые слизистые чистые, физиологической окраски/акроцианоз. Подкожно-жировая клетчатка развита равномерно. Опорно-двигательныйы аппарат без патологии. Периферические лимфоузлы не увеличены. Щитовидная железа не увеличена. Грудные/ молочные железы без новообразований<\/p><p class=\"tpl\">Дыхательная система: дыхание везикулярное, хрипов нет. ЧДД 17 в мин. Sp02- 98%<\/p><p class=\"tpl\">Сердечно-сосудистая система: тоны сердца ясные, ритмичные. Пульс удовлетворительных качеств<\/p><p class=\"tpl\">Нервная система: сознание ясное. Ориентирован в месте,пространстве, времени, личности. Менингеальные знаки отрицательные<\/p><p class=\"tpl\">Пищеварительная система: язык влажный, чистый. Живот мягкий, безболезненный при пальпации во всех отделах. Печень, селезенка не пальпируются. Стул регулярный, оформленный<\/p><p class=\"tpl\">Мочеполовая система: Симптом “поколачивания” отрицательный с обеих сторон. Мочеиспускание безболезненное<\/p><p class=\"tpl\">Локальный статус:<\/p><p class=\"tpl\">Нос и околоносовые пазухи: форма носа не изменена. Пальпация, перкуссия передних стенок верхнечелюстных и лобных пазух безболезненная с двух сторон. Передняя риноскопия: слизистая оболочка полости носа отечная, синюшная, влажная. Носовые ходы свободные/слизистое отделяемое. Нижние носовые раковины не увеличены/увеличены, синюшны. Перегородка носа по средней линии/искривлена. Носовое дыхание свободное/затруднено. Задняя риноскопия: слизистая оболочка розовая, свод носоглотки, миндалины, сошник, задние концы нижних носовых раковин, устья слуховых труб не изменены. Отделяемого нет. Кровотечения нет<\/p><p class=\"tpl\">Глотка: слизистая оболочка розовая, влажная, без патологических образований. Небные миндалины, небные дужки без признаков воспаления. Налетов нет<\/p><p class=\"tpl\">Гортань: подвижность гортани сохранена. Пальпация хрящей безболезненная. Слизистая оболочка розовая, влажная, без патологических образований. Голосовые складки белые, подвижные. Голос звучный. Дыхание свободное<\/p><p class=\"tpl\">Уши: АD: заушная область не изменена. Слуховой проход широкий, свободный. Барабанная перепонка серая, опознавательные пункты четкие, патологического отделяемого нет<\/p><p class=\"tpl\">AS: заушная область не изменена. Слуховой проход широкий, свободный. Барабанная перепонка серая, опознавательные пункты четкие, патологического отделяемого нет<\/p><p class=\"tpl\">Слуховой паспорт:<\/p><p class=\"tpl\">AD L AS<\/p><p class=\"tpl\">к в в к<\/p><p class=\"tpl\">30 сек 60 сек С128 60 сек 30 сек<\/p><p class=\"tpl\">70 сек С2048 70 сек<\/p><p class=\"tpl\">6 м ШР 6 м<\/p><p class=\"tpl\">более 6 м РР более 6 м<\/p><p class=\"tpl\">Вестибулярные функции не нарушены.<\/p>", "s": "Копируйте в карту, пустые места заполняйте Жалобы: на заложенность носа/дыхание ртом, сопение/храп, изменение голоса, выделения из носа, чихание/ зуд, жжение в носу, снижение обоняния/ слабость, недомогание, раздражительность, головная боль, повышенная утомляемость, нарушение сна, повышение температуры(редко) Анамнез заболевания: вышеописанные жалобы отмечает в течение ( указать продолжительность симптомов). Отмечает связь с контактом причинно-значимого аллергена/ не отмечает. Терапию самостоятельно принимал/не принимал. Обратился в поликлинику по м/ж. Анамнез жизни: Не отягощен, без особенностей/ описать. ВИЧ, Гепатит В, С, сифилис, туберкулез отрицает. Операции, гемотрансфузии отрицает. Вредные привычки: отрицает Эпидемиологический анамнез: Выезды в эпидемиологически неблагополучные территории и другие страны отрицает. В контакте с инфекционными больными не находился Аллергологический анамнез: не отягощен/ перечислить возможные аллергические реакции на пищевые продукты, препараты и т. п., указать характер проявлений: отек Квинке, крапивница, зуд и т. д Лекарственная непереносимость: отрицает/ да (перечислить лекарственные препараты и указать характер проявлений : отек Квинке, крапивница, зуд и тд.) Хронические заболевания: отрицает/ перечислить если есть Наследственный анамнез: отягощен/ не отягощен Вредные привычки: отрицает / употребляет алкоголь/ курение ( стаж курения и сколько выкури  спрей 1 доза (0,14 мг) в каждый ход 2 раза/сут, при необходимости 2 дозы; не более 6 месяцев Кромоглициевая кислота спрей 1 доза (2,8 мкг) в каждый ход 4 раза/сут (при необходимости 6 раз); курс 4 недели Монтелукаст 10 мг 1 раз/сут, курс от 1 до 3 месяцев и более Комбинации Азеластин + мометазон (≥ 18 лет) 1 доза в каждый ход 2 раза/сут, курс 2 недели; азеластин + флутиказон 1 доза 2 раза/сут; мометазон + олопатадин 2 дозы в каждый ход 2 раза/сут; левоцетиризин + монтелукаст 5/10 мг 1 раз/сут Сосудосуживающие Оксиметазолин 0,05%: 1-2 дозы в каждый ход 2-3 раза/сут, 3-4 дня; ксилометазолин 0,1%: 1 доза 1-3 раза/сут, не более 5-7 дней; более 10 дней нельзя (медикаментозный ринит) Оценка эффекта Через 2-4 недели от начала; цель: полный контроль симптомов. Диспансерный приём взрослым не реже 1 раза в год. Системные ГКС: только при тяжёлом обострении или как 4 линия, депо-формы не рекомендуются АСИТ, аллерголог АСИТ рассмотреть при ремиссии; перед ней ЭКГ; противопоказание ОФВ1 менее 70%. Аллерголог: кожные тесты, АСИТ, омализумаб, подтверждение или исключение БА"}, {"k": "t5", "l": "Схемы из вашего справочника", "h": "<p>Тема l013: Аллергический ринит<\/p><ul><li>гипоаллергенная диета;<\/li><li>спрей Виброцил, , по 2 впрыска в каждый носовой ход * 2 раза в день (7 дней);<\/li><li>через 10 минут после Виброцила - промывание полости носа солевым раствором (Долфин, Аквамарис) * 2 раза в день (7 дней);<\/li><li>после Долфина - спрей Авамис (Назонекс) по 2 впрыска в каждый носовой ход * 2 раза в день (7 дней);<\/li><li>таблетки Цетрин по 1 таблетке * 1 раз в день (7 дней);<\/li><\/ul>", "s": "Тема l013: Аллергический ринит гипоаллергенная диета; спрей Виброцил, , по 2 впрыска в каждый носовой ход * 2 раза в день (7 дней); через 10 минут после Виброцила - промывание полости носа солевым раствором (Долфин, Аквамарис) * 2 раза в день (7 дней); после Долфина - спрей Авамис (Назонекс) по 2 впрыска в каждый носовой ход * 2 раза в день (7 дней); таблетки Цетрин по 1 таблетке * 1 раз в день (7 дней);"}, {"k": "t6", "l": "Замечания", "h": "<ul><li>Сверка со справочником (c09, l013): Виброцил 2 впрыска 2 раза 7 дней: КР допускает комбинацию диметинден + фенилэфрин до 7 дней, но ксилометазолин не более 5-7 дней, оксиметазолин 3-4 дня, дольше 10 дней не рекомендуется. Авамис (флутиказона фуроат) по 2 впрыска в каждый ход: по КР 2 впрыска (55 мкг) в каждый ход 1 раз в сутки, а в справочнике 2 раза в день, это выше дозы КР. Цетрин 1 таблетка 1 раз в день: по КР цетиризин 5-10 мг 1 раз в сутки, совпадает. Курс 7 дней в справочнике, а по КР эффект терапии оценивают через 2-4 недели. Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам.<\/li><\/ul>", "s": "Сверка со справочником (c09, l013): Виброцил 2 впрыска 2 раза 7 дней: КР допускает комбинацию диметинден + фенилэфрин до 7 дней, но ксилометазолин не более 5-7 дней, оксиметазолин 3-4 дня, дольше 10 дней не рекомендуется. Авамис (флутиказона фуроат) по 2 впрыска в каждый ход: по КР 2 впрыска (55 мкг) в каждый ход 1 раз в сутки, а в справочнике 2 раза в день, это выше дозы КР. Цетрин 1 таблетка 1 раз в день: по КР цетиризин 5-10 мг 1 раз в сутки, совпадает. Курс 7 дней в справочнике, а по КР эффект терапии оценивают через 2-4 недели. Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам."}, {"k": "info", "l": "О листе", "h": "<p>Шаблон приёма, формулировки диагнозов, коды и обследование взяты из присланного вами документа (краткие КР). Источник: Клинические рекомендации “ Аллергический ринит ” 2024. Схемы лечения из вашего справочника добавлены отдельным блоком. Дата сборки: 18.11.2026.<\/p>", "s": ""}]}, {"id": "k03", "t": "Артериальная гипертензия", "g": "c1", "kw": "гипертония давление АГ I10 I11.0 I11.9 I12.0 I12.9 I13.0 I13.1 I13.2 I13.9 I15 I15.0 I15.1 I15.2 I иске &lt; 1,4 ммоль/л. <span class=\"lb lb-kr\">КР<\/span> Из вашего справочника: розувастатин 10 мг вечером либо аторвастатин 10 мг. <span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/li><li>Ацетилсалициловая кислота в малой дозе: для вторичной профилактики при атеросклеротических ССЗ рекомендована; для первичной профилактики всем пациентам с АГ не рекомендуется. <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul><h3>Высокое АД и кризы<\/h3><p>В тексте КР 2024, который я прочитала, каптоприл и моксонидин под язык для снижения АД не найдены. Нифедипин под язык там назван противопоказанным (в разделе о неотложной помощи при беременности). Осложнённый криз (признаки поражения органов-мишеней): вызов скорой помощи, терапия внутривенно в стационаре; снижать АД не более чем на 25% за первые 2 часа. <span class=\"lb lb-kr\">КР<\/span> В вашем справочнике есть другой подход: при АД ≥ 160/100 каптоприл 25 мг под язык; при АД ≥ 180/120 каптоприл 50 мг или моксонидин 0,4 мг под язык. <span class=\"lb lb-pk\">ПРАКТИКА<\/span> Моксонидин противопоказан при слабости синусового узла, АВ-блокаде 2-3 степени, ЧСС &lt; 50, сердечной недостаточности. Решение остаётся за вами.<\/p>", "s": "Немедикаментозное (всем) Соль до 5 г в сутки; ограничить алкоголь; больше овощей, фруктов, рыбы, орехов, молочных продуктов низкой жирности, меньше мяса; ИМТ 20-25 кг/м², окружность талии ЛЕЧ Когда начинать лекарства и как 2-3 степень: препараты сразу, вместе с изменением образа жизни, при любом риске. КР 1 степень: при высоком риске или поражении органов-мишеней препараты сразу; при низком и умеренном риске без ПОМ сначала 3 месяца образ жизни, затем препараты, если АД не снизилось. КР ЛЕЧ Начинать с двух препаратов (предпочтительно в одной таблетке) почти у всех. Монотерапия: низкий риск при АД КР Предпочтительные пары: ИАПФ или БРА + антагонист кальция либо диуретик. Тройная схема: блокатор РААС + антагонист кальция + тиазидный или тиазидоподобный диуретик. КР Титрация каждые 2-4 недели, цель за 3 месяца: К ведёт врач-терапевт (при резистентной АГ кардиолог). Частота зависит от группы. <span class=\"lb lb-kr\">КР<\/span><\/p><div class=\"tw\"><table><thead><tr><th>Группа<\/th><th>Приёмы<\/th><th>Что проверять<\/th><\/tr><\/thead><tbody><tr><td>АГ без ПОМ, ССЗ, ЦВБ, ХБП<\/td><td>Не реже 1 раза в год, если АД на цели<\/td><td>ЭКГ ежегодно; глюкоза и общий холестерин ежегодно; липиды, калий, натрий, креатинин, альбумин в моче раз в 2 года; ЭхоКГ при включении в наблюдение, дальше по показаниям, не реже 1 раза в 2 года<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>Группа<\/th><th>Приёмы<\/th><th>Что проверять<\/th><\/tr><\/thead><tbody><tr><td>АГ с ПОМ, без ССЗ, ЦВБ, ХБП<\/td><td>Не реже 2 раз в год<\/td><td>ЭКГ ежегодно; ЭхоКГ при изменениях на ЭКГ, ежегодно, если АД не на цели; глюкоза и общий холестерин ежегодно; липиды, калий, натрий, креатинин, альбумин в моче раз в 2 года; дуплекс сонных артерий раз в 2 года; гемоглобин раз в 2 года; пересчёт риска (SCORE2)<\/td><\/tr><tr><td>АГ с ССЗ, ЦВБ или ХБП<\/td><td>Не реже 2 раз в год<\/td><td>ЭКГ 2 раза в год; креатинин, калий, натрий, ОАМ и альбумин в моче ежегодно; глюкоза и общий холестерин ежегодно; ЭхоКГ не реже 1 раза в год, если АД не на цели; дуплекс сонных артерий раз в 2 года; пересчёт риска<\/td><\/tr><\/tbody><\/table><\/div><p>Источник: алгоритм диспансерного наблюдения из КР 2024. Также в КР: пока цель не достигнута, визиты каждые 3-4 недели; после гипертонического криза не реже 1 раза в месяц до достижения цели; при высоком и очень высоком риске на цели не реже 1 раза в 3 месяца; при низком и умеренном риске с домашним измерением АД каждые 4-6 месяцев.<\/p><p>План по приказу 168н (по записям вашего справочника)<\/p><div class=\"tw\"><table><thead><tr><th>Показатель<\/th><th>Частота<\/th><th>Подтверждение<\/th><\/tr><\/thead><tbody><tr><td>Вес (ИМТ), окружность талии, статус курения<\/td><td>при каждом приёме<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>АД и ЧСС<\/td><td>1 раз в 3 месяца (запись в справочнике)<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>СКФ, ХС ЛПНП, альбуминурия (разовая порция мочи), ЭКГ, ЭхоКГ<\/td><td>не реже 1 раза в год<\/td><td>совпадает с методическими материалами по приказу 168н<\/td><\/tr><\/tbody><\/table><\/div><p>Проверить: частоту приёмов (визитов) по самому приказу 168н (приложение 1) я по открытым источникам подтвердить не смогла, поэтому её в лист не вносила. Для диагноза в карте: «Присвоена 3а группа здоровья, поставлен на Д учёт; проведено краткое профилактическое консультирование».<\/p><p>Минимум на визите через 6 месяцев<\/p><ul><li>Жалобы, приверженность лечению, побочные эффекты; дневник АД и пульса.<\/li><li>Измерение АД и ЧСС, ИМТ, окружность талии, курение.<\/li><li>Если после старта или изменения терапии прошло 2-4 недели: креатинин и калий. Раз в год: СКФ, ЛПНП, альбуминурия, ЭКГ, ЭхоКГ (по группе).<\/li><li>Оценка достижения цели АД и корректировка по ступеням; пересмотр диагноза (ФР, ПОМ, ССЗ, ХБП, риск).<\/li><\/ul>", "s": "Наблюдение пожизненное, ведёт врач-терапевт (при резистентной АГ кардиолог). Частота зависит от группы. КР Группа Приёмы Что проверять АГ без ПОМ, ССЗ, ЦВБ, ХБП Не реже 1 раза в год, если АД на цели ЭКГ ежегодно; глюкоза и общий холестерин ежегодно; липиды, калий, натрий, креатинин, альбумин в моче раз в 2 года; ЭхоКГ при включении в наблюдение, дальше по показаниям, не реже 1 раза в 2 года Группа Приёмы Что проверять АГ с ПОМ, без ССЗ, ЦВБ, ХБП Не реже 2 раз в год ЭКГ ежегодно; ЭхоКГ при изменениях на ЭКГ, ежегодно, если АД не на цели; глюкоза и общий холестерин ежегодно; липиды, калий, натрий, креатинин, альбумин в моче раз в 2 года; дуплекс сонных артерий раз в 2 года; гемоглобин раз в 2 года; пересчёт риска (SCORE2) АГ с ССЗ, ЦВБ или ХБП Не реже 2 раз в год ЭКГ 2 раза в год; креатинин, калий, натрий, ОАМ и альбумин в моче ежегодно; глюкоза и общий холестерин ежегодно; ЭхоКГ не реже 1 раза в год, если АД не на цели; дуплекс сонных артерий раз в 2 года; пересчёт риска Источник: алгоритм диспансерного наблюдения из КР 2024. Также в КР: пока цель не достигнута, визиты каждые 3-4 недели; после гипертонического криза не реже 1 раза в месяц до достижения цели; при высоком и очень высоком риске на цели не реже 1 раза в 3 месяца; при низком и умеренном риске с домашним измерением АД каждые 4-6 месяцев. План по приказу 168н (по записям вашего справочника) Показатель Частота Подтверждение Вес (ИМТ), окружность талии, статус курения при каждом приёме ЛЕЧ АД и ЧСС 1 раз в 3 месяца (запись в справочнике) ЛЕЧ СКФ, ХС ЛПНП, альбуминурия (разовая порция мочи), ЭКГ, ЭхоКГ не реже 1 раза в год совпадает с методическими материалами по приказу 168н Проверить: частоту приёмов (визитов) по самому приказу 168н (приложение 1) я по открытым источникам подтвердить не смогла, поэтому её в лист не вносила. Для диагноза в карте: «Присвоена 3а группа здоровья, поставлен на Д учёт; проведено краткое профилактическое консультирование». Минимум на визите через 6 месяцев Жалобы, приверженность лечению, побочные эффекты; дневник АД и пульса. Измерение АД и ЧСС, ИМТ, окружность талии, курение. Если после старта или изменения терапии прошло 2-4 недели: креатинин и калий. Раз в год: СКФ, ЛПНП, альбуминурия, ЭКГ, ЭхоКГ (по группе). Оценка достижения цели АД и корректировка по ступеням; пересмотр диагноза (ФР, ПОМ, ССЗ, ХБП, риск)."}, {"k": "t5", "l": "Проверка", "h": "<ul><li>Совпадает с КР 2024: логика ступеней (двойная комбинация сразу при 2-3 степени, затем тройная, затем спиронолактон), срок цели 3 месяца, титрация каждые 2-4 недели, показания к бета-блокаторам.<\/li><li>Не подтверждено КР: каптоприл 25-50 мг и моксонидин 0,4 мг под язык; дозы конкретных препаратов (в КР доз нет); доза эплеренона 25 мг.<\/li><li>Расхождения: целевое АД записано по-разному в разных темах (см. раздел 2); в теме «Назначения» стадия и степень объединены в одну строку («Гипертоническая болезнь 2 ст. Артериальная гипертония 2 ст»). В диагнозе стадия и степень указываются отдельно.<\/li><li>Опечатки: «Темисартан», «амплодипин», «Аретриальная гиепртония»; Конкор 5+5 назван «Конкор АМ» в другой записи.<\/li><li>Не включено: милдронат, мексидол, панангин и подобные препараты из тем по ИБС: в КР по АГ они не рекомендуются, и к лечению АГ не относятся. Как проверено: текст КР 2024 я прочитала в версии журнала «Российский кардиологический журнал» 2024; 29(9): 6117 автоматическим способом. Перед использованием сверьте целевые уровни АД, интервалы наблюдения и дозы с официальным текстом в Рубрикаторе клинических рекомендаций (cr.minzdrav.gov.ru) и с инструкциями препаратов.<\/li><\/ul>", "s": "Совпадает с КР 2024: логика ступеней (двойная комбинация сразу при 2-3 степени, затем тройная, затем спиронолактон), срок цели 3 месяца, титрация каждые 2-4 недели, показания к бета-блокаторам. Не подтверждено КР: каптоприл 25-50 мг и моксонидин 0,4 мг под язык; дозы конкретных препаратов (в КР доз нет); доза эплеренона 25 мг. Расхождения: целевое АД записано по-разному в разных темах (см. раздел 2); в теме «Назначения» стадия и степень объединены в одну строку («Гипертоническая болезнь 2 ст. Артериальная гипертония 2 ст»). В диагнозе стадия и степень указываются отдельно. Опечатки: «Темисартан», «амплодипин», «Аретриальная гиепртония»; Конкор 5+5 назван «Конкор АМ» в другой записи. Не включено: милдронат, мексидол, панангин и подобные препараты из тем по ИБС: в КР по АГ они не рекомендуются, и к лечению АГ не относятся. Как проверено: текст КР 2024 я прочитала в версии журнала «Российский кардиологический журнал» 2024; 29(9): 6117 автоматическим способом. Перед использованием сверьте целевые уровни АД, интервалы наблюдения и дозы с официальным текстом в Рубрикаторе клинических рекомендаций (cr.minzdrav.gov.ru) и с инструкциями препаратов."}, {"k": "info", "l": "О листе", "h": "<p>Собрано из вашего справочника и сверено с клиническими рекомендациями «Артериальная гипертензия у взрослых» 2024 г. (одобрены Научно-практическим советом Минздрава РФ 12.09.2024) и приказом 168н о диспансерном наблюдении. Дата сборки: 15.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР 2024<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx» (раздел Кардиология): основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей, шаблоны); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k04", "t": "Боль в спине (люмбалгия, остеохондроз)", "g": "c6", "kw": "B12 G55.1 M42.1 M51.1 M54.2 M54.4 M54.5 M54.6 M54.9", "tabs": [{"k": "t1", "l": "Что оценить на приёме", "h": "<p>Красные флажки (при любом из них не лечить как «просто спину», нужны визуализация и/или специалист): возраст моложе 18 и старше 50; недавняя травма; онкология в анамнезе; лихорадка, инфекция, иммунодефицит, ВИЧ, наркомания; длительный приём ГКС; необъяснимое похудание; прогрессирующая боль, не стихающая в покое; боль в грудной клетке, животе, промежности; связь боли с дефекацией и мочеиспусканием; тазовые нарушения, парезы ног, онемение промежности (синдром конского хвоста: срочно к нейрохирургу). <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/p><div class=\"tw\"><table><thead><tr><th>Что сделать<\/th><th>Комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td>Жалобы, анамнез, опрос на красные флажки<\/td><td>Характер и локализация боли, иррадиация, триггеры, предыдущие эпизоды<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Осмотр: движения в позвоночнике, пальпация, неврологический статус<\/td><td>Сила в ногах, чувствительность, коленные и ахилловы рефлексы; симптомы Ласега (L5-S1), Вассермана (L3-L4), Мацкевича; тесты на крестцово-подвздошное сочленение<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td>Шкалы боли и функции<\/td><td>ВАШ или ЧРШ; опросник Освестри (поясница) или NDI (шея)<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td>Рентген и МРТ<\/td><td>Не нужны при острой боли у 18-50 лет без красных флажков. Нужны при красных флажках; если нет улучшения за 4 недели; при подострой и хронической боли. МРТ предпочтительнее КТ. Срочно при синдроме конского хвоста<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Анализы<\/td><td>КР: без признаков специфической причины не нужны. Креатинин с СКФ, АЛТ, АСТ нужны перед НПВП (безопасность). ОАК, СОЭ, СРБ: при подозрении на воспаление, инфекцию, спондилоартрит<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td>Консультация невролога<\/td><td>Ласег положительный, парез, нарастающая неврология, нет эффекта; нейрохирург при грыже со стенозом, парезе, неэффективности 6-12 недель<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Проверить: ваш раздел l101 («рентген позвоночника всем») расходится с КР: при остром течении без красных флажков рентген и МРТ не рекомендуются.<\/p>", "s": "Красные флажки (при любом из них не лечить как «просто спину», нужны визуализация и/или специалист): возраст моложе 18 и старше 50; недавняя травма; онкология в анамнезе; лихорадка, инфекция, иммунодефицит, ВИЧ, наркомания; длительный приём ГКС; необъяснимое похудание; прогрессирующая боль, не стихающая в покое; боль в грудной клетке, животе, промежности; связь боли с дефекацией и мочеиспусканием; тазовые нарушения, парезы ног, онемение промежности (синдром конского хвоста: срочно к нейрохирургу). КР ЛЕЧ Что сделать Комментарий Источник Жалобы, анамнез, опрос на красные флажки Характер и локализация боли, иррадиация, триггеры, предыдущие эпизоды КР ЛЕЧ Осмотр: движения в позвоночнике, пальпация, неврологический статус Сила в ногах, чувствительность, коленные и ахилловы рефлексы; симптомы Ласега (L5-S1), Вассермана (L3-L4), Мацкевича; тесты на крестцово-подвздошное сочленение КР СПР Шкалы боли и функции ВАШ или ЧРШ; опросник Освестри (поясница) или NDI (шея) КР СПР Рентген и МРТ Не нужны при острой боли у 18-50 лет без красных флажков. Нужны при красных флажках; если нет улучшения за 4 недели; при подострой и хронической боли. МРТ предпочтительнее КТ. Срочно при синдроме конского хвоста КР Анализы КР: без признаков специфической причины не нужны. Креатинин с СКФ, АЛТ, АСТ нужны перед НПВП (безопасность). ОАК, СОЭ, СРБ: при подозрении на воспаление, инфекцию, спондилоартрит КР СПР Консультация невролога Ласег положительный, парез, нарастающая неврология, нет эффекта; нейрохирург при грыже со стенозом, парезе, неэффективности 6-12 недель ЛЕЧ КР Проверить: ваш раздел l101 («рентген позвоночника всем») расходится с КР: при остром течении без красных флажков рентген и МРТ не рекомендуются."}, {"k": "t2", "l": "Формулировка диагноза и код", "h": "<div class=\"tw\"><table><thead><tr><th>Люмбалгия / вертеброгенная люмбоишиалгия [острая до 4 недель / подострая 4-12 / хроническая &gt; 12], [на фоне остеохондроза L_-L_ / дегенеративно-дистрофических изменений позвоночника], [слева / справа / двусторонняя], [выраженный / умеренный болевой синдром (ВАШ __)], [мышечно-тонический синдром], [фаза обострения / неполной ремиссии]. [Корешковый синдром L5/S1.]<\/th><th><\/th><th><\/th><\/tr><\/thead><tbody><tr><td>Код<\/td><td>Когда<\/td><td>Источник<\/td><\/tr><tr><td>M54.5<\/td><td>Боль внизу спины (люмбалгия): самый частый код у терапевта; структурных изменений нет или они не подтверждены<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>M54.4<\/td><td>Люмбаго с ишиасом (люмбоишиалгия)<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>M54.2 / M54.6<\/td><td>Цервикалгия / боль в грудном отделе (торакалгия)<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>M42.1<\/td><td>Остеохондроз позвоночника у взрослых: только при подтверждённых рентгеном или МРТ признаках дегенерации дисков<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>M51.1, G55.1<\/td><td>Поражение межпозвонкового диска поясничного отдела с радикулопатией (КР по радикулопатии)<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>M54.9<\/td><td>Дорсалгия неуточнённая<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Примеры (ваш справочник): «М42.1 Хроническая люмбалгия на фоне остеохондроза поясничного отдела позвоночника (L3-L4), рецидивирующее течение, фаза неполной ремиссии, слабовыраженный болевой синдром»; «М54.4 Хроническая вертеброгенная двусторонняя люмбоишиалгия с выраженными мышечно-тоническими проявлениями, рецидивирующее течение, фаза обострения».<\/p>", "s": "Люмбалгия / вертеброгенная люмбоишиалгия [острая до 4 недель / подострая 4-12 / хроническая > 12], [на фоне остеохондроза L_-L_ / дегенеративно-дистрофических изменений позвоночника], [слева / справа / двусторонняя], [выраженный / умеренный болевой синдром (ВАШ __)], [мышечно-тонический синдром], [фаза обострения / неполной ремиссии]. [Корешковый синдром L5/S1.] Код Когда Источник M54.5 Боль внизу спины (люмбалгия): самый частый код у терапевта; структурных изменений нет или они не подтверждены ЛЕЧ КР M54.4 Люмбаго с ишиасом (люмбоишиалгия) ЛЕЧ M54.2 / M54.6 Цервикалгия / боль в грудном отделе (торакалгия) ЛЕЧ M42.1 Остеохондроз позвоночника у взрослых: только при подтверждённых рентгеном или МРТ признаках дегенерации дисков ЛЕЧ M51.1, G55.1 Поражение межпозвонкового диска поясничного отдела с радикулопатией (КР по радикулопатии) КР ЛЕЧ M54.9 Дорсалгия неуточнённая ЛЕЧ Примеры (ваш справочник): «М42.1 Хроническая люмбалгия на фоне остеохондроза поясничного отдела позвоночника (L3-L4), рецидивирующее течение, фаза неполной ремиссии, слабовыраженный болевой синдром»; «М54.4 Хроническая вертеброгенная двусторонняя люмбоишиалгия с выраженными мышечно-тоническими проявлениями, рецидивирующее течение, фаза обострения»."}, {"k": "t3", "l": "Лечение острой боли", "h": "<p>Режим и активность: сохранять посильную активность, избегать постельного режима (при интенсивной боли не более 1-2 дней, при радикулопатии не более 3-5 дней). Исключить тяжёлые нагрузки. Тепло, ЛФК после уменьшения боли (без резких сгибаний, разгибаний и вращений). Корсеты, бандажи и вытяжение КР не рекомендует. <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/p><div class=\"tw\"><table><thead><tr><th>Группа<\/th><th>Схема по вашему справочнику (дозы КР не приводит)<\/th><th>Что говорит КР<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td>НПВП: выбрать ОДИН, с 1-2-го дня<\/td><td>Лорноксикам (Ксефокам рапид) 8 мг 2 раза в сутки 7 дней (l101) или 8 мг 1 раз до еды 7 дней (l115). Мелоксикам 15 мг 1 раз в сутки до 10-14 дней (l115). Декскетопрофен 25 мг 3 раза 2 дня, затем переход (l115). Целекоксиб 200 мг 2 раза 5 дней. Эторикоксиб 60-90 мг 1 раз до 14 дней. Диклофенак 3 мл в/м 1 раз 5 дней (l108)<\/td><td>Эффективная доза на минимальный срок, желательно не более 10-14 дней. Не комбинировать НПВП. Предпочтительны таблетки. При риске ЖКТ: мелоксикам, нимесулид, ацеклофенак или коксибы + гастропротекция. Противопоказаны при язве, тяжёлой почечной и печёночной недостаточности, выраженной СН, беременности<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Защита желудка<\/td><td>Омепразол (Омез) 20 мг 1 раз утром за 30 минут до еды на весь курс НПВП; пантопразол 40 мг (в l101 2 раза в день 7 дней)<\/td><td>В КР только упоминание гастропротекции; доз нет<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Миорелаксант: ОДИН<\/td><td>Толперизон (Мидокалм) 150 мг 3 раза в день до 10 дней; Мидокалм лонг 450 мг 1 раз; в/м 1 мл 2 раза (l108) или 2 мл 1 раз (l115) 5-10 дней. Тизанидин 2 мг 3 раза до 10 дней<\/td><td>Рекомендованы при острой боли для снятия мышечного гипертонуса и усиления НПВП. Не комбинировать между собой. Учитывать седацию<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Витамины группы B<\/td><td>Мильгамма или Комбилипен 2 мл в/м 1 раз 10 дней, затем 1 таб. 2 раза в день до 1 месяца<\/td><td>B1+B6/B12 дополнительно к НПВП при острой боли<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Местно<\/td><td>Диклофенак, Вольтарен, Найз-гель, Аэртал 3 раза в день 10-15 дней<\/td><td>В КР местные формы отдельно не разбираются<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Парацетамол<\/td><td>В справочнике схемы нет<\/td><td>Не как монотерапия; если НПВП нельзя или не переносятся, или вместе с НПВП<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Если не помогло или нельзя НПВП<\/p><ul><li>Диклофенак + орфенадрин кратковременно при острой высокоинтенсивной боли. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Трамадол или тапентадол только при непереносимой боли, когда другое не помогает; опиоиды в целом не рекомендуются. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Габапентиноиды (габапентин, прегабалин) рекомендованы КР по радикулопатии; в КР по неспецифической боли не упомянуты. У вас: «если все НПВС не помогают - Тебантин». <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/li><li>Дексаметазон, преднизолон (внутрь, в/м, в/в) КР не рекомендует (короткий эффект, серьёзные нежелательные явления). В вашем разделе l115: дексаметазон 8 мг в/в капельно, затем 12 мг в/м 9 дней. Проверить: эту схему я бы не применяла без обсуждения с неврологом. <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/li><li>Эпидуральные блокады при радикулопатии: решает невролог, не чаще 4 раз в год. <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul>", "s": "Режим и активность: сохранять посильную активность, избегать постельного режима (при интенсивной боли не более 1-2 дней, при радикулопатии не более 3-5 дней). Исключить тяжёлые нагрузки. Тепло, ЛФК после уменьшения боли (без резких сгибаний, разгибаний и вращений). Корсеты, бандажи и вытяжение КР не рекомендует. КР ЛЕЧ Группа Схема по вашему справочнику (дозы КР не приводит) Что говорит КР Источник НПВП: выбрать ОДИН, с 1-2-го дня Лорноксикам (Ксефокам рапид) 8 мг 2 раза в сутки 7 дней (l101) или 8 мг 1 раз до еды 7 дней (l115). Мелоксикам 15 мг 1 раз в сутки до 10-14 дней (l115). Декскетопрофен 25 мг 3 раза 2 дня, затем переход (l115). Целекоксиб 200 мг 2 раза 5 дней. Эторикоксиб 60-90 мг 1 раз до 14 дней. Диклофенак 3 мл в/м 1 раз 5 дней (l108) Эффективная доза на минимальный срок, желательно не более 10-14 дней. Не комбинировать НПВП. Предпочтительны таблетки. При риске ЖКТ: мелоксикам, нимесулид, ацеклофенак или коксибы + гастропротекция. Противопоказаны при язве, тяжёлой почечной и печёночной недостаточности, выраженной СН, беременности КР ЛЕЧ Защита желудка Омепразол (Омез) 20 мг 1 раз утром за 30 минут до еды на весь курс НПВП; пантопразол 40 мг (в l101 2 раза в день 7 дней) В КР только упоминание гастропротекции; доз нет ЛЕЧ КР Миорелаксант: ОДИН Толперизон (Мидокалм) 150 мг 3 раза в день до 10 дней; Мидокалм лонг 450 мг 1 раз; в/м 1 мл 2 раза (l108) или 2 мл 1 раз (l115) 5-10 дней. Тизанидин 2 мг 3 раза до 10 дней Рекомендованы при острой боли для снятия мышечного гипертонуса и усиления НПВП. Не комбинировать между собой. Учитывать седацию КР ЛЕЧ Витамины группы B Мильгамма или Комбилипен 2 мл в/м 1 раз 10 дней, затем 1 таб. 2 раза в день до 1 месяца B1+B6/B12 дополнительно к НПВП при острой боли КР ЛЕЧ Местно Диклофенак, Вольтарен, Найз-гель, Аэртал 3 раза в день 10-15 дней В КР местные формы отдельно не разбираются ЛЕЧ Парацетамол В справочнике схемы нет Не как монотерапия; если НПВП нельзя или не переносятся, или вместе с НПВП КР Если не помогло или нельзя НПВП Диклофенак + орфенадрин кратковременно при острой высокоинтенсивной боли. КР Трамадол или тапентадол только при непереносимой боли, когда другое не помогает; опиоиды в целом не рекомендуются. КР Габапентиноиды (габапентин, прегабалин) рекомендованы КР по радикулопатии; в КР по неспецифической боли не упомянуты. У вас: «если все НПВС не помогают - Тебантин». КР ЛЕЧ Дексаметазон, преднизолон (внутрь, в/м, в/в) КР не рекомендует (короткий эффект, серьёзные нежелательные явления). В вашем разделе l115: дексаметазон 8 мг в/в капельно, затем 12 мг в/м 9 дней. Проверить: эту схему я бы не применяла без обсуждения с неврологом. КР ЛЕЧ Эпидуральные блокады при радикулопатии: решает невролог, не чаще 4 раз в год. КР"}, {"k": "t4", "l": "Подострая и хроническая боль", "h": "<ul><li>МРТ или рентген одного отдела, оценка психосоциальных факторов (тревога, депрессия, условия труда). <span class=\"lb lb-kr\">КР<\/span><\/li><li>ЛФК, плавание, ходьба, мануальная терапия, массаж, рефлексотерапия; при хронической боли антидепрессанты (амитриптилин, дулоксетин) и когнитивно-поведенческая терапия; санаторно-курортное лечение. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Хирургическое лечение при неспецифической боли не рекомендуется; при радикулопатии нейрохирург при отсутствии эффекта через 6-12 недель, парезе, грыже при МРТ. <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul>", "s": "МРТ или рентген одного отдела, оценка психосоциальных факторов (тревога, депрессия, условия труда). КР ЛФК, плавание, ходьба, мануальная терапия, массаж, рефлексотерапия; при хронической боли антидепрессанты (амитриптилин, дулоксетин) и когнитивно-поведенческая терапия; санаторно-курортное лечение. КР Хирургическое лечение при неспецифической боли не рекомендуется; при радикулопатии нейрохирург при отсутствии эффекта через 6-12 недель, парезе, грыже при МРТ. КР"}, {"k": "t5", "l": "Наблюдение через 6 месяцев", "h": "<ul><li>Отдельного графика диспансерного наблюдения КР не называет. Практически: оценка боли по ВАШ и функции по Освестри, красные флажки, приём НПВП и его безопасность (креатинин, АД, ЖКТ), рецидивы (у каждого третьего в течение года). <span class=\"lb lb-kr\">КР<\/span><\/li><li>Профилактика: избегать длительных статических нагрузок и переохлаждения, ЛФК, плавание, ходьба, снижение массы тела. <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/li><li>Направление: нейрохирург при синдроме конского хвоста, грыже со стенозом, слабости в ногах; онколог при подозрении на опухоль; ревматолог при подозрении на спондилоартрит; хирург при подозрении на аневризму аорты. <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul>", "s": "Отдельного графика диспансерного наблюдения КР не называет. Практически: оценка боли по ВАШ и функции по Освестри, красные флажки, приём НПВП и его безопасность (креатинин, АД, ЖКТ), рецидивы (у каждого третьего в течение года). КР Профилактика: избегать длительных статических нагрузок и переохлаждения, ЛФК, плавание, ходьба, снижение массы тела. КР ЛЕЧ Направление: нейрохирург при синдроме конского хвоста, грыже со стенозом, слабости в ногах; онколог при подозрении на опухоль; ревматолог при подозрении на спондилоартрит; хирург при подозрении на аневризму аорты. КР"}, {"k": "t6", "l": "Проверка", "h": "<ul><li>Совпадает с КР: НПВП с первых суток на короткий срок, гастропротекция, миорелаксант на острую боль, витамины B вместе с НПВП, красные флажки (в l101 их 20 пунктов: те же, что в КР), МРТ при отсутствии эффекта за 4 недели.<\/li><li>Расхождения: (1) ГКС (дексаметазон) в l115: КР не рекомендует; (2) рентген всем при остром течении: КР не рекомендует; (3) в l108 в одной записи идут сразу несколько НПВП (диклофенак, Ксефокам, Амелотекс): их нельзя комбинировать, это варианты на выбор; (4) пантопразол 40 мг 2 раза в день для защиты желудка: для профилактики обычно достаточно 1 раза (в КР доз нет, сверьте с инструкцией); (5) Мидокалм в/м: 1 мл 2 раза (l108, Шаблоны) и 2 мл 1 раз (l115) расходятся.<\/li><li>Не из КР: Комбилипен/Мильгамма 10 дней и затем 1 месяц (КР срок не называет); Аэртал и другие местные НПВП; Тебантин (только в КР по радикулопатии). Как проверено: тексты КР получены автоматическим чтением (КР по неспецифической боли на сайте MedElement, по радикулопатии на pravo.ppt.ru; около 100 тыс. знаков каждая). В обеих КР доз препаратов нет, дозы взяты из вашего справочника: сверьте с инструкциями. Официальный текст: cr.minzdrav.gov.ru.<\/li><\/ul>", "s": "Совпадает с КР: НПВП с первых суток на короткий срок, гастропротекция, миорелаксант на острую боль, витамины B вместе с НПВП, красные флажки (в l101 их 20 пунктов: те же, что в КР), МРТ при отсутствии эффекта за 4 недели. Расхождения: (1) ГКС (дексаметазон) в l115: КР не рекомендует; (2) рентген всем при остром течении: КР не рекомендует; (3) в l108 в одной записи идут сразу несколько НПВП (диклофенак, Ксефокам, Амелотекс): их нельзя комбинировать, это варианты на выбор; (4) пантопразол 40 мг 2 раза в день для защиты желудка: для профилактики обычно достаточно 1 раза (в КР доз нет, сверьте с инструкцией); (5) Мидокалм в/м: 1 мл 2 раза (l108, Шаблоны) и 2 мл 1 раз (l115) расходятся. Не из КР: Комбилипен/Мильгамма 10 дней и затем 1 месяц (КР срок не называет); Аэртал и другие местные НПВП; Тебантин (только в КР по радикулопатии). Как проверено: тексты КР получены автоматическим чтением (КР по неспецифической боли на сайте MedElement, по радикулопатии на pravo.ppt.ru; около 100 тыс. знаков каждая). В обеих КР доз препаратов нет, дозы взяты из вашего справочника: сверьте с инструкциями. Официальный текст: cr.minzdrav.gov.ru."}, {"k": "info", "l": "О листе", "h": "<p>Собрано из вашего справочника («лечение.docx» Неврология l101, l108, l115; затем «Шаблоны», «Алгоритмы», «Назначения», «Быстро») и сверено с КР «Скелетно-мышечные (неспецифические) боли в нижней части спины» 2023 (взрослые, ID 778, пересмотр не позднее 2025) и КР «Дискогенная пояснично-крестцовая радикулопатия» 2023 (взрослые, коды M51.1, G55.1). Дата сборки: 16.11.2026. Обе КР помечены как подлежащие пересмотру в 2025 году: проверьте, нет ли обновлённой редакции.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k05", "t": "Бронхиальная астма", "g": "c2", "kw": "J45.0 J45.1 J45.8 J45.9 J46", "tabs": [{"k": "t1", "l": "Диагностический минимум", "h": "<div class=\"tw\"><table><thead><tr><th>Что сделать<\/th><th>Комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Жалобы и анамнез\"><span>Жалобы и анамнез<\/span><\/label><\/td><td>Приступы удушья, свистящие хрипы, экспираторная одышка, заложенность в груди, приступообразный кашель; связь с нагрузкой, холодным воздухом, дымом, аллергенами; аллергические болезни, непереносимость НПВП, курение, профессия<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Аускультация, ЧДД, ЧСС, SpO2\"><span>Аускультация, ЧДД, ЧСС, SpO2<\/span><\/label><\/td><td>Сухие свистящие хрипы (иногда только на форсированном выдохе); вне приступа может быть норма. SpO2 &lt; 95%, ортопноэ, тахипноэ, цианоз: признаки дыхательной недостаточности<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Спирометрия с бронхолитическим тестом\"><span>Спирометрия с бронхолитическим тестом<\/span><\/label><\/td><td>Главный метод. Тест положительный: прирост ОФВ1 не менее 12% и не менее 200 мл. ОФВ1/ФЖЕЛ &lt; 0,7. Отрицательный тест БА не исключает<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Пикфлоуметрия\"><span>Пикфлоуметрия<\/span><\/label><\/td><td>Если спирометрия недоступна; вариабельность ПСВ более 20% у взрослых<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ОАК (эозинофилы)\"><span>ОАК (эозинофилы)<\/span><\/label><\/td><td>Эозинофилия поддерживает диагноз<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Общий IgE\"><span>Общий IgE<\/span><\/label><\/td><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span> назначаем при первом подозрении на БА; не назначаем при ХОБЛ, саркоидозе, бронхоэктазах, если в этом году уже был результат, и для коррекции терапии при установленном диагнозе<\/td><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Глюкоза, ОАМ, биохимия\"><span>Глюкоза, ОАМ, биохимия<\/span><\/label><\/td><td>По вашему справочнику<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Рентген ОГК (или КТ)\"><span>Рентген ОГК (или КТ)<\/span><\/label><\/td><td>Для исключения других причин одышки и кашля<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ЭКГ, ЭхоКГ\"><span>ЭКГ, ЭхоКГ<\/span><\/label><\/td><td>По вашему справочнику; для дифференциальной диагностики с сердечной одышкой<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Консультация аллерголога-иммунолога и/или пульмонолога\"><span>Консультация аллерголога-иммунолога и/или пульмонолога<\/span><\/label><\/td><td>Диагностика и подбор терапии; при торпидном течении; аллерген-специфическая иммунотерапия при атопической БА; оториноларинголог при полипозном риносинусите<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Профессиональная БА (по подозрению)\"><span>Профессиональная БА (по подозрению)<\/span><\/label><\/td><td>Мониторинг ПСВ не менее 4 раз за рабочую смену 3-4 недели с сравнением с выходными и отпуском<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Критерии диагноза по КР: характерные жалобы; обратимая обструкция; положительный бронхолитический тест; вариабельность ПСВ; необъяснимая эозинофилия; улучшение на пробной терапии низкими дозами ИГКС. Обязательны не все.<\/p>", "s": "Что сделать Комментарий Источник Жалобы и анамнез Приступы удушья, свистящие хрипы, экспираторная одышка, заложенность в груди, приступообразный кашель; связь с нагрузкой, холодным воздухом, дымом, аллергенами; аллергические болезни, непереносимость НПВП, курение, профессия КР ЛЕЧ Аускультация, ЧДД, ЧСС, SpO2 Сухие свистящие хрипы (иногда только на форсированном выдохе); вне приступа может быть норма. SpO2 ЛЕЧ Спирометрия с бронхолитическим тестом Главный метод. Тест положительный: прирост ОФВ1 не менее 12% и не менее 200 мл. ОФВ1/ФЖЕЛ КР ЛЕЧ Пикфлоуметрия Если спирометрия недоступна; вариабельность ПСВ более 20% у взрослых КР ОАК (эозинофилы) Эозинофилия поддерживает диагноз КР ЛЕЧ Общий IgE ПРАКТИКА назначаем при первом подозрении на БА; не назначаем при ХОБЛ, саркоидозе, бронхоэктазах, если в этом году уже был результат, и для коррекции терапии при установленном диагнозе ПРАКТИКА ЛЕЧ Глюкоза, ОАМ, биохимия По вашему справочнику ЛЕЧ СПР Рентген ОГК (или КТ) Для исключения других причин одышки и кашля КР ЛЕЧ ЭКГ, ЭхоКГ По вашему справочнику; для дифференциальной диагностики с сердечной одышкой ЛЕЧ СПР Консультация аллерголога-иммунолога и/или пульмонолога Диагностика и подбор терапии; при торпидном течении; аллерген-специфическая иммунотерапия при атопической БА; оториноларинголог при полипозном риносинусите КР ЛЕЧ Профессиональная БА (по подозрению) Мониторинг ПСВ не менее 4 раз за рабочую смену 3-4 недели с сравнением с выходными и отпуском ЛЕЧ Критерии диагноза по КР: характерные жалобы; обратимая обструкция; положительный бронхолитический тест; вариабельность ПСВ; необъяснимая эозинофилия; улучшение на пробной терапии низкими дозами ИГКС. Обязательны не все."}, {"k": "t2", "l": "Формулировка клинического диа…", "h": "<div class=\"dx\" data-raw=\"Бронхиальная астма [аллергическая / неаллергическая / с поздним дебютом / смешанная], [лёгкой / средней / тяжёлой] степени тяжести, [контролируемая / частично контролируемая / неконтролируемая]. [Обострение лёгкое-среднее / тяжёлое.] Аллергический ринит, [сенсибилизация к ___]. ДН [0/1/2]. [Ожирение, ГЭРБ и др.]\"><\/div><ul><li>В диагнозе указывают: этиологию, степень тяжести, уровень контроля, обострение (с тяжестью), сопутствующие заболевания. <span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/li><li>Тяжесть у леченого пациента оценивают ретроспективно по объёму терапии, нужному для контроля: лёгкая (ступени 1-2), средняя (ступень 3), тяжёлая (ступени 4-5). Для впервые выявленной БА: интермиттирующая, лёгкая, средняя, тяжёлая персистирующая. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Контроль оценивают по опроснику ACT (с 12 лет) или ACQ-5: при первом обращении, через 2-4 недели после начала терапии и далее каждые 3 месяца. <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul><div class=\"tw\"><table><thead><tr><th>Код МКБ-10<\/th><th>Название<\/th><\/tr><\/thead><tbody><tr><td>J45.0<\/td><td>Астма с преобладанием аллергического компонента<\/td><\/tr><tr><td>J45.1<\/td><td>Неаллергическая астма<\/td><\/tr><tr><td>J45.8<\/td><td>Смешанная астма<\/td><\/tr><tr><td>J45.9<\/td><td>Астма неуточнённая<\/td><\/tr><\/tbody><\/table><\/div><p>Источник: ваш справочник («Шаблоны», «Пульмонология»). Тяжёлое обострение с угрозой жизни (астматический статус) кодируется J46.<\/p><h3>Примеры из вашего справочника<\/h3><ul><li>Бронхиальная астма аллергическая форма, средней степени тяжести, контролируемое течение. Аллергический ринит круглогодичный, лёгкое течение. Сенсибилизация к аллергенам клещей домашней пыли.<\/li><li>Бронхиальная астма неаллергическая, эозинофильная, средней степени тяжести, частично контролируемое течение. Полипозный риносинусит. Непереносимость НПВП («аспириновая триада»).<\/li><li>Бронхиальная астма смешанной природы, средней степени тяжести, частично контролируемая, ремиссия. ДН-0.<\/li><\/ul>", "s": "В диагнозе указывают: этиологию, степень тяжести, уровень контроля, обострение (с тяжестью), сопутствующие заболевания. ЛЕЧ КР Тяжесть у леченого пациента оценивают ретроспективно по объёму терапии, нужному для контроля: лёгкая (ступени 1-2), средняя (ступень 3), тяжёлая (ступени 4-5). Для впервые выявленной БА: интермиттирующая, лёгкая, средняя, тяжёлая персистирующая. КР Контроль оценивают по опроснику ACT (с 12 лет) или ACQ-5: при первом обращении, через 2-4 недели после начала терапии и далее каждые 3 месяца. КР Код МКБ-10 Название J45.0 Астма с преобладанием аллергического компонента J45.1 Неаллергическая астма J45.8 Смешанная астма J45.9 Астма неуточнённая Источник: ваш справочник («Шаблоны», «Пульмонология»). Тяжёлое обострение с угрозой жизни (астматический статус) кодируется J46. Примеры из вашего справочника Бронхиальная астма аллергическая форма, средней степени тяжести, контролируемое течение. Аллергический ринит круглогодичный, лёгкое течение. Сенсибилизация к аллергенам клещей домашней пыли. Бронхиальная астма неаллергическая, эозинофильная, средней степени тяжести, частично контролируемое течение. Полипозный риносинусит. Непереносимость НПВП («аспириновая триада»). Бронхиальная астма смешанной природы, средней степени тяжести, частично контролируемая, ремиссия. ДН-0."}, {"k": "t3", "l": "Лечение", "h": "<h3>Принципы<\/h3><ul><li>Ступенчатый подход: ступень повышают при отсутствии контроля, но сначала проверяют технику ингаляции, приверженность, триггеры и другие диагнозы. Ступень понижают после контроля не менее 3 месяцев: ИГКС на 25-50% каждые 3 месяца. <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/li><li>Монотерапия короткодействующим бета-агонистом (сальбутамол) больше не рекомендуется. ≥ 3 ингаляций КДБА в год связаны с риском обострений, ≥ 12 в год с риском смерти. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Отказ от курения, дыхательная гимнастика и нагрузка, обучение технике ингаляции, вакцинация от гриппа и пневмококка. <span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul><h3>Стартовая терапия по выраженности симптомов (взрослые)<\/h3><div class=\"tw\"><table><thead><tr><th>Ситуация<\/th><th>Предпочтительно<\/th><th>Доза и режим<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td>Симптомы реже 2 раз в месяц, нет факторов риска (обострений за 12 мес. не было)<\/td><td>Низкая доза ИГКС + формотерол по потребности<\/td><td>Будесонид+формотерол 160/4,5 мкг (ДПИ) по 1-2 ингаляции по потребности; желательно не более 6 в сутки, максимум 12 в сутки<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Симптомы 2 раза в месяц и чаще<\/td><td>То же<\/td><td>То же. Альтернатива: ИГКС ежедневно в низкой дозе + КДБА по потребности (уточнить приверженность)<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Симптомы 4-5 дней в неделю или ночные пробуждения 1 раз в неделю и чаще<\/td><td>
