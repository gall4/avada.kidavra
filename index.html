ер при затяжном экссудативном течении. Одонтогенный синусит: убрать причину (стоматолог). КР Гомеопатические препараты при лёгком течении (УДД 4) и бактериофаги местно при непереносимости антибиотиков: в КР упомянуты. КР"}, {"k": "t4", "l": "Наблюдение и контроль", "h": "<ul><li>Оценить эффект через 3 дня антибиотика; если нет, пересмотреть препарат или направить к ЛОР/в стационар. При вирусном и поствирусном синусите без признаков бактериального наблюдать, антибиотик не нужен. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Если симптомы сохраняются более 12 недель: хронический риносинусит, ЛОР (КТ). При повторных (рецидивирующих) острых эпизодах антибиотик показан и при лёгком течении. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Диспансерного наблюдения при остром синусите нет. Через 6 месяцев специально ничего не проверяется; при частых рецидивах искать аллергический ринит, зубы, аномалии носа. <span class=\"lb lb-sp\">СПР<\/span><\/li><li>Явных критериев направления к ЛОР КР не называет, но осмотр ЛОР-врача указан как критерий качества помощи. <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul>", "s": "Оценить эффект через 3 дня антибиотика; если нет, пересмотреть препарат или направить к ЛОР/в стационар. При вирусном и поствирусном синусите без признаков бактериального наблюдать, антибиотик не нужен. КР Если симптомы сохраняются более 12 недель: хронический риносинусит, ЛОР (КТ). При повторных (рецидивирующих) острых эпизодах антибиотик показан и при лёгком течении. КР Диспансерного наблюдения при остром синусите нет. Через 6 месяцев специально ничего не проверяется; при частых рецидивах искать аллергический ринит, зубы, аномалии носа. СПР Явных критериев направления к ЛОР КР не называет, но осмотр ЛОР-врача указан как критерий качества помощи. КР"}, {"k": "t5", "l": "Проверка", "h": "<ul><li>Совпадает с КР: критерии бактериального синусита (в l008 те же: лейкоциты &gt; 15, температура &gt; 38, гнойные выделения, головная боль), амоксициллин/клавуланат 875/125 мг 2 раза, цефиксим 400 мг 1 раз, левофлоксацин 500 мг 1 раз, 7 дней, промывание морской водой, деконгестанты до 5-7 дней.<\/li><li>Расхождения: (1) амоксициллин/клавуланат как стартовый препарат всем: по КР стартует амоксициллин 500 мг 3 раза, защищённый аминопенициллин при факторах (астма, диабет, ХОБЛ, возраст 65+) или нет эффекта; (2) цефтриаксон 1 г внутривенно/внутримышечно 10 дней амбулаторно (b06, l009): КР только парентерально при тяжёлом течении в стационаре; (3) нафазолин (l008): КР не рекомендует; (4) Дезринит 14 дней (p11, c41): КР не более 5-7 дней; (5) антигистаминные Цетрин, лоратадин во всех схемах: КР при аллергическом рините или ранней вирусной стадии; (6) мометазон 3 раза в день 10 дней (c06) и 2 раза 7 дней (l008): сверьте с инструкцией; (7) в s05 рентген и СРБ стандартом: КР рентген при среднетяжёлом и тяжёлом течении.<\/li><li>Не из КР: Полидекса, Изофра, Касцебене, Синусэфрин (в КР не нашла); Синупрет (в КР только в литературе, но растительные комбинации УУР B есть).<\/li><li>Рукописная записка (p11): это переписанный текст, в нём названия «Инфласинусанс», «Респиро миртол», «Дезринит» нужно сверить с оригиналом: часть листа неразборчива. Как проверено: КР «Острый синусит» 2024 прочитана автоматически (pravo.ppt.ru). Дозы препаратов в КР приведены для амоксициллина, цефалоспоринов, левофлоксацина, моксифлоксацина, кларитромицина; для ГКС, деконгестантов, цефтриаксона у взрослых доз нет: сверяйте с инструкциями. Официальный текст: cr.minzdrav.gov.ru.<\/li><\/ul>", "s": "Совпадает с КР: критерии бактериального синусита (в l008 те же: лейкоциты > 15, температура > 38, гнойные выделения, головная боль), амоксициллин/клавуланат 875/125 мг 2 раза, цефиксим 400 мг 1 раз, левофлоксацин 500 мг 1 раз, 7 дней, промывание морской водой, деконгестанты до 5-7 дней. Расхождения: (1) амоксициллин/клавуланат как стартовый препарат всем: по КР стартует амоксициллин 500 мг 3 раза, защищённый аминопенициллин при факторах (астма, диабет, ХОБЛ, возраст 65+) или нет эффекта; (2) цефтриаксон 1 г внутривенно/внутримышечно 10 дней амбулаторно (b06, l009): КР только парентерально при тяжёлом течении в стационаре; (3) нафазолин (l008): КР не рекомендует; (4) Дезринит 14 дней (p11, c41): КР не более 5-7 дней; (5) антигистаминные Цетрин, лоратадин во всех схемах: КР при аллергическом рините или ранней вирусной стадии; (6) мометазон 3 раза в день 10 дней (c06) и 2 раза 7 дней (l008): сверьте с инструкцией; (7) в s05 рентген и СРБ стандартом: КР рентген при среднетяжёлом и тяжёлом течении. Не из КР: Полидекса, Изофра, Касцебене, Синусэфрин (в КР не нашла); Синупрет (в КР только в литературе, но растительные комбинации УУР B есть). Рукописная записка (p11): это переписанный текст, в нём названия «Инфласинусанс», «Респиро миртол», «Дезринит» нужно сверить с оригиналом: часть листа неразборчива. Как проверено: КР «Острый синусит» 2024 прочитана автоматически (pravo.ppt.ru). Дозы препаратов в КР приведены для амоксициллина, цефалоспоринов, левофлоксацина, моксифлоксацина, кларитромицина; для ГКС, деконгестантов, цефтриаксона у взрослых доз нет: сверяйте с инструкциями. Официальный текст: cr.minzdrav.gov.ru."}, {"k": "info", "l": "О листе", "h": "<p>Собрано из вашего справочника («лечение.docx» Инфекции l008, l009; «Практики» p11; затем «Шаблоны» s05, «Назначения» b06, «Быстро» c06, c41) и сверено с КР «Острый синусит» 2024 (ID 313, Национальная медицинская ассоциация оториноларингологов, взрослые и дети, одобрены НПС Минздрава, пересмотр не позднее 2026; прочитано 100 тыс. из 107 тыс. знаков на pravo.ppt.ru). Аллергический ринит, хронический риносинусит и вазомоторный ринит из ваших разделов (c09, c41, l013) здесь не разобраны. Дата сборки: 16.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для  год), сопутствующих (СД, иммунодефицит), невозможности наблюдения\"> Антибиотик показан при: Симптомах > 72 ч, гнойной форме, рецидивах (≥ 3 за 6 мес или ≥ 4 за год), сопутствующих (СД, иммунодефицит), невозможности наблюдения КР 1 линия Амоксициллин 0,5-1,0 г ×3 независимо от еды (не при приёме амоксициллина за 30 дней, гнойном конъюнктивите, непереносимости) КР 2 линия (нет эффекта за 3 дня) Амоксициллин/клавуланат 500/125 ×3 или 875/125 ×2 в начале еды; ампициллин/сульбактам; цефиксим 400 мг/сут (Панцеф 400 мг 1 р/сут в справочнике) КР ЛЕЧ Непереносимость пенициллинов (не анафилаксия) Цефуроксим 1,0 г/сут в 2 приёма после еды; цефтриаксон 2-4 г/сут КР Аллергия на пенициллины и цефалоспорины Джозамицин 2000 мг/сут в 2 приёма; кларитромицин 1000 мг/сут в 2 приёма (не первый выбор) КР Срок 7-10 дней; при затяжном и рецидивирующем не менее 14 дней. Не заканчивать до купирования отореи. Не применять тетрациклины, линкозамиды, аминогликозиды, ко-тримоксазол КР Местно (перфоративная стадия) Капли на основе рифамицина и фторхинолонов (C). Не применять аминогликозиды и спиртосодержащие капли (ототоксичность) КР Госпитализация и ЛОР: тяжёлое течение; при лёгком течении нет улучшения за 3-5 дней или нарастает ухудшение; парацентез при отсутствии улучшения через 48-72 ч антибиотика; мастоидит и внутричерепные осложнения: экстренно."}, {"k": "t4", "l": "Лечение наружного отита", "h": "<div class=\"tw\"><table><thead><tr><th>Что<\/th><th>Схема<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Режим — Беречь ухо от воды, не чистить, массаж козелка\"><span>Режим<\/span><\/label><\/td><td>Беречь ухо от воды, не чистить, массаж козелка<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Капли — Лафракс/офлоксацин 10 капель ×2 10 дней (l006); Комбенил Дуо (ципрофлоксацин + дексаметазон) 4 капли ×1 на ночь (s04); Отипакс 4 капли ×3 10 дней; Кандибиотик 2 капли ×4 5 дней и мирамистин/Отипакс (c07)\"><span>Капли<\/span><\/label><\/td><td>Лафракс/офлоксацин 10 капель ×2 10 дней (l006); Комбенил Дуо (ципрофлоксацин + дексаметазон) 4 капли ×1 на ночь (s04); Отипакс 4 капли ×3 10 дней; Кандибиотик 2 капли ×4 5 дней и мирамистин/Отипакс (c07)<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Лихорадка, боль — Парацетамол 500 мг при &gt; 38,5 (до 8 таб/сут по l006)\"><span>Лихорадка, боль<\/span><\/label><\/td><td>Парацетамол 500 мг при &gt; 38,5 (до 8 таб/сут по l006)<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Прочее — Кандидерм мазь 3 ночи; Панцеф 400 мг ×1 7 дней; Цетрин на ночь 10 дней (s04, b05)\"><span>Прочее<\/span><\/label><\/td><td>Кандидерм мазь 3 ночи; Панцеф 400 мг ×1 7 дней; Цетрин на ночь 10 дней (s04, b05)<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Проверить: КР по наружному отиту не найдена. Капли с комбинацией и анестетиками не применять при перфорации; отипакс при перфорации противопоказан (по инструкции).<\/p>", "s": "Что Схема Источник Режим Беречь ухо от воды, не чистить, массаж козелка ЛЕЧ Капли Лафракс/офлоксацин 10 капель ×2 10 дней (l006); Комбенил Дуо (ципрофлоксацин + дексаметазон) 4 капли ×1 на ночь (s04); Отипакс 4 капли ×3 10 дней; Кандибиотик 2 капли ×4 5 дней и мирамистин/Отипакс (c07) ЛЕЧ 38,5 (до 8 таб/сут по l006)\"> Лихорадка, боль Парацетамол 500 мг при > 38,5 (до 8 таб/сут по l006) ЛЕЧ Прочее Кандидерм мазь 3 ночи; Панцеф 400 мг ×1 7 дней; Цетрин на ночь 10 дней (s04, b05) ЛЕЧ ПРАКТИКА Проверить: КР по наружному отиту не найдена. Капли с комбинацией и анестетиками не применять при перфорации; отипакс при перфорации противопоказан (по инструкции)."}, {"k": "t5", "l": "Наблюдение", "h": "<ul><li>Контрольный осмотр ЛОР через 2-3 дня и через 3-4 нед. Диспансерного наблюдения при остром отите нет. <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/li><\/ul>", "s": "Контрольный осмотр ЛОР через 2-3 дня и через 3-4 нед. Диспансерного наблюдения при остром отите нет. КР ЛЕЧ"}, {"k": "t6", "l": "Расхождения", "h": "<ul><li>Антибиотик 1 линии: в l007, s04, b05 Панцеф (цефиксим) 400 мг ×1 7 дней сразу: в КР цефиксим только 2 линия, 1 линия амоксициллин 0,5-1,0 г ×3. Антибиотик нужен не всем (при симптомах &lt; 72 ч допустима выжидательная тактика).<\/li><li>Цетрин 10 дней (l007, s04, b05): в КР среднего отита антигистаминные не упомянуты.<\/li><li>Капли: в l007 Комбенил Дуо и диоксидин, Кандибиотик, Отипакс: в КР показаны фторхинолоны или рифамицин при перфорации, капли с аминогликозидами и спиртом нельзя; диоксидин и Кандибиотик в КР нет. Лидокаин + феназон только без перфорации.<\/li><li>Проверить: КР 2021 в карточке срок до 2023; наружный отит без КР; дозы НПВП для взрослых в КР не названы. Как проверено: КР среднего отита прочитана автоматически (pravo.ppt.ru). Проверяйте на cr.minzdrav.gov.ru и по инструкциям.<\/li><\/ul>", "s": "Антибиотик 1 линии: в l007, s04, b05 Панцеф (цефиксим) 400 мг ×1 7 дней сразу: в КР цефиксим только 2 линия, 1 линия амоксициллин 0,5-1,0 г ×3. Антибиотик нужен не всем (при симптомах Цетрин 10 дней (l007, s04, b05): в КР среднего отита антигистаминные не упомянуты. Капли: в l007 Комбенил Дуо и диоксидин, Кандибиотик, Отипакс: в КР показаны фторхинолоны или рифамицин при перфорации, капли с аминогликозидами и спиртом нельзя; диоксидин и Кандибиотик в КР нет. Лидокаин + феназон только без перфорации. Проверить: КР 2021 в карточке срок до 2023; наружный отит без КР; дозы НПВП для взрослых в КР не названы. Как проверено: КР среднего отита прочитана автоматически (pravo.ppt.ru). Проверяйте на cr.minzdrav.gov.ru и по инструкциям."}, {"k": "info", "l": "О листе", "h": "<p>Основа: справочник (Инфекции l006, l007; Шаблоны s04; Назначения b05; Быстро c07). Сверка: КР «Отит средний острый» (ID лин 500 мг ×3, а l004 и c05 без теста.<\/li><li>Срок: c05 даёт Амоксиклав 7 дней; КР везде 10 дней (кроме азитромицина 3 дня).<\/li><li>Азитромицин: s23 при аллергии на пенициллины даёт «500 мг 3 дня»; в КР азитромицин в группе тяжёлой аллергии (макролиды), при нетяжёлой аллергии цефалоспорины. Цефалексин в l004 500 мг ×2 в КР 500-1000 мг/сут: совпадает по нижней границе.<\/li><li>Лишнее по КР: цетиризин 10 мг ×5 дней (s23, c05), кетопрофен ОКИ по 1 пакету ×3 7 дней (c05), Линекс: КР не упоминает; антигистаминные при тонзиллите в прочитанном тексте не рекомендованы. Парацетамол в l003 «до 8 таб/сут» (4 г): КР даёт 500-1000 мг каждые 6 ч (макс 4 г).<\/li><li>Проверить: баллы Centor/McIsaac и порог для антибиотика (приложение Г1 не прочитано); противоречие в КР о посеве при отрицательном экспресс-тесте (для взрослых нецелесообразен); дозы цефдиторена и цефподоксима в КР указаны с расхождением. Как проверено: КР 2024 прочитана автоматически (pravo.ppt.ru, первые 100 тыс. знаков). Проверяйте на cr.minzdrav.gov.ru и по инструкциям.<\/li><\/ul>", "s": "Антибиотики без теста: l004 и c05 дают Амоксиклав 875/125 мг ×2 сразу при ангине (7 и 10 дней); КР: препарат выбора амоксициллин (не клавуланат), только при положительном экспресс-тесте или высокой вероятности БГСА. Клавуланат только при рецидиве. Внутри справочника: s23 «только при положительном тесте» и амоксициллин 500 мг ×3, а l004 и c05 без теста. Срок: c05 даёт Амоксиклав 7 дней; КР везде 10 дней (кроме азитромицина 3 дня). Азитромицин: s23 при аллергии на пенициллины даёт «500 мг 3 дня»; в КР азитромицин в группе тяжёлой аллергии (макролиды), при нетяжёлой аллергии цефалоспорины. Цефалексин в l004 500 мг ×2 в КР 500-1000 мг/сут: совпадает по нижней границе. Лишнее по КР: цетиризин 10 мг ×5 дней (s23, c05), кетопрофен ОКИ по 1 пакету ×3 7 дней (c05), Линекс: КР не упоминает; антигистаминные при тонзиллите в прочитанном тексте не рекомендованы. Парацетамол в l003 «до 8 таб/сут» (4 г): КР даёт 500-1000 мг каждые 6 ч (макс 4 г). Проверить: баллы Centor/McIsaac и порог для антибиотика (приложение Г1 не прочитано); противоречие в КР о посеве при отрицательном экспресс-тесте (для взрослых нецелесообразен); дозы цефдиторена и цефподоксима в КР указаны с расхождением. Как проверено: КР 2024 прочитана автоматически (pravo.ppt.ru, первые 100 тыс. знаков). Проверяйте на cr.minzdrav.gov.ru и по инструкциям."}, {"k": "info", "l": "О листе", "h": "<p>Основа: справочник (Инфекции l003, l004, l011; Шаблоны s19, s23; Быстро c05). Сверка: КР «Острый тонзиллит и фарингит (острый тонзиллофарингит)» (ID 306, взрослые и дети, 2024; прочитано 100 тыс. из 125 тыс. знаков, приложение с баллами Centor не получено). Дата сборки: 18.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k22", "t": "Сахарный диабет 2 типа и преддиабет", "g": "c4", "kw": "диабет сахарный глюкоза HbA1c B12 E11.0 E11.1 E11.2 E11.9 R73.0", "tabs": [{"k": "t1", "l": "Диагностика и обследование", "h": "<div class=\"tw\"><table><thead><tr><th>Что<\/th><th>Критерий или комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Критерии СД (венозная плазма)\"><span>Критерии СД (венозная плазма)<\/span><\/label><\/td><td>Глюкоза натощак ≥ 7,0 ммоль/л; через 2 часа ПГТТ ≥ 11,1; случайная ≥ 11,1; HbA1c ≥ 6,5%. Капиллярная кровь: натощак ≥ 6,1<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Предиабет\"><span>Предиабет<\/span><\/label><\/td><td>Нарушенная гликемия натощак: 6,1-6,9 ммоль/л (капиллярная 5,6-6,0); нарушенная толерантность к глюкозе: 7,8-11,0 через 2 часа ПГТТ. HbA1c 6,0-6,4%: основание для ПГТТ, диагноз сам не ставит<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Подтверждение\"><span>Подтверждение<\/span><\/label><\/td><td>Без симптомов диагноз по одному значению ставить нельзя: нужно повторное подтверждение (два значения или HbA1c + глюкоза). При острой декомпенсации достаточно одного. p01: глюкоза &gt; 11,1 считается подтверждённой без повторов, направить к эндокринологу сразу (разумно при симптомах и похудании)<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Скрининг\"><span>Скрининг<\/span><\/label><\/td><td>Старше 45 лет; при избытке массы и ≥ 1 факторе риска; при жажде, полиурии, зуде, фурункулезе, кандидозе, похудании; предиабет ежегодно. Не проводить ПГТТ при острой болезни и на ГКС, тиазидах, бета-блокаторах<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"При выявлении СД\"><span>При выявлении СД<\/span><\/label><\/td><td>ОАК, ОАМ; биохимия (глюкоза, креатинин, мочевина, АЛТ, АСТ, холестерин, ЛПНП, ЛПВП, ТГ, калий, натрий); СКФ; отношение альбумин/креатинин в утренней моче; офтальмолог с осмотром глазного дна под мидриазом; осмотр стоп, чувствительность, пульсация; ЭКГ. По показаниям: С-пептид, антитела (подозрение на СД1), кетоны<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Ежегодно\"><span>Ежегодно<\/span><\/label><\/td><td>ОАК, ОАМ, биохимия, СКФ, отношение альбумин/креатинин, офтальмолог, осмотр стоп. p01: МАУ в суточной моче, ЭКГ ежегодно. HbA1c 4 раза в год<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Алгоритм p01 (практики): глюкоза &gt; 7,0 натощак: повторить биохимию (глюкоза, АЛТ, АСТ, креатинин, ОАК, если в течение года не делали) и направить на HbA1c, затем записать на приём; глюкоза 6-7 и HbA1c 6-6,5%: преддиабет, к эндокринологу не направлять, рекомендации по питанию и нагрузке, метформин, наблюдение терапевта 1 раз в 6 месяцев. <span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/p>", "s": "Что Критерий или комментарий Источник Критерии СД (венозная плазма) Глюкоза натощак ≥ 7,0 ммоль/л; через 2 часа ПГТТ ≥ 11,1; случайная ≥ 11,1; HbA1c ≥ 6,5%. Капиллярная кровь: натощак ≥ 6,1 КР Предиабет Нарушенная гликемия натощак: 6,1-6,9 ммоль/л (капиллярная 5,6-6,0); нарушенная толерантность к глюкозе: 7,8-11,0 через 2 часа ПГТТ. HbA1c 6,0-6,4%: основание для ПГТТ, диагноз сам не ставит КР Подтверждение Без симптомов диагноз по одному значению ставить нельзя: нужно повторное подтверждение (два значения или HbA1c + глюкоза). При острой декомпенсации достаточно одного. p01: глюкоза > 11,1 считается подтверждённой без повторов, направить к эндокринологу сразу (разумно при симптомах и похудании) КР ПРАКТИКА Скрининг Старше 45 лет; при избытке массы и ≥ 1 факторе риска; при жажде, полиурии, зуде, фурункулезе, кандидозе, похудании; предиабет ежегодно. Не проводить ПГТТ при острой болезни и на ГКС, тиазидах, бета-блокаторах КР При выявлении СД ОАК, ОАМ; биохимия (глюкоза, креатинин, мочевина, АЛТ, АСТ, холестерин, ЛПНП, ЛПВП, ТГ, калий, натрий); СКФ; отношение альбумин/креатинин в утренней моче; офтальмолог с осмотром глазного дна под мидриазом; осмотр стоп, чувствительность, пульсация; ЭКГ. По показаниям: С-пептид, антитела (подозрение на СД1), кетоны КР ПРАКТИКА Ежегодно ОАК, ОАМ, биохимия, СКФ, отношение альбумин/креатинин, офтальмолог, осмотр стоп. p01: МАУ в суточной моче, ЭКГ ежегодно. HbA1c 4 раза в год КР ПРАКТИКА Алгоритм p01 (практики): глюкоза > 7,0 натощак: повторить биохимию (глюкоза, АЛТ, АСТ, креатинин, ОАК, если в течение года не делали) и направить на HbA1c, затем записать на приём; глюкоза 6-7 и HbA1c 6-6,5%: преддиабет, к эндокринологу не направлять, рекомендации по питанию и нагрузке, метформин, наблюдение терапевта 1 раз в 6 месяцев. ПРАКТИКА"}, {"k": "t2", "l": "Формулировка диагноза и код", "h": "<div class=\"tw\"><table><thead><tr><th>Сахарный диабет 2 типа, [впервые выявленный / стаж __ лет], [целевой HbA1c &lt; _%, достигнут ___%]. Осложнения: диабетическая нефропатия [С_ А_], СКФ (CKD-EPI) ___; ретинопатия [стадия]; полинейропатия; синдром диабетической стопы. Сопутствующие: АГ, ИБС, ожирение, дислипидемия, ХСН.<\/th><th><\/th><th><\/th><\/tr><\/thead><tbody><tr><td>Код<\/td><td>Название<\/td><td>Источник<\/td><\/tr><tr><td>E11.2-E11.9<\/td><td>СД 2 типа с осложнениями: .2 почки, .3 глаз, .4 неврологические, .5 периферические сосуды, .6 другие уточнённые, .7 множественные, .8 неуточнённые, .9 без осложнений<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>E11.0 / E11.1<\/td><td>СД 2 типа с комой / с кетоацидозом<\/td><td><span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td>R73.0<\/td><td>Нарушение толерантности к глюкозе (преддиабет: НТГ и НГН)<\/td><td><span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><\/tbody><\/table><\/div><div class=\"dx\" data-raw=\"При подозрении на СД1 или MODY (молодой возраст, худой, нетипичная картина): С-пептид, антитела, направление к эндокринологу. [КР]\"><\/div>", "s": "Сахарный диабет 2 типа, [впервые выявленный / стаж __ лет], [целевой HbA1c Код Название Источник E11.2-E11.9 СД 2 типа с осложнениями: .2 почки, .3 глаз, .4 неврологические, .5 периферические сосуды, .6 другие уточнённые, .7 множественные, .8 неуточнённые, .9 без осложнений КР E11.0 / E11.1 СД 2 типа с комой / с кетоацидозом СПР R73.0 Нарушение толерантности к глюкозе (преддиабет: НТГ и НГН) СПР"}, {"k": "t3", "l": "Цели лечения", "h": "<h3>Целевой HbA1c (КР 2019)<\/h3><div class=\"tw\"><table><thead><tr><th>Категория<\/th><th>Молодой<\/th><th>Средний<\/th><th>Пожилой, независим<\/th><th>Пожилой, зависим (нет астении/деменции)<\/th><th>Астения или деменция<\/th><\/tr><\/thead><tbody><tr><td>Нет АССЗ и риска тяжёлой гипогликемии<\/td><td>&lt; 6,5%<\/td><td>&lt; 7,0%<\/td><td>&lt; 7,5%<\/td><td>&lt; 8,0%<\/td><td>&lt; 8,5%<\/td><\/tr><tr><td>Есть АССЗ и/или риск тяжёлой гипогликемии<\/td><td>&lt; 7,0%<\/td><td>&lt; 7,5%<\/td><td>&lt; 8,0%<\/td><td>-<\/td><td>-<\/td><\/tr><\/tbody><\/table><\/div><p>Для большинства взрослых адекватна цель &lt; 7,0%. Соответствие глюкозе плазмы при HbA1c &lt; 7,0%: натощак и перед едой &lt; 7,0, через 2 часа после еды &lt; 7,0 ммоль/л. <span class=\"lb lb-kr\">КР<\/span><\/p><ul><li>АД: 18-65 лет: САД 120-129 и ДАД 70-79 мм рт. ст. (при хорошей переносимости); старше 65 лет: САД 130-139. <span class=\"lb lb-kr\">КР<\/span><\/li><li>ЛПНП: очень высокий риск (ССЗ, поражение органов-мишеней, ≥ 3 факторов) &lt; 1,4 ммоль/л; высокий риск (СД ≥ 10 лет + фактор) &lt; 1,8; средний (молодые, СД &lt; 10 лет) &lt; 2,5. <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul>", "s": "Целевой HbA1c (КР 2019) Категория Молодой Средний Пожилой, независим Пожилой, зависим (нет астении/деменции) Астения или деменция Нет АССЗ и риска тяжёлой гипогликемии Есть АССЗ и/или риск тяжёлой гипогликемии - - Для большинства взрослых адекватна цель КР АД: 18-65 лет: САД 120-129 и ДАД 70-79 мм рт. ст. (при хорошей переносимости); старше 65 лет: САД 130-139. КР ЛПНП: очень высокий риск (ССЗ, поражение органов-мишеней, ≥ 3 факторов) КР"}, {"k": "t4", "l": "Лечение", "h": "<h3>Образ жизни (для всех)<\/h3><ul><li>Ограничить калорийность при избытке массы (умеренное снижение), жиры и сахара; овощи не ограничивать; голодание противопоказано. Алкоголь: не более 1 ед. (15 г этанола) в сутки женщинам и 2 ед. мужчинам. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Аэробная нагрузка 30-60 минут не менее 3 раз в неделю, всего не менее 150 минут в неделю; при риске ИБС перед началом ЭКГ. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Предиабет: снижение массы на 5-7% и 150 минут нагрузки в неделю (УУР A). Метформин (1000-1700 мг/сут в 2 приёма) при неэффективности образа жизни или очень высоком риске (возраст до 60 лет, ИМТ ≥ 35, ГСД в анамнезе); альтернатива акарбоза. p01 рекомендует метформин при предиабете сразу. <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/li><\/ul><h3>Старт и интенсификация по уровню HbA1c<\/h3><div class=\"tw\"><table><thead><tr><th>Исходный HbA1c относительно цели<\/th><th>Тактика<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td>В цели или выше менее чем на 1,0%<\/td><td>Монотерапия: метформин, если нет противопоказаний (снижает HbA1c на 1,0-2,0%)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Выше цели на 1,0-2,5%<\/td><td>Сразу два препарата с разными механизмами (ожидаемое снижение ≥ 1,0% за 6 месяцев)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Выше цели более чем на 2,5%<\/td><td>Обычно инсулин (или инсулин + таблетки); без выраженной декомпенсации допустимы 2-3 препарата<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Контроль<\/td><td>HbA1c каждые 3 месяца; интенсификацию решать не позднее 6 месяцев (при низком риске гипогликемии 3 месяца)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>Препараты и ограничения<\/h3><div class=\"tw\"><table><thead><tr><th>Препарат<\/th><th>Эффект и особенности<\/th><th>Ограничения по КР<\/th><th>Источн ик<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Метформин (первая линия)\"><span>Метформин (первая линия)<\/span><\/label><\/td><td>Снижение HbA1c 1,0-2,0%; без гипогликемии; не прибавляет массу. Побочные: ЖКТ, дефицит B12<\/td><td>Противопоказан при СКФ &lt; 30; не начинать при СКФ &lt; 45; при СКФ 30-44 максимум 1000 мг в сутки; отменить за 2 дня до и после контраста и операций; печёночная недостаточность, ОКС, гипоксия, алкоголизм<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"иНГЛТ-2 (дапаглифлозин, эмпаглифлозин, канаглифлозин, эртуглифлозин, ипраглифлозин)\"><span>иНГЛТ-2 (дапаглифлозин, эмпаглифлозин, канаглифлозин, эртуглифлозин, ипраглифлозин)<\/span><\/label><\/td><td>Приоритет при АССЗ, ХСН, ХБП; снижают массу и АД<\/td><td>Не применять при СКФ &lt; 45; не при выраженной инсулиновой недостаточности<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"арГПП-1 (лираглутид, дулаглутид, семаглутид)\"><span>арГПП-1 (лираглутид, дулаглутид, семаглутид)<\/span><\/label><\/td><td>Снижение HbA1c 0,8-1,8%; масса и АД снижаются; вторичная профилактика при АССЗ, нефропротекция<\/td><td>Тяжёлая почечная и печёночная недостаточность, кетоацидоз; ЖКТ-побочные<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"иДПП-4 (ситаглиптин, вилдаглиптин, линаглиптин, алоглиптин)\"><span>иДПП-4 (ситаглиптин, вилдаглиптин, линаглиптин, алоглиптин)<\/span><\/label><\/td><td>Снижение HbA1c 0,5-1,0%; без гипогликемии<\/td><td>Коррекция дозы при ХБП (линаглиптин без коррекции); осторожность при ХСН; саксаглиптин при ХСН не рекомендуется<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Сульфонилмочевина (гликлазид MR, глимепирид)\"><span>Сульфонилмочевина (гликлазид MR, глимепирид)<\/span><\/label><\/td><td>Снижение HbA1c 1,0-2,0%; быстро, но гипогликемия и прибавка массы<\/td><td>При ХБП допустимы гликлазид, глимепирид, гликвидон; глибенкламид не при СКФ &lt; 60<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Пиоглитазон\"><span>Пиоглитазон<\/span><\/label><\/td><td>Снижение HbA1c 0,5-1,4%<\/td><td>Противопоказан при ХСН любого класса, отёках, ИБС с нитратами, заболеваниях печени<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Инсулин\"><span>Инсулин<\/span><\/label><\/td><td>Старт при HbA1c &gt; цели на 2,5% + декомпенсация; при неэффективности таблеток. Базальный: 10 ЕД/сут или 0,1-0,2 ЕД/кг, титрация +2 ЕД каждые 3-7 дней по глюкозе натощак; предпочтительны аналоги<\/td><td>Интенсификация при недостижении цели за 3-6 месяцев на базальном<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Проверить: дозы препаратов (стартовые и максимальные) в прочитанной части КР не приведены (приложение А3), поэтому я их в лист не вносила: берите по инструкции и у эндокринолога. Выбор при ССЗ и ХБП: арГПП-1 или иНГЛТ-2 при АССЗ, иНГЛТ-2 при ХСН и ХБП С1-3а, пиоглитазон при ХСН запрещён.<\/p><h3>Осложнения и направление<\/h3><ul><li>Нефропатия: отношение альбумин/креатинин ежегодно (подтверждать повторно в течение 1-3 месяцев); при АГ и альбуминурии &gt; 30 мг/г или СКФ &lt; 60 ИАПФ или БРА (не вместе); белок 0,8 г/кг при ХБП 3-5; соль до 2,3 г натрия; нефролог при быстром прогрессировании и СКФ &lt; 30. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Ретинопатия: офтальмолог ежегодно, при признаках лазер или интравитреальная терапия. Стопа: осмотр ежегодно; плановая госпитализация при инфицированной ране и критической ишемии. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Гипогликемия: &lt; 3,9 ммоль/л начинать лечение: 1-2 ХЕ быстрых углеводов (2-4 куска сахара, 100-200 мл сока); при потере сознания внутрь не давать, 40-100 мл 40% декстрозы в/в или глюкагон 1 мг п/к или в/м. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Госпитализация: экстренная при кетоацидозе, гиперосмолярном состоянии, лактацидозе, коме; плановая при необходимости начать инсулин при декомпенсации, нефротическом синдроме. <span class=\"lb lb-kr\">КР<\/span><\/li><li>К эндокринологу (p01): глюкоза &gt; 11,1 (особенно при похудании: срочно); глюкоза &gt; 7,0 после повторных анализов и HbA1c; явного критерия направления в КР нет. <span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/li><li>Самоконтроль: на диете не реже 1 раза в неделю; на таблетках не реже 1 раза в сутки в разное время + 1 профиль в неделю; при недостижении цели не реже 4 раз в сутки. <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul>", "s": "Образ жизни (для всех) Ограничить калорийность при избытке массы (умеренное снижение), жиры и сахара; овощи не ограничивать; голодание противопоказано. Алкоголь: не более 1 ед. (15 г этанола) в сутки женщинам и 2 ед. мужчинам. КР Аэробная нагрузка 30-60 минут не менее 3 раз в неделю, всего не менее 150 минут в неделю; при риске ИБС перед началом ЭКГ. КР Предиабет: снижение массы на 5-7% и 150 минут нагрузки в неделю (УУР A). Метформин (1000-1700 мг/сут в 2 приёма) при неэффективности образа жизни или очень высоком риске (возраст до 60 лет, ИМТ ≥ 35, ГСД в анамнезе); альтернатива акарбоза. p01 рекомендует метформин при предиабете сразу. КР ПРАКТИКА Старт и интенсификация по уровню HbA1c Исходный HbA1c относительно цели Тактика Источник В цели или выше менее чем на 1,0% Монотерапия: метформин, если нет противопоказаний (снижает HbA1c на 1,0-2,0%) КР Выше цели на 1,0-2,5% Сразу два препарата с разными механизмами (ожидаемое снижение ≥ 1,0% за 6 месяцев) КР Выше цели более чем на 2,5% Обычно инсулин (или инсулин + таблетки); без выраженной декомпенсации допустимы 2-3 препарата КР Контроль HbA1c каждые 3 месяца; интенсификацию решать не позднее 6 месяцев (при низком риске гипогликемии 3 месяца) КР Препараты и ограничения Препарат Эффект и особенности Ограничения по КР Источн ик Метформин (первая линия) Снижение HbA1c 1,0-2,0%; без гипогликемии; не прибавляет массу. Побочные: ЖКТ, дефицит B12 Противопоказан при СКФ КР иНГЛТ-2 (дапаглифлозин, эмпаглифлозин, канаглифлозин, эртуглифлозин, ипраглифлозин) Приоритет при АССЗ, ХСН, ХБП; снижают массу и АД Не применять при СКФ КР арГПП-1 (лираглутид, дулаглутид, семаглутид) Снижение HbA1c 0,8-1,8%; масса и АД снижаются; вторичная профилактика при АССЗ, нефропротекция Тяжёлая почечная и печёночная недостаточность, кетоацидоз; ЖКТ-побочные КР иДПП-4 (ситаглиптин, вилдаглиптин, линаглиптин, алоглиптин) Снижение HbA1c 0,5-1,0%; без гипогликемии Коррекция дозы при ХБП (линаглиптин без коррекции); осторожность при ХСН; саксаглиптин при ХСН не рекомендуется КР Сульфонилмочевина (гликлазид MR, глимепирид) Снижение HbA1c 1,0-2,0%; быстро, но гипогликемия и прибавка массы При ХБП допустимы гликлазид, глимепирид, гликвидон; глибенкламид не при СКФ КР Пиоглитазон Снижение HbA1c 0,5-1,4% Противопоказан при ХСН любого класса, отёках, ИБС с нитратами, заболеваниях печени КР Инсулин Старт при HbA1c > цели на 2,5% + декомпенсация; при неэффективности таблеток. Базальный: 10 ЕД/сут или 0,1-0,2 ЕД/кг, титрация +2 ЕД каждые 3-7 дней по глюкозе натощак; предпочтительны аналоги Интенсификация при недостижении цели за 3-6 месяцев на базальном КР Проверить: дозы препаратов (стартовые и максимальные) в прочитанной части КР не приведены (приложение А3), поэтому я их в лист не вносила: берите по инструкции и у эндокринолога. Выбор при ССЗ и ХБП: арГПП-1 или иНГЛТ-2 при АССЗ, иНГЛТ-2 при ХСН и ХБП С1-3а, пиоглитазон при ХСН запрещён. Осложнения и направление Нефропатия: отношение альбумин/креатинин ежегодно (подтверждать повторно в течение 1-3 месяцев); при АГ и альбуминурии > 30 мг/г или СКФ КР Ретинопатия: офтальмолог ежегодно, при признаках лазер или интравитреальная терапия. Стопа: осмотр ежегодно; плановая госпитализация при инфицированной ране и критической ишемии. КР Гипогликемия: КР Госпитализация: экстренная при кетоацидозе, гиперосмолярном состоянии, лактацидозе, коме; плановая при необходимости начать инсулин при декомпенсации, нефротическом синдроме. КР К эндокринологу (p01): глюкоза > 11,1 (особенно при похудании: срочно); глюкоза > 7,0 после повторных анализов и HbA1c; явного критерия направления в КР нет. ПРАКТИКА Самоконтроль: на диете не реже 1 раза в неделю; на таблетках не реже 1 раза в сутки в разное время + 1 профиль в неделю; при недостижении цели не реже 4 раз в сутки. КР"}, {"k": "t5", "l": "Наблюдение через 6 месяцев", "h": "<ul><li>HbA1c каждые 3 месяца, глюкоза, ЛПНП (в диспансерном осмотре по p01 обязательно: HbA1c, ЛПНП, глюкоза); АД; масса; креатинин и СКФ; отношение альбумин/креатинин и осмотр стоп ежегодно. <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/li><li>Если цель не достигнута, пересмотреть терапию не позднее 6 месяцев. Предиабет: наблюдение терапевта 1 раз в 6 месяцев (p01), ежегодный скрининг (КР). <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/li><li>Проверить: частоту диспансерных приёмов по приказу 168н я не подтвердила.<\/li><\/ul>", "s": "HbA1c каждые 3 месяца, глюкоза, ЛПНП (в диспансерном осмотре по p01 обязательно: HbA1c, ЛПНП, глюкоза); АД; масса; креатинин и СКФ; отношение альбумин/креатинин и осмотр стоп ежегодно. КР ПРАКТИКА Если цель не достигнута, пересмотреть терапию не позднее 6 месяцев. Предиабет: наблюдение терапевта 1 раз в 6 месяцев (p01), ежегодный скрининг (КР). КР ПРАКТИКА Проверить: частоту диспансерных приёмов по приказу 168н я не подтвердила."}, {"k": "t6", "l": "Проверка", "h": "<ul><li>Совпадает с КР: HbA1c каждые 3 месяца (4 раза в год), ежегодные ОАК, ОАМ, биохимия, глазное дно, осмотр стоп, ЛПНП и глюкоза в контроле, метформин при предиабете как вариант.<\/li><li>Расхождения: (1) p01: метформин при предиабете сразу; КР: сначала образ жизни, метформин при неэффективности или очень высоком риске (до 60 лет, ИМТ ≥ 35, ГСД); (2) p01: глюкоза &gt; 11,1 считается подтверждением без повторов: КР это допускает только при симптомах или декомпенсации; (3) p01: «МАУ в суточной моче», КР: отношение альбумин/креатинин в утренней порции; (4) p01 «Гликемия 6-7 и HbA1c 6-6,5% это преддиабет»: по КР НГН 6,1-6,9, HbA1c 6,0-6,4%, а 6,5% и выше уже СД; (5) в справочнике нет целей HbA1c и АД и нет таблицы выбора препарата.<\/li><li>В p01 не указано: СКФ и ограничения метформина, схема старта по уровню HbA1c, иНГЛТ-2 и арГПП-1 при ССЗ, цель ЛПНП. Как проверено: КР 2019 года (ID 290) прочитана автоматически, часть текста; детские КР СД2 (2020 и 2024) не использовала. Сверьте все цели и пороги с актуальным текстом (cr.minzdrav.gov.ru) и дозы с инструкциями.<\/li><\/ul>", "s": "Совпадает с КР: HbA1c каждые 3 месяца (4 раза в год), ежегодные ОАК, ОАМ, биохимия, глазное дно, осмотр стоп, ЛПНП и глюкоза в контроле, метформин при предиабете как вариант. Расхождения: (1) p01: метформин при предиабете сразу; КР: сначала образ жизни, метформин при неэффективности или очень высоком риске (до 60 лет, ИМТ ≥ 35, ГСД); (2) p01: глюкоза > 11,1 считается подтверждением без повторов: КР это допускает только при симптомах или декомпенсации; (3) p01: «МАУ в суточной моче», КР: отношение альбумин/креатинин в утренней порции; (4) p01 «Гликемия 6-7 и HbA1c 6-6,5% это преддиабет»: по КР НГН 6,1-6,9, HbA1c 6,0-6,4%, а 6,5% и выше уже СД; (5) в справочнике нет целей HbA1c и АД и нет таблицы выбора препарата. В p01 не указано: СКФ и ограничения метформина, схема старта по уровню HbA1c, иНГЛТ-2 и арГПП-1 при ССЗ, цель ЛПНП. Как проверено: КР 2019 года (ID 290) прочитана автоматически, часть текста; детские КР СД2 (2020 и 2024) не использовала. Сверьте все цели и пороги с актуальным текстом (cr.minzdrav.gov.ru) и дозы с инструкциями."}, {"k": "info", "l": "О листе", "h": "<p>В вашем справочнике по диабету есть только заметка «Практики» p01 (алгоритм обследования и направления), схем лечения нет, поэтому лечебная часть взята из КР. Сверка: КР «Сахарный диабет 2 типа у взрослых» (ID 290, Российская ассоциация эндокринологов). Прочитана редакция 2019 года (первые 200 тыс. из 483 тыс. знаков, источник library.mededtech.ru); более свежие редакции существуют, цели HbA1c, выбор препаратов и пороги СКФ могли измениться: проверьте актуальный текст в рубрикаторе (cr.minzdrav.gov.ru). Приложение с дозами препаратов (А3) я не получила. Дата сборки: 17.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k23", "t": "СРК и хронический запор", "g": "c3", "kw": "раздражённый кишечник запор K58.0 K58.1 K58.3 K58.9 K59.0", "tabs": [{"k": "t1", "l": "Диагностический минимум", "h": "<div class=\"tw\"><table><thead><tr><th>Что сделать<\/th><th>Комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Критерии Рим IV (СРК)\"><span>Критерии Рим IV (СРК)<\/span><\/label><\/td><td>Боль в животе ≥ 1 раза/нед, связанная с дефекацией и/или изменением частоты или формы стула; симптомы последние 3 мес, всего ≥ 6 мес; нет органической причины<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Тревожные симптомы\"><span>Тревожные симптомы<\/span><\/label><\/td><td>Похудание, начало в пожилом возрасте, ночные симптомы, рак толстой кишки/целиакия/ВЗК у родственников, кровь в кале, лихорадка, анемия, лейкоцитоз, ↑СОЭ, постоянная боль как единственный симптом, стеаторея<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ОАК+СОЭ, биохимия, скрытая кровь в кале\"><span>ОАК+СОЭ, биохимия, скрытая кровь в кале<\/span><\/label><\/td><td>Исключить анемию и воспаление<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Пальпация живота и ПРИ\"><span>Пальпация живота и ПРИ<\/span><\/label><\/td><td>Для запора в КР 2024 (уровень C)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"УЗИ ОБП, копрограмма\"><span>УЗИ ОБП, копрограмма<\/span><\/label><\/td><td>По справочнику<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Антитела к тТГ (IgA), ТТГ, кальпротектин кала\"><span>Антитела к тТГ (IgA), ТТГ, кальпротектин кала<\/span><\/label><\/td><td>Целиакия, гипотиреоз, ВЗК (перечень из КР СРК 2017 и s12; не в ОМС частично)<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Колоноскопия\"><span>Колоноскопия<\/span><\/label><\/td><td>При тревожных симптомах, при хроническом запоре старше 50 лет, при отягощённой наследственности по КРР; ЭГДС с биопсией при подозрении на целиакию<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ВДТ (СИБР, лактоза)\"><span>ВДТ (СИБР, лактоза)<\/span><\/label><\/td><td>По показаниям, не в ОМС<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><\/tbody><\/table><\/div>", "s": "Что сделать Комментарий Источник Критерии Рим IV (СРК) Боль в животе ≥ 1 раза/нед, связанная с дефекацией и/или изменением частоты или формы стула; симптомы последние 3 мес, всего ≥ 6 мес; нет органической причины ЛЕЧ КР Тревожные симптомы Похудание, начало в пожилом возрасте, ночные симптомы, рак толстой кишки/целиакия/ВЗК у родственников, кровь в кале, лихорадка, анемия, лейкоцитоз, ↑СОЭ, по , l317), либо лактитол. В КР доз нет, дозы из справочника<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>4<\/td><td>Контактные (бисакодил, пикосульфат, сенна): не более 2 недель; риски: диарея, гипокалиемия<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>5<\/td><td>Прукалоприд при неэффективности слабительных: 2 мг/сут, старше 65 лет 1 мг/сут (B)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>6<\/td><td>Рефрактерный запор: направление в специализированный центр (транзит, проба с баллоном, манометрия); хирургия только при инертной толстой кишке<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Принимайте слабительные за час до других лекарств (s12). Оценка эффекта: макрогол или прукалоприд назначают на 4-6 недель при сохранении симптомов (КР 2024).<\/p>", "s": "Шаг Что Источник 1 Физическая активность, жидкость 1,5-2 л/сут (в КР 2016: ≥ 2 л), пищевые волокна 20-25 г/сут; при желании пре- и пробиотики КР ЛЕЧ 2 Псиллиум при недостаточном эффекте диеты (в исследованиях 10-40 г/сут 2-8 нед; в КР доза не названа; в s12 3,4 г ×2) КР ЛЕЧ 3 1 линия: макрогол (A) 1-2 пакета/сут, или лактулоза (C) 30-45 мл/сут 1 мес (Дюфалак по c35, l317), либо лактитол. В КР доз нет, дозы из справочника КР ЛЕЧ 4 Контактные (бисакодил, пикосульфат, сенна): не более 2 недель; риски: диарея, гипокалиемия КР ЛЕЧ 5 Прукалоприд при неэффективности слабительных: 2 мг/сут, старше 65 лет 1 мг/сут (B) КР 6 Рефрактерный запор: направление в специализированный центр (транзит, проба с баллоном, манометрия); хирургия только при инертной толстой кишке КР Принимайте слабительные за час до других лекарств (s12). Оценка эффекта: макрогол или прукалоприд назначают на 4-6 недель при сохранении симптомов (КР 2024)."}, {"k": "t5", "l": "Наблюдение", "h": "<ul><li>Дисп. наблюдение при СРК и функциональном запоре в справочнике и КР 2024 не прописано. Проверить: Тревожные симптомы или неэффективность 4-6 нед: гастроэнтеролог/колопроктолог, колоноскопия.<\/li><\/ul>", "s": "Дисп. наблюдение при СРК и функциональном запоре в справочнике и КР 2024 не прописано. Проверить: Тревожные симптомы или неэффективность 4-6 нед: гастроэнтеролог/колопроктолог, колоноскопия."}, {"k": "t6", "l": "Расхождения", "h": "<ul><li>Внутри справочника: (1) тримебутин: b12 14 дней, s12 2-3 мес, l304 4 нед + 12 нед; (2) рифаксимин: s12 1200 мг/сут, a07 200-800 мг/сут; (3) лоперамид: s12 до 2 дней, b12 и l308 без срока; (4) пробиотики: s12 их не включает, a07 и b12 включают; (5) коды K58.3 и K58.9 для СРК с запором; (6) l308 советует исключить клетчатку, а КР по запору рекомендует 20-25 г волокон (при СРК с диареей ограничение может быть оправдано).<\/li><li>КР не подтвердили: дозы всех спазмолитиков, лоперамида, рифаксимина, антидепрессантов и макрогола/лактулозы (в прочитанных КР доз нет); подтверждены прукалоприд 2/1 мг, контактные слабительные не более 2 недель, перечень обследований и тревожные симптомы.<\/li><li>Проверить: актуальная КР по СРК (в прочитанном виде только аннотация КР 2017), доза псиллиума (s12 3,4 г ×2, КР: 10-40 г/сут в исследованиях), «бисакодил 1-2 таб ×10-14 дней» в l304 и пределы по инструкции. Как проверено: КР «Запор» 2024 прочитана автоматически (медицинский текст с pravo.ppt.ru), КР 2016 по запору (medi.ru) частично, КР по СРК только аннотация. Проверяйте на cr.minzdrav.gov.ru и по инструкциям.<\/li><\/ul>", "s": "Внутри справочника: (1) тримебутин: b12 14 дней, s12 2-3 мес, l304 4 нед + 12 нед; (2) рифаксимин: s12 1200 мг/сут, a07 200-800 мг/сут; (3) лоперамид: s12 до 2 дней, b12 и l308 без срока; (4) пробиотики: s12 их не включает, a07 и b12 включают; (5) коды K58.3 и K58.9 для СРК с запором; (6) l308 советует исключить клетчатку, а КР по запору рекомендует 20-25 г волокон (при СРК с диареей ограничение может быть оправдано). КР не подтвердили: дозы всех спазмолитиков, лоперамида, рифаксимина, антидепрессантов и макрогола/лактулозы (в прочитанных КР доз нет); подтверждены прукалоприд 2/1 мг, контактные слабительные не более 2 недель, перечень обследований и тревожные симптомы. Проверить: актуальная КР по СРК (в прочитанном виде только аннотация КР 2017), доза псиллиума (s12 3,4 г ×2, КР: 10-40 г/сут в исследованиях), «бисакодил 1-2 таб ×10-14 дней» в l304 и пределы по инструкции. Как проверено: КР «Запор» 2024 прочитана автоматически (медицинский текст с pravo.ppt.ru), КР 2016 по запору (medi.ru) частично, КР по СРК только аннотация. Проверяйте на cr.minzdrav.gov.ru и по инструкциям."}, {"k": "info", "l": "О листе", "h": "<p>Основа: справочник (ЖКТ l304, l308, l317; Шаблоны s12; Алгоритмы a07; Назначения b12; Быстро c35, c40). Сверка: КР «Запор» (ID 274, взрослые, 2024, РГА и Ассоциация колопроктологов; прочитана автоматически) и КР РГА/АКР по СРК (2017, только аннотация без доз; свежую КР по СРК получить не удалось). Дата сборки: 18.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k24", "t": "Стабильная ИБС", "g": "c1", "kw": "ИБС стенокардия ишемическая болезнь сердца I20.1 I20.8 I20.9 I25.0 I25.1 I25.2 I25.3 I25.4 I25.5 I25.6 I25.8 I25.9", "tabs": [{"k": "t1", "l": "Диагностический минимум", "h": "<div class=\"tw\"><table><thead><tr><th>Что сделать<\/th><th>Комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o= b lb-sp\">СПР<\/span><\/p><h3>Базовая схема из вашего документа «лечение.docx»<\/h3><div class=\"tw\"><table><thead><tr><th>Препарат<\/th><th>Доза и приём<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Метопролол — 25 мг 2 раза в сутки (утром и вечером), при необходимости повышать до 100 мг в сутки\"><span>Метопролол<\/span><\/label><\/td><td>25 мг 2 раза в сутки (утром и вечером), при необходимости повышать до 100 мг в сутки<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Фелодипин — 2,5 мг в сутки, при необходимости повышать до 10 мг в сутки\"><span>Фелодипин<\/span><\/label><\/td><td>2,5 мг в сутки, при необходимости повышать до 10 мг в сутки<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Изосорбида динитрат — 20 мг 2 раза в сутки; нужен безнитратный интервал 10-14 часов\"><span>Изосорбида динитрат<\/span><\/label><\/td><td>20 мг 2 раза в сутки; нужен безнитратный интервал 10-14 часов<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Тромбо АСС (ацетилсалициловая кислота) — 100 мг 1 раз в сутки за 30 минут до еды\"><span>Тромбо АСС (ацетилсалициловая кислота)<\/span><\/label><\/td><td>100 мг 1 раз в сутки за 30 минут до еды<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Розувастатин (при дислипидемии) — 20 мг в сутки вечером (22:00)\"><span>Розувастатин (при дислипидемии)<\/span><\/label><\/td><td>20 мг в сутки вечером (22:00)<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Эта схема соответствует стенокардии III-IV ФК: по КР при ФК III-IV сразу назначают бета-блокатор + дигидропиридиновый антагонист кальция, цель - ФК I. Нитраты длительного действия по КР относятся ко второй линии: их добавляют, если первой линии недостаточно. При ФК I-II начинают с одного препарата первой линии (см. ниже).<\/p><h3>Антиангинальная терапия по КР 2024<\/h3><div class=\"tw\"><table><thead><tr><th>Ситуация<\/th><th>Тактика<\/th><\/tr><\/thead><tbody><tr><td>ФК I-II, ЧСС &gt; 60<\/td><td>Первая линия: бета-блокатор или недигидропиридиновый антагонист кальция (верапамил, дилтиазем). Цель ЧСС 55-60 в минуту<\/td><\/tr><tr><td>ФК III-IV<\/td><td>Сразу бета-блокатор + дигидропиридиновый антагонист кальция (амлодипин, фелодипин, нифедипин пролонгированный), цель - ФК I<\/td><\/tr><tr><td>Недостаточный эффект<\/td><td>Добавить один препарат второй линии: нитраты длительного действия, ивабрадин, никорандил, ранолазин, триметазидин (по АД, ЧСС и переносимости)<\/td><\/tr><tr><td>Низкие ЧСС и АД<\/td><td>Ранолазин или триметазидин как первая линия<\/td><\/tr><tr><td>ЧСС &gt; 80 при синусовом ритме, нельзя бета-блокатор и антагонист кальция<\/td><td>Ивабрадин<\/td><\/tr><tr><td>Бета-блокатор + верапамил/дилтиазем<\/td><td>Нежелательно. Запрещено при ФВ ЛЖ &lt; 60%, нарушении проводимости, слабости синусового узла<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>Ситуация<\/th><th>Тактика<\/th><\/tr><\/thead><tbody><tr><td>Дигидропиридиновый + недигидропиридиновый антагонист кальция<\/td><td>С антиангинальной целью рутинно не применяют (суммируются побочные эффекты)<\/td><\/tr><\/tbody><\/table><\/div><p>Источник: КР 2024 и «Шаблоны». Бета-блокатор начинают с минимальной дозы и повышают до исчезновения приступов или максимальной переносимой дозы.<\/p><p>Дозы препаратов по вашему справочнику («Шаблоны»)<\/p><div class=\"tw\"><table><thead><tr><th>Препарат<\/th><th>Доза<\/th><th>Препарат<\/th><th>Доза<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Бисопролол — 2,5-10 мг 1 раз в сутки — 5-10 мг 1 раз в сутки\"><span>Бисопролол<\/span><\/label><\/t .<\/li><li>Не включено: милдронат, мексидол, панангин (тема «Быстро»): в прочитанных мной разделах КР по стабильной ИБС их нет, поэтому в лист не вносила. Триметазидин в КР есть (вторая линия). Как проверено: текст КР 2024 я прочитала в версии журнала «Российский кардиологический журнал» 2024; 29(9): 6110 автоматическим способом. Перед использованием сверьте целевые уровни и интервалы с официальным текстом в Рубрикаторе клинических рекомендаций (cr.minzdrav.gov.ru) и дозы с инструкциями препаратов.<\/li><\/ul>", "s": "Совпадает с КР 2024: линии и ступени антиангинальной терапии, цель ЧСС 55-60, схема нитроглицерина, АСК 100 мг, цель ЛПНП Не подтверждено КР: дозы антиангинальных препаратов и статинов (в КР доз нет); Тромбо АСС «за 30 минут до еды» (это правило приёма, не из КР). Расхождения: АСК 75-165 мг («Шаблоны») против 75-100 мг (КР); целевое АД «140-130/80-90» в «Шаблонах» устарело, актуальные цели в листе по АГ; в базовой схеме «лечения» нитрат стоит сразу, по КР он вторая линия; схема рассчитана на ФК III, при ФК I-II начинают с одного препарата. Опечатки: «Первая лилия» (первая линия), «Аретриальная гиепртония», «Фелодип». Не включено: милдронат, мексидол, панангин (тема «Быстро»): в прочитанных мной разделах КР по стабильной ИБС их нет, поэтому в лист не вносила. Триметазидин в КР есть (вторая линия). Как проверено: текст КР 2024 я прочитала в версии журнала «Российский кардиологический журнал» 2024; 29(9): 6110 автоматическим способом. Перед использованием сверьте целевые уровни и интервалы с официальным текстом в Рубрикаторе клинических рекомендаций (cr.minzdrav.gov.ru) и дозы с инструкциями препаратов."}, {"k": "info", "l": "О листе", "h": "<p>Собрано из вашего справочника и сверено с клиническими рекомендациями «Стабильная ишемическая болезнь сердца» 2024 г. (Российский кардиологический журнал 2024; 29(9): 6110; одобрены Научно-практическим советом Минздрава РФ 12.09.2024). Дата сборки: 15.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k25", "t": "Тиреотоксикоз с диффузным зобом (Грейвс)", "g": "c4", "kw": "базедова болезнь тиреотоксикоз E05.3 E05.4 E05.5 E05.8", "tabs": [{"k": "t1", "l": "Жалобы и осмотр", "h": "<p><strong>Копируйте в карту, пустые места заполняйте<\/strong><\/p><p class=\"tpl\">Жалобы: на повышенную возбудимость, эмоциональную лабильность, плаксивость, беспокойство, нарушение сна, суетливость, нарушение концентрации внимания, слабость, потливость, сердцебиение, одышку, нарушение ритма сердца, дрожь в теле, потерю веса, увеличение щитовидной железы, частый стул, нарушение менструального цикла/снижение потенции, мышечную слабость, экзофтальм<\/p><p class=\"tpl\">Анамнез заболевания: Считает себя больным(ой) с __ года (указать период, когда впервые появились симптомы/ поставлен диагноз; характерен короткий анамнез, манифестация в 30-60 лет). Состоит на диспансерном учете/наблюдается у эндокринолога/кардиолога/офтальмолога/невролога/дерматолога/психиатра/ гинеколога. Принимает препараты (описать характер, дозы и эффект назначенного ранее лечения, если проводилось). Развитию симптомов предшествовал тяжелый психоэмоциональный стресс/длительный стаж курения/беременность. В анамнезе отсутствуют данные/присутствуют данные о пароксизмальной/постоянной фибрилляции предсердий/сердечной недостаточности/тромбоэмболических осложнениях/ эндокринной офтальмопатии и ее осложнениях (нейропатии зрительного нерва, кератопатии с формированием бельма, перфорации роговицы, офтальмоплегии, диплопии)/претибиальной микседеме/ акропатии/семейном анамнезе заболеваний щитовидной железы (болезнь Грейвса, тиреоидит Хашимото)/наличии других аутоиммунных заболеваний (сахарный диабет 1 типа, системная красная волчанка, ревматоидный артрит, целиакия, витилиго)/ эпизоде тиреотоксического криза. Последнее обследование (при наличии): ТТГ, СТ3, СТ4, АТ-рТТГ, УЗИ щитовидной железы<\/p><p class=\"tpl\">Анамнез жизни: не отягощен, без особенностей/описать. ВИЧ, Гепатит В, С, сифилис, туберкулез отрицает. Операции, гемотрансфузии отрицает<\/p><p class=\"tpl\">Аллергологический анамнез: не отягощен/отягощен (указать аллерген и характер проявлений: отек Квинке, крапивница, зуд и тд.)<\/p><p class=\"tpl\">Эпидемиологический анамнез: выезды в эпидемиологически неблагополучные территории и другие страны отрицает. В контакте с инфекционными больными не находился<\/p><p class=\"tpl\">Лекарственная непереносимость: отрицает/да (перечислить лекарственные препараты и указать характер проявлений: отек Квинке, крапивница, зуд и тд.)<\/p><p class=\"tpl\">Хронические заболевания: отрицает/перечислить, если есть<\/p><p class=\"tpl\">Вредные привычки: отрицает/употребляет алкоголь/курение (стаж курения и сколько выкуриваемых сигарет в день)<\/p><p class=\"tpl\">Страховой анамнез: работает (указать, кем работает пациент)/не работает<\/p><p class=\"tpl\">Инвалидность: нет/есть (указать группу)<\/p><p class=\"tpl\">Объективный осмотр:<\/p><p class=\"tpl\">Общее состояние: состояние удовлетворительное. Сознание ясное, ориентирован во времени, в пространстве. Телосложение: нормостеническое/астеническое/ гиперстеническое. Рост - см, вес - кг. ИМТ - кг/м2. Подкожная жировая клетчатка развита снижено/умеренно/повышено. Температура тела 36.6 С (возможен субфебрилитет у пожилых). Кожные покровы чистые, умеренной/повышенной влажности, физиологической окраски/гиперемированные, горячие на ощупь. Зоны гиперпигментации и депигментации отсутствуют/определяются депигментированные очаги (витилиго); на передней поверхности голеней кожа отечна, уплотнена (ямка при надавливании не образуется), отмечается появление выступающих фолликул красного цвета с характерным видом «апельсиновой корки»; волосы без изменений/тонкие, ломкие, отмечается повышенное выпадение; ногти без изменений/мягкие, исчерченные, ломкие, возможно формирование ногтей в виде часовых стекол (при акропатии); высыпания, расчесы, гнойники, язвы, стрии, рубцы не выявлены. Слизистые оболочки чистые, умеренной влажности/сухие, физиологической окраски/гиперемированные. Слизистая конъюнктивы склер и нижнего века физиологической окраски/гиперемирована. Зев розовый, чистый. Миндалины не увеличены, налета нет. Периферические лимфатические узлы не увеличены, безболезненны. Походка: без особенностей/медленная. Объем движений конечностей: в норме/ограничен. Кости без изменений/утолщение и деформация фаланг пальцев рук («барабанные палочки») и стоп (при акропатии). Мышечная сила сохранена/снижена (проксимальная миопатия). Щитовидная железа: диффузно увеличена (указать степень увеличения по ВОЗ), умеренной плотности, безболезненная, подвижная, при наложении фонендоскопа выслушивается систолический шум. Экзофтальм отсутствует/имеется; Глазные симптомы отсутствуют/имеются (симптом Грефе, симптом Кохера, симптом Дальримпля, симптом Штельвага). Тремор отсутствует/мелкий тремор закрытых глаз (симптом Розенбаха),тремор пальцев вытянутых рук (симптом Мари),тремор мелких мышечных групп всего тела (симптом «телеграфного столба»). Отеки отсутствуют/ наблюдаются периорбитальные отеки (ЭОП), отеки передней поверхности голеней (претибиальная микседема), стоп и кистей (акропатия)<\/p><p class=\"tpl\">Дыхательная система: При перкуссии звук ясный легочной; при аускультации дыхание везикулярное/жесткое/ослабленное. Хрипов нет/сухие/влажные/крепитация. ЧДД 17 в мин.(возможно увеличение) Sp02- 98%<\/p><p class=\"tpl\">Сердечно-сосудистая система: аускультация сердца: тоны сердца звучные/приглушены, ритм правильный/неправильный (тахикардия, ФП), двухчленный/трехчленный; Патологические шумы не выслушиваются АД: На правой руке 120-130/70-80 мм.рт.ст. На левой руке 120-130/70-80 мм.рт.ст. (возможна систолическая гипертензия) ЧСС- 80 уд в мин. (возможна тахикардия 120–130 уд в мин) Пульс - 80 уд в мин регулярный/нерегулярный. ДП нет/есть<\/p><p class=\"tpl\">Пищеварительная система: язык влажный, чистый. Живот правильной формы, симметричен, участвует в акте дыхания, при пальпации мягкий, безболезненный. Пальпация печени: справа по краю реберной дуги, гладкая, безболезненная<\/p><p class=\"tpl\">Мочеполовая система: симптом Пастернацкого отрицательный. Диурез в норме<\/p>", "s": "Копируйте в карту, пустые места заполняйте Жалобы: на повышенную возбудимость, эмоциональную лабильность, плаксивость, беспокойство, нарушение сна, суетливость, нарушение концентрации внимания, слабость, потливость, сердцебиение, одышку, нарушение ритма сердца, дрожь в теле, потерю веса, увеличение щитовидной железы, частый стул, нарушение менструального цикла/снижение потенции, мышечную слабость, экзофтальм Анамнез заболевания: Считает себя больным(ой) с __ года (указать период, когда впервые появились симптомы/ поставлен диагноз; характерен короткий анамнез, манифестация в 30-60 лет). Состоит на диспансерном учете/наблюдается у эндокринолога/кардиолога/офтальмолога/невролога/дерматолога/психиатра/ гинеколога. Принимает препараты (описать характер, дозы и эффект назначенного ранее лечения, если проводилось). Развитию симптомов предшествовал тяжелый психоэмоциональный стресс/длительный стаж курения/беременность. В анамнезе отсутствуют данные/присутствуют данные о пароксизмальной/постоянной фибрилляции предсердий/сердечной недостаточности/тромбоэмболических осложнениях/ эндокринной офтальмопатии и ее осложнениях (нейропатии зрительного нерва, кератопатии с формированием бельма, перфорации роговицы, офтальмоплегии, диплопии)/претибиальной микседеме/ а асто ведёт к декомпенсации) Схемы после эутиреоза «Блокируй»: тиамазол 7,5-10 мг/сут с ежемесячным контролем; «блокируй и замещай»: тиамазол 10-15-20 мг + левотироксин 25-75 мкг/сут (в вашем документе 25-50); ремиссия одинаковая Длительность и контроль Около 12-18 месяцев, затем отмена при нормальном ТТГ; перед отменой АТ-рТТГ; свТ4 и свТ3 первые 4 месяца ежемесячно, затем ТТГ; эндокринолог раз в 1-2 месяца Пропилтиоурацил 300-400 мг/сут в 3-4 приёма: 1 триместр беременности, тиреотоксический криз, побочные эффекты тиамазола; риск некроза печени Бета-блокаторы До эутиреоза, дозы в КР не указаны (в вашем документе пропранолол 20-40 мг каждые 6 часов, бисопролол 2,5-5 мг) Агранулоцитоз Лейкоциты и формулу не проверять рутинно, но при лихорадке, фарингите, ангине обязательно; при нейтропении ( Радиойодтерапия и операция РЙТ: рецидив после 12-18 месяцев терапии, непереносимость тиреостатиков; тест на беременность за 48 часов; противопоказаны беременность и лактация. Операция: тотальная тиреоидэктомия после достижения эутиреоза; после неё левотироксин сразу 1,7 мкг/кг, ТТГ через 6-8 недель Что Доза, схема, срок К специалистам Эндокринолог постоянно; офтальмолог при офтальмопатии; кардиолог при нарушениях ритма и сердечной недостаточности"}, {"k": "t6", "l": "Замечания", "h": "<ul><li>Справочника по тиреотоксикозу нет (только ТТГ и св. Т4 в s01). Схемы в документе указаны с дозами (тиамазол, пропранолол, бисопролол). Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам.<\/li><\/ul>", "s": "Справочника по тиреотоксикозу нет (только ТТГ и св. Т4 в s01). Схемы в документе указаны с дозами (тиамазол, пропранолол, бисопролол). Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам."}, {"k": "info", "l": "О листе", "h": "<p>Шаблон приёма, формулировки диагнозов, коды и обследование взяты из присланного вами документа (краткие КР). Источник: Клинические рекомендации «Тиреотоксикоз с диффузным зобом (болезнь Грейвса), узловым/многоузловым зобом», 2025 год. Схемы лечения из вашего справочника добавлены отдельным блоком. Дата сборки: 18.11.2026.<\/p>", "s": ""}]}, {"id": "k26", "t": "Тиреотоксикоз с узловым и многоузловым зобом", "g": "c4", "kw": "E05.3 E05.4 E05.5 E05.8", "tabs": [{"k": "t1", "l": "Жалобы и осмотр", "h": "<p><strong>Копируйте в карту, пустые места заполняйте<\/strong><\/p><p class=\"tpl\">Жалобы: на апатию, депрессию, отсутствие аппетита, похудение, мышечную слабость, субфебрилитет, увеличение размеров шеи, чувство кома в горле, изменение голоса, затруднение дыхания, сердцебиение, нарушение сердечного ритма<\/p><p class=\"tpl\">Анамнез заболевания: Считает себя больным(ой) с __ года (указать период, когда впервые появились симптомы/поставлен диагноз; характерен длительный многолетний анамнез, манифестация в пожилом возрасте). Состоит на диспансерном учете/наблюдается у эндокринолога/кардиолога/гастроэнтеролога /невролога. Принимает препараты (описать характер, дозы и эффект назначенного ранее лечения, если проводилось). В анамнезе отсутствуют данные/присутствуют данные о длительном наличии узловых образований щитовидной железы без нарушения ее функции/наличии субклинического тиреотоксикоза/проживании в условиях йододефицита/ нерациональном приеме йодсодержащих препаратов/семейном анамнезе заболеваний щитовидной железы. Последнее обследование (при наличии): ТТГ, СТ3, СТ4, УЗИ щитовидной железы<\/p><p class=\"tpl\">Анамнез жизни: не отягощен, без особенностей/описать. ВИЧ, Гепатит В, С, сифилис, туберкулез отрицает. Операции, гемотрансфузии отрицает<\/p><p class=\"tpl\">Аллергологический анамнез: не отягощен/отягощен (указать аллерген и характер проявлений: отек Квинке, крапивница, зуд и тд.)<\/p><p class=\"tpl\">Эпидемиологический анамнез: выезды в эпидемиологически неблагополучные территории и другие страны отрицает. В контакте с инфекционными больными не находился<\/p><p class=\"tpl\">Лекарственная непереносимость: отрицает/да (перечислить лекарственные препараты и указать характер проявлений: отек Квинке, крапивница, зуд и тд.)<\/p><p class=\"tpl\">Хронические заболевания: отрицает/перечислить, если есть<\/p><p class=\"tpl\">Вредные привычки: отрицает/употребляет алкоголь/курение (стаж курения и сколько выкуриваемых сигарет в день)<\/p><p class=\"tpl\">Страховой анамнез: работает (указать, кем работает пациент)/не работает<\/p><p class=\"tpl\">Инвалидность: нет/есть (указать группу)<\/p><p class=\"tpl\">Объективный осмотр:<\/p><p class=\"tpl\">Общее состояние: состояние удовлетворительное. Сознание ясное, ориентирован во времени, в пространстве. Телосложение: нормостеническое/астеническое/ гиперстеническое. Рост - см, вес - кг. ИМТ - кг/м2. Подкожная жировая клетчатка развита снижено/умеренно/повышено. Температура тела 36.6 С (возможен субфебрилитет). Кожные покровы чистые, умеренной/повышенной влажности, физиологической окраски/гиперемированные, горячие на ощупь. Зоны гиперпигментации и депигментации отсутствуют; волосы без изменений/тонкие, ломкие, отмечается повышенное выпадение; ногти без изменений/мягкие, исчерченные, ломкие; высыпания, расчесы, гнойники, язвы, стрии, рубцы не выявлены. Слизистые оболочки чистые, умеренной влажности/сухие, физиологической окраски/гиперемированные. Слизистая конъюнктивы склер и нижнего века физиологической окраски/ гиперемирована. Зев розовый, чистый. Миндалины не увеличены, налета нет. Периферические лимфатические узлы не увеличены, безболезненны. Походка: без особенностей/медленная. Объем движений конечностей: в норме/ограничен. Мышечная сила сохранена/снижена (проксимальная миопатия). Щитовидная железа: локальное увеличение за счет узла(ов) (указать степень увеличения по ВОЗ), безболезненная, подвижная, поверхность бугристая (при множественных узлах)/ c четко пальпируемым единичным узлом. Экзофтальм отсутствуе
