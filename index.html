"><input type=\"checkbox\" data-o=\"Холтер ЭКГ\"><span>Холтер ЭКГ<\/span><\/label><\/td><td>При любых формах ФП и ТП; при редких приступах портативные регистраторы (от 24 часов до 7 суток)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ЭхоКГ\"><span>ЭхоКГ<\/span><\/label><\/td><td>Всем (I, A)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Калий, глюкоза, ТТГ и гормоны щитовидной железы\"><span>Калий, глюкоза, ТТГ и гормоны щитовидной железы<\/span><\/label><\/td><td>При впервые выявленной или необъяснимо ухудшившейся ФП (I, C)<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ОАК, биохимия, креатинин с СКФ\"><span>ОАК, биохимия, креатинин с СКФ<\/span><\/label><\/td><td>Выбор и дозы антикоагулянта; функцию почек на НОАК контролировать не реже 1 раза в 6 месяцев<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"CHA2DS2-VASc и HAS-BLED\"><span>CHA2DS2-VASc и HAS-BLED<\/span><\/label><\/td><td>Решают назначение антикоагулянта и контроль кровотечений<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div>", "s": "Что сделать Комментарий Источник ЭКГ 12 отведений Подтверждение ФП (I, A) КР Холтер ЭКГ При любых формах ФП и ТП; при редких приступах портативные регистраторы (от 24 часов до 7 суток) КР ЭхоКГ Всем (I, A) КР Калий, глюкоза, ТТГ и гормоны щитовидной железы При впервые выявленной или необъяснимо ухудшившейся ФП (I, C) КР СПР ОАК, биохимия, креатинин с СКФ Выбор и дозы антикоагулянта; функцию почек на НОАК контролировать не реже 1 раза в 6 месяцев КР CHA2DS2-VASc и HAS-BLED Решают назначение антикоагулянта и контроль кровотечений КР"}, {"k": "t2", "l": "Формулировка диагноза и код", "h": "<div class=\"tw\"><table><thead><tr><th>Фибрилляция предсердий [впервые выявленная / пароксизмальная / персистирующая / длительно персистирующая / постоянная], [тахисистолическая / нормосистолическая форма], [ЧСС ___], CHA2DS2-VASc ___ баллов, HAS-BLED ___ баллов. [Основное заболевание: АГ, ИБС, ХСН, тиреотоксикоз.] [Антикоагулянт: ___.]<\/th><th><\/th><th><\/th><\/tr><\/thead><tbody><tr><td>Код<\/td><td>Название<\/td><td>Источник<\/td><\/tr><tr><td>I48<\/td><td>Фибрилляция и трепетание предсердий (КР; при шифровании уточняйте подкод в действующей МКБ-10)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><div class=\"dx\" data-raw=\"Формы: пароксизмальная: ≥ 2 эпизодов, самокупирование до 7 суток; персистирующая: &gt; 7 суток, нужно вмешательство; длительно персистирующая: &gt; 1 года; постоянная: восстановление ритма не предпринимается или неэффективно. [КР]\"><\/div>", "s": "Фибрилляция предсердий [впервые выявленная / пароксизмальная / персистирующая / длительно персистирующая / постоянная], [тахисистолическая / нормосистолическая форма], [ЧСС ___], CHA2DS2-VASc ___ баллов, HAS-BLED ___ баллов. [Основное заболевание: АГ, ИБС, ХСН, тиреотоксикоз.] [Антикоагулянт: ___.] Код Название Источник I48 Фибрилляция и трепетание предсердий (КР; при шифровании уточняйте подкод в действующей МКБ-10) КР 7 суток, нужно вмешательство; длительно персистирующая: > 1 года; постоянная: восстановление ритма не предпринимается или неэффективно. [КР]\">"}, {"k": "t3", "l": "Лечение", "h": "<h3>Антикоагулянты<\/h3><div class=\"tw\"><table><thead><tr><th>Решение<\/th><th>Что по КР<\/th><th>Источни к<\/th><\/tr><\/thead><tbody><tr><td>Кому назначать<\/td><td>CHA2DS2-VASc: мужчинам ≥ 2, женщинам ≥ 3 рекомендовано (I, A); мужчинам 1 и женщинам 2 можно (IIa, B). HAS-BLED ≥ 3: не повод отказываться, а повод выбрать безопаснее и усилить контроль<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>НОАК или варфарин<\/td><td>НОАК предпочтительнее у ранее не получавших. Не при механических клапанах и умеренном или тяжёлом митральном стенозе<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Дабигатран<\/td><td>150 мг 2 раза в сутки; после 75 лет можно 110 мг 2 раза (IIb, B)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Ривароксабан<\/td><td>20 мг 1 раз в сутки. При высоком риске ЖКТ-кровотечений предпочтителен другой препарат (IIb)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Апиксабан, эдоксабан<\/td><td>В прочитанной части КР доз нет<\/td><td>Провери ть:<\/td><\/tr><tr><td>Варфарин<\/td><td>МНО 2,0-3,0 (механический клапан, митральный стеноз 2,5-3,5; с антиагрегантами 2,0-2,5); контроль не реже 1 раза в 4-6 недель; TTR не менее 70%, иначе перейти на НОАК<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Функция почек<\/td><td>Антикоагулянты возможны при СКФ не менее 15 мл/мин<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>Контроль частоты и ритма<\/h3><ul><li>Частота: бета-блокаторы, лучше кардиоселективные пролонгированные; возможна комбинация с дигоксином. Верапамил и недигидропиридиновые блокаторы кальция только при строгих противопоказаниях к бета-блокаторам. Цель ЧСС в покое: без симптомов не выше 110, с симптомами не выше 80 (при нагрузке не выше 110). Дозы в прочитанной части не приведены. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Ритм: купирование пароксизма в стационаре: до 48 ч прокаинамид, пропафенон или амиодарон. Пропафенон внутрь 300 мг, через 2 часа ещё 150-300 мг, первый приём только в стационаре под ЭКГ. Препараты I класса (пропафенон, лаппаконитин, этацизин) противопоказаны при структурной патологии сердца, ФВ ≤ 40%, ХСН, гипертрофии ЛЖ &gt; 15 мм; при ХСН только амиодарон. Электрическая кардиоверсия бифазным разрядом 50-75 Дж. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Катетерная аблация при пароксизмальной ФП, если один и более антиаритмических препаратов неэффективны (I, A). <span class=\"lb lb-kr\">КР<\/span> Кардиоверсия и подбор антиаритмиков не амбулаторная тактика участкового терапевта: направление к кардиологу. Проверить:<\/li><\/ul>", "s": "Антикоагулянты Решение Что по КР Источни к Кому назначать CHA2DS2-VASc: мужчинам ≥ 2, женщинам ≥ 3 рекомендовано (I, A); мужчинам 1 и женщинам 2 можно (IIa, B). HAS-BLED ≥ 3: не повод отказываться, а повод выбрать безопаснее и усилить контроль КР НОАК или варфарин НОАК предпочтительнее у ранее не получавших. Не при механических клапанах и умеренном или тяжёлом митральном стенозе КР Дабигатран 150 мг 2 раза в сутки; после 75 лет можно 110 мг 2 раза (IIb, B) КР Ривароксабан 20 мг 1 раз в сутки. При высоком риске ЖКТ-кровотечений предпочтителен другой препарат (IIb) КР Апиксабан, эдоксабан В прочитанной части КР доз нет Провери ть: Варфарин МНО 2,0-3,0 (механический клапан, митральный стеноз 2,5-3,5; с антиагрегантами 2,0-2,5); контроль не реже 1 раза в 4-6 недель; TTR не менее 70%, иначе перейти на НОАК КР Функция почек Антикоагулянты возможны при СКФ не менее 15 мл/мин КР Контроль частоты и ритма Частота: бета-блокаторы, лучше кардиоселективные пролонгированные; возможна комбинация с дигоксином. Верапамил и недигидропиридиновые блокаторы кальция только при строгих противопоказаниях к бета-блокаторам. Цель ЧСС в покое: без симптомов не выше 110, с симптомами не выше 80 (при нагрузке не выше 110). Дозы в прочитанной части не приведены. КР Ритм: купирование пароксизма в стационаре: до 48 ч прокаинамид, пропафенон или амиодарон. Пропафенон внутрь 300 мг, через 2 часа ещё 150-300 мг, первый приём только в стационаре под ЭКГ. Препараты I класса (пропафенон, лаппаконитин, этацизин) противопоказаны при структурной патологии сердца, ФВ ≤ 40%, ХСН, гипертрофии ЛЖ > 15 мм; при ХСН только амиодарон. Электрическая кардиоверсия бифазным разрядом 50-75 Дж. КР Катетерная аблация при пароксизмальной ФП, если один и более антиаритмических препаратов неэффективны (I, A). КР Кардиоверсия и подбор антиаритмиков не амбулаторная тактика участкового терапевта: направление к кардиологу. Проверить:"}, {"k": "t4", "l": "Наблюдение и экстренные ситуа…", "h": "<ul><li>Наблюдение кардиолога пожизненно, не реже 2 раз в год при поддерживающей антиаритмической или урежающей терапии. Не реже 1 раза в год: ЭКГ, ОАК, биохимия, Холтер, ЭхоКГ, гормоны щитовидной железы. МНО на варфарине не реже 1 раза в 4-6 недель. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Скорая и стационар: нарушения гемодинамики (экстренная электрическая кардиоверсия), неэффективный контроль частоты. Перечня показаний к плановой госпитализации в тексте нет; при ухудшении (рецидивы, падение переносимости нагрузки) внеочередной осмотр кардиолога. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Частоту диспансерных приёмов по 168н не подтвердила. Проверить:<\/li><\/ul>", "s": "Наблюдение кардиолога пожизненно, не реже 2 раз в год при поддерживающей антиаритмической или урежающей терапии. Не реже 1 раза в год: ЭКГ, ОАК, биохимия, Холтер, ЭхоКГ, гормоны щитовидной железы. МНО на варфарине не реже 1 раза в 4-6 недель. КР Скорая и стационар: нарушения гемодинамики (экстренная электрическая кардиоверсия), неэффективный контроль частоты. Перечня показаний к плановой госпитализации в тексте нет; при ухудшении (рецидивы, падение переносимости нагрузки) внеочередной осмотр кардиолога. КР Частоту диспансерных приёмов по 168н не подтвердила. Проверить:"}, {"k": "t5", "l": "Проверка", "h": "<ul><li>Совпадает с КР: МНО 2,0-3,0 на варфарине; дабигатран и ривароксабан как НОАК; формулировка «пароксизмальная / постоянная»; бета-блокаторы при ФП в s01.<\/li><li>Расхождения и пробелы: (1) в справочнике нет шкал CHA2DS2-VASc и HAS-BLED, а КР привязывает назначение антикоагулянта к баллам; (2) нет апиксабана, он часто используется, а в КР его дозы не прочитаны; (3) нет «персистирующая / длительно персистирующая»; (4) в справочнике «МНО или НОАК» для ФП при ИБС, но НОАК не рекомендованы при механических клапанах и умеренном или тяжёлом митральном стенозе.<\/li><li>Проверьте: КР редакции 2016, актуальную нашла не полностью; дозы приложений (бета-блокаторы, апиксабан) и график наблюдения в первых 100 тыс. знаков не найдены. Как проверено: КР прочитана автоматически, пересказ без ручной сверки. Сверяйте на cr.minzdrav.gov.ru и по инструкциям.<\/li><\/ul>", "s": "Совпадает с КР: МНО 2,0-3,0 на варфарине; дабигатран и ривароксабан как НОАК; формулировка «пароксизмальная / постоянная»; бета-блокаторы при ФП в s01. Расхождения и пробелы: (1) в справочнике нет шкал CHA2DS2-VASc и HAS-BLED, а КР привязывает назначение антикоагулянта к баллам; (2) нет апиксабана, он часто используется, а в КР его дозы не прочитаны; (3) нет «персистирующая / длительно персистирующая»; (4) в справочнике «МНО или НОАК» для ФП при ИБС, но НОАК не рекомендованы при механических клапанах и умеренном или тяжёлом митральном стенозе. Проверьте: КР редакции 2016, актуальную нашла не полностью; дозы приложений (бета-блокаторы, апиксабан) и график наблюдения в первых 100 тыс. знаков не найдены. Как проверено: КР прочитана автоматически, пересказ без ручной сверки. Сверяйте на cr.minzdrav.gov.ru и по инструкциям."}, {"k": "info", "l": "О листе", "h": "<p>Отдельной темы по ФП в вашем справочнике нет: есть шаблоны диагноза «ФП пароксизмальная / постоянная» (s01, a01) и фраза про антикоагулянты при ФП и ИБС (s02, a02: МНО 2,0-3,0 или дабигатран, ривароксабан). Лист составлен по КР «Фибрилляция и трепетание предсердий у взрослых» (ID 382, МКБ I48, на pravo.ppt.ru статус «действует», дата в карточке 2016; читала первые 100 тыс. из 155 тыс. знаков). Редакция может быть устаревшей: актуальную (2025) прочитать не успела, дозы апиксабана и эдоксабана в этом тексте нет. Дата сборки: 17.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k28", "t": "ХОБЛ", "g": "c2", "kw": "хроническая обструктивная болезнь лёгких курильщика J44.0 J44.1 J44.8 J44.9", "tabs": [{"k": "t1", "l": "Диагностический минимум", "h": "<div class=\"tw\"><table><thead><tr><th>Что сделать<\/th><th>Комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Спирометрия с бронхолитиком\"><span>Спирометрия с бронхолитиком<\/span><\/label><\/td><td>ОФВ1/ФЖЕЛ &lt; 0,7 после бронхолитика подтверждает необратимую обструкцию. Бронхолитическая проба для оценки обратимости<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Пульсоксиметрия\"><span>Пульсоксиметрия<\/span><\/label><\/td><td>SaO2 всем; газы крови при SaO2 ≤ 92%<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Шкалы mMRC и CAT, число обострений за год\"><span>Шкалы mMRC и CAT, число обострений за год<\/span><\/label><\/td><td>mMRC ≥ 2 или CAT ≥ 10: выраженные симптомы. Госпитализация за обострение в прошлом году: высокий риск<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ОАК с эозинофилами\"><span>ОАК с эозинофилами<\/span><\/label><\/td><td>Эозинофилы влияют на выбор ИГКС (100 и 300 кл/мкл)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Рентгенография ОГК\"><span>Рентгенография ОГК<\/span><\/label><\/td><td>Исключить другие причины одышки и кашля<\/td><td><span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Дифференциальный диагноз с БА\"><span>Дифференциальный диагноз с БА<\/span><\/label><\/td><td>Одна бронхолитическая проба не решает вопрос; нормализация ОФВ1 на ИГКС говорит в пользу БА. IgE при ХОБЛ не назначаем<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Тест 6-минутной ходьбы, бодиплетизмография, КТ\"><span>Тест 6-минутной ходьбы, бодиплетизмография, КТ<\/span><\/label><\/td><td>По показаниям (КТ при выраженной эмфиземе для вопроса о хирургической редукции)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div>", "s": "Что сделать Комментарий Источник Спирометрия с бронхолитиком ОФВ1/ФЖЕЛ КР Пульсоксиметрия SaO2 всем; газы крови при SaO2 ≤ 92% КР Шкалы mMRC и CAT, число обострений за год mMRC ≥ 2 или CAT ≥ 10: выраженные симптомы. Госпитализация за обострение в прошлом году: высокий риск КР ОАК с эозинофилами Эозинофилы влияют на выбор ИГКС (100 и 300 кл/мкл) КР Рентгенография ОГК Исключить другие причины одышки и кашля СПР Дифференциальный диагноз с БА Одна бронхолитическая проба не решает вопрос; нормализация ОФВ1 на ИГКС говорит в пользу БА. IgE при ХОБЛ не назначаем КР ПРАКТИКА Тест 6-минутной ходьбы, бодиплетизмография, КТ По показаниям (КТ при выраженной эмфиземе для вопроса о хирургической редукции) КР"}, {"k": "t2", "l": "Формулировка диагноза и код", "h": "<div class=\"tw\"><table><thead><tr><th>ХОБЛ, [стадия по ОФВ1 II / III / IV], группа [A / B / C / D], [фаза: обострение / ремиссия], [частые обострения / редкие обострения], ДН [0 / 1 / 2 ст.] [при необходимости: хроническое лёгочное сердце]. Спирометрия: ОФВ1/ФЖЕЛ ___, ОФВ1 ___% от должного. Курение ___ пачко-лет. mMRC ___, CAT ___.<\/th><th><\/th><th><\/th><\/tr><\/thead><tbody><tr><td>Код<\/td><td>Название<\/td><td>Источник<\/td><\/tr><tr><td>J44.0<\/td><td>ХОБЛ с острой респираторной инфекцией нижних дыхательных путей<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>J44.1<\/td><td>ХОБЛ с обострением неуточнённая<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>J44.8 / J44.9<\/td><td>ХОБЛ другая уточнённая / неуточнённая<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><div class=\"dx\" data-raw=\"Стадии по ОФВ1 (% от должного): I ≥ 80 (в тексте искажено), II 50-79, III 30-49, IV &lt; 30 (или &lt; 50 при хронической дыхательной недостаточности). Группы по КР 2021: A (ОФВ1 ≥ 50, обострений ≤ 1, mMRC 0-1, CAT &lt; 10), B (то же, но mMRC ≥ 2 или CAT ≥ 10), C (ОФВ1 &lt; 50 или ≥ 2 обострений, симптомов мало), D (то же, симптомов много). [КР] Проверить: в КР 2024 категории пересмотрены.\"><\/div>", "s": "ХОБЛ, [стадия по ОФВ1 II / III / IV], группа [A / B / C / D], [фаза: обострение / ремиссия], [частые обострения / редкие обострения], ДН [0 / 1 / 2 ст.] [при необходимости: хроническое лёгочное сердце]. Спирометрия: ОФВ1/ФЖЕЛ ___, ОФВ1 ___% от должного. Курение ___ пачко-лет. mMRC ___, CAT ___. Код Название Источник J44.0 ХОБЛ с острой респираторной инфекцией нижних дыхательных путей КР J44.1 ХОБЛ с обострением неуточнённая КР J44.8 / J44.9 ХОБЛ другая уточнённая / неуточнённая КР"}, {"k": "t3", "l": "Лечение стабильной ХОБЛ", "h": "<div class=\"tw\"><table><thead><tr><th>Ситуация<\/th><th>Что назначить<\/th><th>Источни к<\/th><\/tr><\/thead><tbody><tr><td>Всем<\/td><td>Отказ от курения; КДБА (сальбутамол, фенотерол) или КДАХ (ипратропий) по потребности; вакцинация против гриппа и пневмококка; физическая активность<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Симптомов мало<\/td><td>Монотерапия ДДАХ или ДДБА<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Симптомы выраженные (mMRC ≥ 2, CAT ≥ 10)<\/td><td>Сразу комбинация ДДАХ/ДДБА<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Повторные обострения (≥ 2 среднетяжёлых или ≥ 1 госпитализация в год)<\/td><td>ДДАХ/ДДБА или ИГКС/ДДБА. ИГКС/ДДБА предпочтительнее при эозинофилах от 100 кл/мкл или БА в анамнезе: &gt; 300 рекомендован, 100-300 возможен<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Эффекта двойной комбинации мало<\/td><td>Тройная терапия ДДАХ/ДДБА/ИГКС<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Рецидивы на тройной терапии<\/td><td>Рофлумиласт 250-500 мкг/сут (ОФВ1 &lt; 50%, хронический бронхит); азитромицин 250 мг ежедневно или 500 мг 3 раза в неделю (бронхоэктазы, гнойные обострения); ацетилцистеин 400-600 мг/сут или карбоцистеин 750 мг 2 раза<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Нельзя<\/td><td>Длительные пероральные ГКС. ИГКС отменять при отсутствии БА, обострений и эозинофилах ≤ 300, если назначен ДДБД. Теофиллин только дополнительно<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Конкретные торговые названия и дозы ДДАХ/ДДБА в прочитанной части КР не приведены. В вашем справочнике есть Спирива респимат 2 дозы 1 раз в день (c04/l010, написано для затяжного кашля и БА) и тиотропий в b11. <span class=\"lb lb-le\">ЛЕЧ<\/span> Проверить:<\/p>", "s": "Ситуация Что назначить Источни к Всем Отказ от курения; КДБА (сальбутамол, фенотерол) или КДАХ (ипратропий) по потребности; вакцинация против гриппа и пневмококка; физическая активность КР Симптомов мало Монотерапия ДДАХ или ДДБА КР Симптомы выраженные (mMRC ≥ 2, CAT ≥ 10) Сразу комбинация ДДАХ/ДДБА КР Повторные обострения (≥ 2 среднетяжёлых или ≥ 1 госпитализация в год) ДДАХ/ДДБА или ИГКС/ДДБА. ИГКС/ДДБА предпочтительнее при эозинофилах от 100 кл/мкл или БА в анамнезе: > 300 рекомендован, 100-300 возможен КР Эффекта двойной комбинации мало Тройная терапия ДДАХ/ДДБА/ИГКС КР Рецидивы на тройной терапии Рофлумиласт 250-500 мкг/сут (ОФВ1 КР Нельзя Длительные пероральные ГКС. ИГКС отменять при отсутствии БА, обострений и эозинофилах ≤ 300, если назначен ДДБД. Теофиллин только дополнительно КР Конкретные торговые названия и дозы ДДАХ/ДДБА в прочитанной части КР не приведены. В вашем справочнике есть Спирива респимат 2 дозы 1 раз в день (c04/l010, написано для затяжного кашля и БА) и тиотропий в b11. ЛЕЧ Проверить:"}, {"k": "t4", "l": "Обострение", "h": "<ul><li>Бронходилататоры КДБА или КДАХ, в том числе через небулайзер. <span class=\"lb lb-kr\">КР<\/span> В справочнике при обострении ХОБЛ и астмы: Пульмикорт 0,5 мг в 2 мл физраствора через небулайзер 2 раза в день 2 недели (c03/l001); в КР этого для ХОБЛ нет. <span class=\"lb lb-le\">ЛЕЧ<\/span><\/li><li>Системные ГКС: преднизолон 30-40 мг/сут 5-7 дней. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Антибиотики при усилении одышки с ростом объёма и гнойности мокроты (или двух из трёх признаков), СРБ ≥ 10 мг/л. Без факторов риска: амоксициллин, макролиды, цефалоспорины III поколения; с факторами риска и тяжёлом течении: амоксициллин/клавуланат или респираторные фторхинолоны. Дозы в прочитанной части не приведены. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Госпитализация: значимое ухудшение, SaO2 &lt; 90% или падение ≥ 4%, неэффективность амбулаторной терапии. Кислород: цель SaO2 88-92%. <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul>", "s": "Бронходилататоры КДБА или КДАХ, в том числе через небулайзер. КР В справочнике при обострении ХОБЛ и астмы: Пульмикорт 0,5 мг в 2 мл физраствора через небулайзер 2 раза в день 2 недели (c03/l001); в КР этого для ХОБЛ нет. ЛЕЧ Системные ГКС: преднизолон 30-40 мг/сут 5-7 дней. КР Антибиотики при усилении одышки с ростом объёма и гнойности мокроты (или двух из трёх признаков), СРБ ≥ 10 мг/л. Без факторов риска: амоксициллин, макролиды, цефалоспорины III поколения; с факторами риска и тяжёлом течении: амоксициллин/клавуланат или респираторные фторхинолоны. Дозы в прочитанной части не приведены. КР Госпитализация: значимое ухудшение, SaO2 КР"}, {"k": "t5", "l": "Наблюдение", "h": "<ul><li>Длительная кислородотерапия: оценивать через 3-4 недели после обострения; PaO2 55-59 или SaO2 89% с лёгочным сердцем, отёками или Ht &gt; 55%; не менее 15 часов в сутки. Домашняя вентиляция при PaCO2 &gt; 55 и симптомах ДН. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Лёгочная реабилитация 4-10 недель при стойкой одышке и малой переносимости нагрузки. <span class=\"lb lb-kr\">КР<\/span><\/li><li>График диспансерных приёмов в прочитанной части КР не найден. Проверить: частоту по 168н не подтвердила.<\/li><\/ul>", "s": "Длительная кислородотерапия: оценивать через 3-4 недели после обострения; PaO2 55-59 или SaO2 89% с лёгочным сердцем, отёками или Ht > 55%; не менее 15 часов в сутки. Домашняя вентиляция при PaCO2 > 55 и симптомах ДН. КР Лёгочная реабилитация 4-10 недель при стойкой одышке и малой переносимости нагрузки. КР График диспансерных приёмов в прочитанной части КР не найден. Проверить: частоту по 168н не подтвердила."}, {"k": "t6", "l": "Проверка", "h": "<ul><li>Расхождения: (1) отдельной темы по ХОБЛ нет, тактика ХОБЛ в справочнике сведена к небулайзеру (c03/l001); (2) Пульмикорт 0,5 мг 2 раза 2 недели при обострении ХОБЛ в КР нет: КР предлагает КДБА/КДАХ и преднизолон 30-40 мг 5-7 дней; (3) Спирива при затяжном кашле (c04) соответствует ДДАХ при ХОБЛ, но показание «кашель» нужно подтвердить спирометрией; (4) в p03 «IgE при ХОБЛ не назначаем» согласуется с КР.<\/li><li>Проверьте: КР 2021 утратила срок действия; категории и стартовая терапия в КР 2024 другие (по аннотации обзора: пересмотр категоризации, роль тройных фиксированных комбинаций). Дозы ингаляторов и антибиотиков не найдены. Как проверено: КР прочитана автоматически (первые 100 тыс. знаков). Проверяйте на cr.minzdrav.gov.ru и по инструкциям.<\/li><\/ul>", "s": "Расхождения: (1) отдельной темы по ХОБЛ нет, тактика ХОБЛ в справочнике сведена к небулайзеру (c03/l001); (2) Пульмикорт 0,5 мг 2 раза 2 недели при обострении ХОБЛ в КР нет: КР предлагает КДБА/КДАХ и преднизолон 30-40 мг 5-7 дней; (3) Спирива при затяжном кашле (c04) соответствует ДДАХ при ХОБЛ, но показание «кашель» нужно подтвердить спирометрией; (4) в p03 «IgE при ХОБЛ не назначаем» согласуется с КР. Проверьте: КР 2021 утратила срок действия; категории и стартовая терапия в КР 2024 другие (по аннотации обзора: пересмотр категоризации, роль тройных фиксированных комбинаций). Дозы ингаляторов и антибиотиков не найдены. Как проверено: КР прочитана автоматически (первые 100 тыс. знаков). Проверяйте на cr.minzdrav.gov.ru и по инструкциям."}, {"k": "info", "l": "О листе", "h": "<p>В вашем справочнике отдельной темы по ХОБЛ нет: есть только упоминания (c03/l001 небулайзер при обострении, c04/l010 Спирива при затяжном кашле, p03 иммуноглобулин Е не назначаем при ХОБЛ, p12 вакцинация против гриппа). Лист составлен по КР «ХОБЛ» (ID 603, взрослые, Российское респираторное общество, утверждена 2021, срок действия до 2023, читала на pravo.ppt.ru, первые 100 тыс. из 189 тыс. знаков). Новая КР 2024 существует (Авдеев и соавт., Тер. архив 2024, 96(3)), полного текста получить не удалось: группы и стартовую терапию сверьте с ней. Дата сборки: 17.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k29", "t": "Хроническая болезнь почек", "g": "c5", "kw": "ХБП почки хроническая болезнь почек СКФ E11.2 I12 I13 N18.1 N18.2 N18.3 N18.4 N18.5 N18.9", "tabs": [{"k": "t1", "l": "Жалобы и осмотр", "h": "<p><strong>Копируйте в карту, пустые места заполняйте<\/strong><\/p><p class=\"tpl\">Жалобы: на изменения цвета мочи, изменение объема диуреза (олигурию, полиурию), никтурию, появление отеков, аммиачный запах из полости рта, снижение аппетита, жажда, зуд кожных покровов, бледность, тошнота, головная боль, боли в суставах, повышение АД, учащенное сердцебиение, заторможенность, слабость, появление судорог, дискомфорта в области сердца<\/p><p class=\"tpl\">Анамнез жизни: Не отягощен, без особенностей/ описать. ВИЧ, Гепатит В, С, сифилис, туберкулез отрицает. Операции, гемотрансфузии отрицает. Вредные привычки: отрицает. +<\/p><p class=\"tpl\">Аллергический анамнез: Без особенностей/ перечислить возможные аллергические реакции на пищевые продукты, препараты и т. п., указать характер проявлений: отек Квинке, крапивница, зуд и т. д.<\/p><p class=\"tpl\">Эпидемиологический анамнез: контакты с инфекционными больными за последние 3 недели отрицает, выезды в эпид. неблаг-е территории и другие страны отрицает.<\/p><p class=\"tpl\">Экспертный анамнез: Работает/не работает<\/p><p class=\"tpl\">Анамнез заболевания: в анамнезе СД 2 типа, ИБС, ГБ, ХСН 1 стадии. Постоянно принимает препараты- перечислить. Состоит на Д учете у терапевта/кардиолога/невролога. В течение нескольких недель/месяцев отметил появление вышеуказанных симптомов. Результаты обследований- перечислить/мед документация не предоставлена. Обратился к терапевту/урологу/нефрологу.<\/p><p class=\"tpl\">Объективный осмотр:<\/p><p class=\"tpl\">Общее состояние: удовлетворительное/средней степени тяжести/тяжелое. Сознание: ясное. Кожные покровы и видимые слизистые чистые, физиологической окраски/акроцианоз. Зев- без изменений. Склеры нормальной окраски/иктеричные. Походка и поза: без особенностей. Объем движений конечностей:в норме. Суставы без видимых изменений. Тип конституции нормостенический/астенический/гиперстенический. Рост 167 м, Вес 67 кг, ИМТ 23 кг/м2, Окружность талии- 75см, Температура 36,6С.Лимфатические узлы подвижные. Отеки: отсутствуют/пастозность/до нижней трети голеней/средней трети/ верхней трети/анасарка. Отечность лица в области век.<\/p><p class=\"tpl\">Дыхательная система: при перкуссии звук ясный легочной; при аускультации дыхание везикулярное/жесткое/ослабленное. Хрипов нет/сухие/влажные/крепитация. ЧДД 17 в мин. Sp02- 98%<\/p><p class=\"tpl\">Сердечно-сосудистая система: аускультация сердца: тоны сердца звучные/приглушены, ритм правильный/неправильный, двухчленный/трехчленный; Патологические шумы не выслушиваются АД: На правой руке 120-130/70-80 мм.рт.ст. На левой руке 120-130/70-80 мм.рт.ст. ЧСС=80 уд в мин. Пульс=80 уд в мин регулярный/нерегулярный. ДП нет/есть.<\/p><p class=\"tpl\">Пищеварительная система: язык влажный, чистый. Живот правильной формы, симметричен, участвует в акте дыхания, при пальпации мягкий, безболезненный. Пальпация печени: справа по краю реберной дуги/+1-2 см выступает из-под края реберной дуги (гепатомегалия)/ поверхность (гладкая, ровная, бугристая)/консистенция (мягкая/плотная)/болезненность. Селезенка не пальпируется. Стул в норме.<\/p><p class=\"tpl\">Мочеполовая система: пальпация почек: болезненна/безболезненна. Перкуссия почек: симптом Пастернацкого отрицательный/ положительный справа/слева/с обеих сторон. Диурез- дизурия, никтурия.<\/p>", "s": "Копируйте в карту, пустые места заполняйте Жалобы: на изменения цвета мочи, изменение объема диуреза (олигурию, полиурию), никтурию, появление отеков, аммиачный запах из полости рта, снижение аппетита, жажда, зуд кожных покровов, бледность, тошнота, головная боль, боли в суставах, повышение АД, учащенное сердцебиение, заторможенность, слабость, появление судорог, дискомфорта в области сердца Анамнез жизни: Не отягощен, без особенностей/ описать. ВИЧ, Гепатит В, С, сифилис, туберкулез отрицает. Операции, гемотрансфузии отрицает. Вредные привычки: отрицает. + Аллергический анамнез: Без особенностей/ перечислить возможные аллергические реакции на пищевые продукты, препараты и т. п., указать характер проявлений: отек Квинке, крапивница, зуд и т. д. Эпидемиологический анамнез: контакты с инфекционными больными за последние г» читается как два АМКР сразу, в КР один АМКР из двух; (2) в справочнике нет иНГЛТ-2 и сакубитрила/валсартана, а КР ставит иНГЛТ-2 на первое место при любой ФВ (IA); (3) ФВ в b03: «менее 40» и «40-49», в КР ≤ 40 и 41-49; (4) Милдронат, Мексидол, Панангин в l504 при ХСН в прочитанной части КР не упомянуты; (5) стадии ХСН в шаблонах «I стадии» не совпадают с названиями КР 2024 (предстадия, 1, 2). Проверьте: остальная часть КР (острая декомпенсация, наблюдение при ХСНнФВ) не дочитана. Как проверено: КР прочитана автоматически (первые 200 тыс. знаков), текст пересказан без ручной сверки с оригиналом. Дозы и пороги сверяйте на cr.minzdrav.gov.ru и по инструкциям."}, {"k": "info", "l": "О листе", "h": "<p>Отдельной темы по ХСН в вашем справочнике нет: есть шаблоны диагноза (b02, b03, l502, l503: «ХСНсФВ (59%) I стадии, II ФК»), классификация по ФВ (s01, a01, b03), спиронолактон 25 мг / эплеренон 25 мг при ХСН (c12, l504). Лист составлен по КР «Хроническая сердечная недостаточность» 2024 (ID 156, взрослые, пересмотр не позднее 2026; читала на pravo.ppt.ru, первые 200 тыс. из 525 тыс. знаков, острая декомпенсация и остальное не прочитаны). Дата сборки: 17.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k31", "t": "Хронический холецистит/ЖКБ и хронический панкреатит", "g": "c3", "kw": "B12 E13 K80 K80.1 K80.2 K80.3 K80.5 K81.1 K86.0 K86.1 K86.3 K86.8", "tabs": [{"k": "t ": "<ul><li>Совпадает: порядок обезболивания (парацетамол или НПВП, затем трамадол, затем прегабалин) и ферменты при недостаточности: в РГА 2018 стартовая доза 25 тыс. ед. липазы на приём, в s16 40-50 тыс. на основной приём.<\/li><li>Расхождения внутри справочника: (1) ферменты: s16 40-50 тыс. ед. на еду (всего не менее 5 приёмов), a10 при отсутствии ВНС 30-50 тыс. ед. липазы в сутки (по 10 тыс. на приём), при ВНС более 100 тыс. ед. в сутки; (2) УДХК: s15 500-1250 мг/сут для сладжа, b15 250 мг ×3 на 14 дней: курс растворения сладжа обычно длиннее 2 недель (доказательства не искала); (3) боль при ХП: s16 только парацетамол и ибупрофен, a10 добавляет кетопрофен и диклофенак.<\/li><li>Проверить: трамадол в s16 «400 мг 1 раз в день»: 400 мг это максимальная суточная доза, обычно делят на приёмы, сверьте по инструкции; домперидон ограничивайте по срокам; взрослая КР по ЖКБ и КР по ХП в полном тексте не прочитаны, поэтому УДХК для камней (доза мг/кг и сроки), показания к плановой холецистэктомии при бессимптомных камнях и дозы ИПП при ХП я не проверила. Как проверено: КР острого холецистита прочитана автоматически (первые 100 тыс. знаков), РГА 2018 только аннотация. Проверяйте на cr.minzdrav.gov.ru и по инструкциям.<\/li><\/ul>", "s": "Совпадает: порядок обезболивания (парацетамол или НПВП, затем трамадол, затем прегабалин) и ферменты при недостаточности: в РГА 2018 стартовая доза 25 тыс. ед. липазы на приём, в s16 40-50 тыс. на основной приём. Расхождения внутри справочника: (1) ферменты: s16 40-50 тыс. ед. на еду (всего не менее 5 приёмов), a10 при отсутствии ВНС 30-50 тыс. ед. липазы в сутки (по 10 тыс. на приём), при ВНС более 100 тыс. ед. в сутки; (2) УДХК: s15 500-1250 мг/сут для сладжа, b15 250 мг ×3 на 14 дней: курс растворения сладжа обычно длиннее 2 недель (доказательства не искала); (3) боль при ХП: s16 только парацетамол и ибупрофен, a10 добавляет кетопрофен и диклофенак. Проверить: трамадол в s16 «400 мг 1 раз в день»: 400 мг это максимальная суточная доза, обычно делят на приёмы, сверьте по инструкции; домперидон ограничивайте по срокам; взрослая КР по ЖКБ и КР по ХП в полном тексте не прочитаны, поэтому УДХК для камней (доза мг/кг и сроки), показания к плановой холецистэктомии при бессимптомных камнях и дозы ИПП при ХП я не проверила. Как проверено: КР острого холецистита прочитана автоматически (первые 100 тыс. знаков), РГА 2018 только аннотация. Проверяйте на cr.minzdrav.gov.ru и по инструкциям."}, {"k": "info", "l": "О листе", "h": "<p>Основа: ваш справочник (ЖКТ l306, l307, l311, l312; Шаблоны s15, s16; Алгоритмы a10; Назначения b15, b16; в s16 прямо сказано, что схема взята из КР). Сверка: КР «Острый холецистит» (взрослые, 2021, срок до 2023, Российское общество хирургов, прочитано 100 тыс. из 144 тыс. знаков) и КР РГА по экзокринной недостаточности ПЖ 2018 (только аннотация). Взрослую КР по ЖКБ и КР по хроническому панкреатиту целиком получить не удалось: найденная КР по ЖКБ оказалась детской, её я не использовала. Дата сборки: 18.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k32", "t": "Цистит и пиелонефрит", "g": "c5", "kw": "N10 N11.0 N11.1 N11.8 N11.9 N13 N20.9 N30.0 N30.1 N30.2", "tabs": [{"k": "t1", "l": "Часть А. ЦИСТИТ", "h": "<h3>А1. Диагностический минимум<\/h3><div class=\"tw\"><table><thead><tr><th>Что<\/th><th>Комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\" ерапия (как выше)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"2 линия после квадротерапии — ИПП + левофлоксацин 500 мг 2 раза + амоксициллин 1000 мг 2 раза, 14 дней (или с висмутом)\"><span>2 линия после квадротерапии<\/span><\/label><\/td><td>ИПП + левофлоксацин 500 мг 2 раза + амоксициллин 1000 мг 2 раза, 14 дней (или с висмутом)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Повышение эффективности — Удвоенная доза ИПП, ребамипид, S. boulardii (меньше побочных эффектов), приверженность\"><span>Повышение эффективности<\/span><\/label><\/td><td>Удвоенная доза ИПП, ребамипид, S. boulardii (меньше побочных эффектов), приверженность<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"В вашем справочнике — Кларитромицин 500 ×2 + амоксициллин 1000 ×2 + ИПП (омез 40 мг ×2 в b13/l309, эзомепразол 20 мг ×2 в s13) + висмут 240 мг ×2 + Энтерол/Максилак; 2 линия: тетрациклин 500 ×4, метронидазол 500 ×3, ИПП 20 ×2, висмут\"><span>В вашем справочнике<\/span><\/label><\/td><td>Кларитромицин 500 ×2 + амоксициллин 1000 ×2 + ИПП (омез 40 мг ×2 в b13/l309, эзомепразол 20 мг ×2 в s13) + висмут 240 мг ×2 + Энтерол/Максилак; 2 линия: тетрациклин 500 ×4, метронидазол 500 ×3, ИПП 20 ×2, висмут<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> [П РАКТИК А]<\/td><\/tr><\/tbody><\/table><\/div><p>Контроль эрадикации: через 4-6 недель после окончания антибиотиков, 13C-дыхательный тест или антиген в кале; ИПП отменить за 2 недели, висмут и антибиотики за 4 недели. <span class=\"lb lb-kr\">КР<\/span><\/p>", "s": "Базис: ИПП и диета ИПП 4-6 недель (омепразол 20, лансопразол 30, пантопразол 40, рабепразол 20, эзомепразол 20 мг в сутки). Срок уточняется контрольной ЭГДС (в КР интервал 2-4 недели). КР ЛЕЧ Н2-блокаторы (фамотидин) 4-6 недель при неэффективности или противопоказаниях к ИПП. Дозы в КР не указаны, в справочнике фамотидин 40 мг. КР ЛЕЧ Ребамипид при ЯБ рекомендован (уровень В) и в схемы эрадикации (уровень А), дозы в прочитанной части КР нет. В вашем справочнике ребамипида нет. КР Проверить: Антациды (фосфалюгель 2 недели, маалокс 4 недели) и Тримедат 200 мг 3 раза 14 дней в справочнике есть, в прочитанной части КР доз нет. ЛЕЧ Эрадикация H. pylori (14 дней) Схема Состав и дозы Источни к 1 линия: тройная + висмут ИПП стандартная доза 2 раза/сут + кларитромицин 500 мг 2 раза + амоксициллин 1000 мг 2 раза + висмута трикалия дицитрат 120 мг 4 раза или 240 мг 2 раза КР 1 линия: классическая квадротерапия Висмут 120 мг 4 раза + ИПП 2 раза + тетрациклин 500 мг 4 раза + метронидазол 500 мг 3 раза, 10 или 14 дней КР 1 линия: без висмута ИПП 2 раза + амоксициллин 1000 мг 2 раза + кларитромицин 500 мг 2 раза + метронидазол 500 мг 3 раза КР Схема Состав и дозы Источни к 2 линия после неудачи тройной Классическая висмутовая квадротерапия (как выше) КР 2 линия после квадротерапии ИПП + левофлоксацин 500 мг 2 раза + амоксициллин 1000 мг 2 раза, 14 дней (или с висмутом) КР Повышение эффективности Удвоенная доза ИПП, ребамипид, S. boulardii (меньше побочных эффектов), приверженность КР В вашем справочнике Кларитромицин 500 ×2 + амоксициллин 1000 ×2 + ИПП (омез 40 мг ×2 в b13/l309, эзомепразол 20 мг ×2 в s13) + висмут 240 мг ×2 + Энтерол/Максилак; 2 линия: тетрациклин 500 ×4, метронидазол 500 ×3, ИПП 20 ×2, висмут ЛЕЧ [П РАКТИК А] Контроль эрадикации: через 4-6 недель после окончания антибиотиков, 13C-дыхательный тест или антиген в кале; ИПП отменить за 2 недели, висмут и антибиотики за 4 недели. КР"}, {"k": "t4", "l": "Лечение функциональной диспеп…", "h": "<div class=\"tw\"><table><thead><tr><th>Вариант<\/th><th>Что по КР<\/th><th>Что в справочнике<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td>Эпигастральная боль / смешанный<\/td><td>ИПП в стандартной дозе (NNT 7) или Н2-блокатор (NNT 8). Антациды не лучше плацебо. Эрадикация при H. pylori (NNT 17)<\/td><td>ИПП; фосфалюгель, маалокс<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Постпрандиальный дистресс<\/td><td>Прокинетики (NNT 4): итоприд 50-200 мг 3 раза, 8 недель (исследование); домперидон при тошноте и рвоте не более 7 дней; тримебутин (уровень С, доз нет)<\/td><td>Ганатон 50 мг ×3 до 8 нед (совпадает); Тримедат форте 300 мг ×2 1 месяц<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Не помогло<\/td><td>Трициклические антидепрессанты или СИОЗС в малых дозах, психотерапия, STW-5 (дозы не указаны)<\/td><td>не нашла<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Ферменты, спазмолитики<\/td><td>В КР нет<\/td><td>Панкреатин 25000 ×3 21 день; Метеоспазмил 2 раза 14-30 дней; Дюспаталин 200 ×2 при боли; дротаверин ×3 5 дней; Урсодез 250 на ночь 1 месяц<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Общее для ФД: дробное питание до 6 раз в сутки, меньше жирного, острого и кофе, отказ от курения, алкоголя, НПВП. <span class=\"lb lb-kr\">КР<\/span><\/p>", "s": "Вариант Что по КР Что в справочнике Источник Эпигастральная боль / смешанный ИПП в стандартной дозе (NNT 7) или Н2-блокатор (NNT 8). Антациды не лучше плацебо. Эрадикация при H. pylori (NNT 17) ИПП; фосфалюгель, маалокс КР ЛЕЧ Постпрандиальный дистресс Прокинетики (NNT 4): итоприд 50-200 мг 3 раза, 8 недель (исследование); домперидон при тошноте и рвоте не более 7 дней; тримебутин (уровень С, доз нет) Ганатон 50 мг ×3 до 8 нед (совпадает); Тримедат форте 300 мг ×2 1 месяц КР ЛЕЧ Не помогло Трициклические антидепрессанты или СИОЗС в малых дозах, психотерапия, STW-5 (дозы не указаны) не нашла КР Ферменты, спазмолитики В КР нет Панкреатин 25000 ×3 21 день; Метеоспазмил 2 раза 14-30 дней; Дюспаталин 200 ×2 при боли; дротаверин ×3 5 дней; Урсодез 250 на ночь 1 месяц ЛЕЧ Общее для ФД: дробное питание до 6 раз в сутки, меньше жирного, острого и кофе, отказ от курения, алкоголя, НПВП. КР"}, {"k": "t5", "l": "Тревожные признаки и наблюден…", "h": "<ul><li>Кровотечение: слабость, головокружение, обморок, холодный пот, рвота кровью или «кофейной гущей», мелена; ЧСС &gt; 100 и АД &lt; 100: кровопотеря около 20%. Перфорация: «кинжальная» боль, доскообразный живот. Стеноз: рвота съеденной накануне пищей. Малигнизация: потеря периодичности, анемия, рост СОЭ. Все: скорая и стационар. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Госпитализация также при выраженной боли, больших и гигантских язвах, неясной язве желудка, тяжёлой сопутствующей патологии. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Контрольная ЭГДС: при язве желудка после курса лечения с повторной биопсией (не менее 6 фрагментов); при язве ДПК только если симптомы сохраняются. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Диспансерное наблюдение ЯБ в прочитанной части КР отсутствует; при ФД график не указан. Проверить: частоту приёмов по 168н не подтвердила.<\/li><\/ul>", "s": "Кровотечение: слабость, головокружение, обморок, холодный пот, рвота кровью или «кофейной гущей», мелена; ЧСС > 100 и АД КР Госпитализация также при выраженной боли, больших и гигантских язвах, неясной язве желудка, тяжёлой сопутствующей патологии. КР Контрольная ЭГДС: при язве желудка после курса лечения с повторной биопсией (не менее 6 фрагментов); при язве ДПК только если симптомы сохраняются. КР Диспансерное наблюдение ЯБ в прочитанной части КР отсутствует; при ФД график не указан. Проверить: частоту приёмов по 168н не подтвердила."}, {"k": "t6", "l": "Проверка", "h": "<ul><li>Совпадает с КР: ИПП 4-6 недель и их дозы; тройная схема с висмутом; вторая линия с тетрациклином, метронидазолом и висмутом; биопсия язвы желудка; Ганатон 50 мг 3 раза.<\/li><li>Расхождения: (1) контроль эрадикации в s13 через 1,5-2 месяца (КР: 4-6 недель, ИПП за 2 недели до теста); (2) контрольная ЭГДС через 14-21 день (l309) для всех язв: КР требует её при язве желудка и при сохранении симптомов при язве ДПК; (3) омез 40 мг 2 раза в b13/l309 это удвоенная доза (КР допускает), в s13 эзомепразол 20 мг 2 раза стандартная; (4) в справочнике нет ребамипида; (5) длительность эрадикации в справочнике не нашла, по КР 14 дней; (6) при ФД справочник даёт ферменты, Урсодез и спазмолитики, в КР их нет.<\/li><li>Проверьте: КР по ФД редакции 2016, актуальную версию не нашла; дозы ИПП для ЯБ ДПК и ЯБ желудка по отдельности и профилактика НПВП-гастропатии в прочитанной части КР не найдены. Как проверено: КР прочитаны автоматически, раздел диспансерного наблюдения ЯБ не дочитан. Проверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам.<\/li><\/ul>", "s": "Совпадает с КР: ИПП 4-6 недель и их дозы; тройная схема с висмутом; вторая линия с тетрациклином, метронидазолом и висмутом; биопсия язвы желудка; Ганатон 50 мг 3 раза. Расхождения: (1) контроль эрадикации в s13 через 1,5-2 месяца (КР: 4-6 недель, ИПП за 2 недели до теста); (2) контрольная ЭГДС через 14-21 день (l309) для всех язв: КР требует её при язве желудка и при сохранении симптомов при язве ДПК; (3) омез 40 мг 2 раза в b13/l309 это удвоенная доза (КР допускает), в s13 эзомепразол 20 мг 2 раза стандартная; (4) в справочнике нет ребамипида; (5) длительность эрадикации в справочнике не нашла, по КР 14 дней; (6) при ФД справочник даёт ферменты, Урсодез и спазмолитики, в КР их нет. Проверьте: КР по ФД редакции 2016, актуальную версию не нашла; дозы ИПП для ЯБ ДПК и ЯБ желудка по отдельности и профилактика НПВП-гастропатии в прочитанной части КР не найдены. Как проверено: КР прочитаны автоматически, раздел диспансерного наблюдения ЯБ не дочитан. Проверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам."}, {"k": "info", "l": "О листе", "h": "<p>Собрано из вашего справочника («лечение.docx» ЖКТ l303, l309, l315; «Практики»; затем Шаблоны s13, Алгоритмы a08, Назначения b13, Быстро c23) и сверено с КР «Язвенная болезнь у взрослых» 2024 (MedElement, прочитано 100 тыс. из 208 тыс. знаков), КР РГА по H. pylori у взрослых 2022 и КР РГА «Функциональная диспепсия у взрослых» (КР275, редакция 2016, могла устареть). Детские КР не использовала. Дата сборки: 17.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}], "imgs": {}}</script>

/* ---------- routing ---------- */
function getRoute(){
  var h=location.hash.replace(/^#/,''),o={};
  h.split('&').forEach(function(p){if(!p)return;var a=p.split('=');o[a[0]]=decodeURIComponent(a[1]||'');});
  return o;
}
function setRoute(o){
  var s=[];for(var k in o){if(o[k])s.push(k+'='+encodeURIComponent(o[k]));}
  location.hash=s.join('&');
}

var qEl=$('q'),sbox=$('sbox');
function stem(w){return w.length>=7?w.slice(0,-2):(w.length>=5?w.slice(0,-1):w);}
function terms(q){return norm(q).split(/[\s,.;:]+/).filter(Boolean).map(stem);}
function runSearch(T){
  var out=[];
  TOPICS.forEach(function(t){
    if(favOnly){if(!isFav(t.id))return;}else if(only&&GS[t.g]!==only)return;
    var ok=true;
    for(var i=0;i<T.length;i++){
      var w=T[i];
      if(t.tn.indexOf(w)>-1) continue;
      if(!t.tabs.some(function(tb){return tb.n.indexOf(w)>-1;})){ok=false;break;}
    }
    if(!ok)return;
    var score=0;
    T.forEach(function(w){
      if(t.tn.indexOf(w)>-1) score+=50;
      t.tabs.forEach(function(tb){var c=0,p=-1;while((p=tb.n.indexOf(w,p+1))>-1&&c<20)c++;score+=c;});
    });
    /* best tab = most term hits */
    var best=t.tabs[0],bs=-1;
    t.tabs.forEach(function(tb){var s=0;T.forEach(function(w){if(tb.n.indexOf(w)>-1)s+=1+Math.min(5,(tb.n.split(w).length-1)/5);});if(s>bs){bs=s;best=tb;}});
    out.push({t:t,score:score,tab:best});
  });
  out.sort(function(a,b){return b.score-a.score;});
  return out;
}
function snippet(tb,T){
  var best=-1;
  for(var i=0;i<T.length;i++){var p=tb.n.indexOf(T[i]);if(p>-1&&(best<0||p<best))best=p;}
  if(best<0)return null;
  var a=Math.max(0,best-55),b=Math.min(tb.s.length,best+110);
  return (a>0?'… ':'')+tb.s.slice(a,b).replace(/\s+/g,' ')+(b<tb.s.length?' …':'');
}
function markText(root,T){
  if(!T.length)return null;
  var re=new RegExp(T.map(esc).join('|'),'g');
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],n;
  while((n=w.nextNode()))nodes.push(n);
  var first=null;
  nodes.forEach(function(node){
    var s=node.nodeValue,ns=norm(s);re.lastIndex=0;
    var m,last=0,frag=null;
    while((m=re.exec(ns))){
      if(!m[0].length){re.lastIndex++;continue;}
      if(!frag)frag=document.createDocumentFragment();
      frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      var mk=document.createElement('mark');mk.textContent=s.slice(m.index,m.index+m[0].length);
      frag.appendChild(mk);if(!first)first=mk;
      last=m.index+m[0].length;
    }
    if(frag){frag.appendChild(document.createTextNode(s.slice(last)));node.parentNode.replaceChild(frag,node);}
  });
  return first;
}
function groupName(id){for(var i=0;i<GROUPS.length;i++)if(GROUPS[i].id===id)return GROUPS[i].short;return '';}

function textOf(el){
  var tag=el.tagName;
  if(tag==='UL'||tag==='OL'){
    var out=[],i=0;
    Array.prototype.forEach.call(el.children,function(li){
      if(li.tagName!=='LI')return;i++;
      out.push((tag==='OL'?i+'. ':'– ')+clone(li).replace(/\s*\n\s*/g,' ').trim());
    });
    return out.join('\n');
  }
  if(tag==='DIV'&&el.classList.contains('tw')){
    return Array.prototype.map.call(el.querySelectorAll('tr'),function(tr){
      return Array.prototype.map.call(tr.children,function(c){return c.textContent.replace(/\s+/g,' ').trim();}).join('\t');

  }

}

}

function buildDx(el){
  var raw=el.getAttribute('data-raw'),re=/\[([^\]]*)\]|_{3,}/g,p=document.createElement('p'),last=0,m,ctl=[];

      var o=inner.split('/').map(function(x){return x.trim();}).filter(Boolean),w=o[0].split(' ');
      if(w.length>1&&o.slice(1).every(function(x){return x.split(' ').length===1;})){var pre=w.slice(0,-1).join(' ')+' ';o=[o[0]].concat(o.slice(1).map(function(x){return pre+x;}));}

    }else{c=document.createElement('input');c.type='text';c.placeholder=inner||'___';c.size=Math.max(6,Math.min(26,(inner||'___').length));}
    c.className='dxc';p.appendChild(c);ctl.push(c);
  }
  p.appendChild(document.createTextNode(raw.slice(last)));
  el.appendChild(p);
  var b=document.createElement('button');b.type='button';b.className='btn primary';b.textContent='Копировать в карту';
  b.onclick=function(){
    var s='';Array.prototype.forEach.call(p.childNodes,function(n){s+=n.nodeType===3?n.nodeValue:n.value;});
    s=s.replace(/\s+([,.;])/g,'$1').replace(/(,\s*){2,}/g,', ').replace(/\s{2,}/g,' ').trim();
    copy(s,'Диагноз скопирован');
  };
  el.appendChild(b);
}
function bindExtras(c,t,v,acts){

  Array.prototype.forEach.call(boxes,function(i){i.checked=!!P[i.getAttribute('data-o')];
    i.onchange=function(){var k=i.getAttribute('data-o');if(i.checked)P[k]=1;else delete P[k];upd();};});
  var bs=bar.querySelectorAll('button');
  bs[0].onclick=function(){copy('Назначения ('+t.t+'):\n'+Object.keys(P).map(function(x,i){return (i+1)+'. '+x;}).join('\n'),'Назначения скопированы');};
  bs[1].onclick=function(){Object.keys(P).forEach(function(k){delete P[k];});Array.prototype.forEach.call(boxes,function(i){i.checked=false;});upd();};
  v.appendChild(bar);upd();
  Array.prototype.forEach.call(c.querySelectorAll('.dx'),buildDx);
}

var CALCS={
bmi:{f:[{k:'w',l:'Вес, кг',t:'n'},{k:'h',l:'Рост, см',t:'n'}],run:function(v){
  if(!(v.w>0&&v.h>0))return null;var b=v.w/Math.pow(v.h/100,2);
  var c=b<16?'выраженный дефицит массы':b<18.5?'недостаточная масса':b<25?'норма':b<30?'избыточная масса':b<35?'ожирение I степени':b<40?'ожирение II степени':'ожирение III степени';
  return 'ИМТ '+b.toFixed(1)+' кг/м² — '+c+' (классификация ВОЗ)';}},
gfr:{f:[{k:'cr',l:'Креатинин, мкмоль/л',t:'n'},{k:'age',l:'Возраст, лет',t:'n'},{k:'sex',l:'Пол',t:'s',o:[['','выберите'],['m','мужской'],['f','женский']]},{k:'w',l:'Вес, кг (только для Кокрофта-Голта, необязательно)',t:'n'}],run:function(v){
  if(!(v.cr>0&&v.age>0&&v.sex))return null;
  var f=v.sex==='f',s=v.cr/88.4,k=f?0.7:0.9,m=Math.min(s/k,1),M=Math.max(s/k,1);
  var e21=142*Math.pow(m,f?-0.241:-0.302)*Math.pow(M,-1.2)*Math.pow(0.9938,v.age)*(f?1.012:1);
  var e09=141*Math.pow(m,f?-0.329:-0.411)*Math.pow(M,-1.209)*Math.pow(0.993,v.age)*(f?1.018:1);
  var st=e21>=90?'G1':e21>=60?'G2':e21>=45?'G3а':e21>=30?'G3б':e21>=15?'G4':'G5';
  var o='СКФ CKD-EPI 2021: '+Math.round(e21)+' мл/мин/1,73 м² (категория '+st+')\nСКФ CKD-EPI 2009: '+Math.round(e09)+' мл/мин/1,73 м²';
  if(v.w>0)o+='\nКлиренс креатинина по Кокрофту-Голту: '+Math.round((140-v.age)*v.w*1.23/v.cr*(f?0.85:1))+' мл/мин';
  return o+'\nХБП ставится при снижении СКФ или маркерах повреждения почек ≥ 3 месяцев.';}},
ldl:{f:[{k:'tc',l:'Общий холестерин, ммоль/л',t:'n'},{k:'hdl',l:'ЛПВП, ммоль/л',t:'n'},{k:'tg',l:'Триглицериды, ммоль/л',t:'n'}],run:function(v){
  if(!(v.tc>0&&v.hdl>0&&v.tg>0))return null;
  var o='Холестерин не-ЛПВП: '+(v.tc-v.hdl).toFixed(2)+' ммоль/л';
  if(v.tg>4.5)return o+'\nТГ > 4,5 ммоль/л: формула Фридвальда неприменима, нужно прямое определение ЛПНП.';
  return 'ЛПНП (Фридвальд): '+(v.tc-v.hdl-v.tg/2.2).toFixed(2)+' ммоль/л\n'+o;}},
pack:{f:[{k:'c',l:'Сигарет в день',t:'n'},{k:'y',l:'Стаж курения, лет',t:'n'}],run:function(v){
  if(!(v.c>0&&v.y>0))return null;var p=v.c*v.y/20;
  return 'Индекс курильщика: '+p.toFixed(1)+' пачко-лет'+(p>=10?' (≥ 10: фактор риска ХОБЛ)':'');}},
cha:{f:[{k:'sex',l:'Пол',t:'s',o:[['','выберите'],['m','мужской'],['f','женский']]},{k:'age',l:'Возраст',t:'s',o:[['0','младше 65'],['1','65–74'],['2','75 и старше']]},
  {k:'chf',l:'Сердечная недостаточность / сниженная ФВ ЛЖ (1)',t:'c',w:1},{k:'ah',l:'Артериальная гипертензия (1)',t:'c',w:1},{k:'dm',l:'Сахарный диабет (1)',t:'c',w:1},
  {k:'st',l:'Инсульт, ТИА или тромбоэмболия в анамнезе (2)',t:'c',w:2},{k:'va',l:'Сосудистое заболевание: перенесённый ИМ, ПАП, атеросклеротическая бляшка аорты (1)',t:'c',w:1}],
  run:function(v){if(!v.sex)return null;var n=+v.age+(v.sex==='f'?1:0);
  ['chf','ah','dm','st','va'].forEach(function(k){if(v[k])n+=(k==='st'?2:1);});
  var f=v.sex==='f',hi=f?3:2,lo=f?1:0;
  var t=n>=hi?'антикоагулянтная терапия показана (оценить риск кровотечения, например HAS-BLED)':n>lo?'можно рассмотреть антикоагулянт (индивидуальное решение)':'низкий риск, антикоагулянт не показан';
  return 'CHA₂DS₂-VASc: '+n+' '+(n%10===1&&n!==11?'балл':(n%10>=2&&n%10<=4&&(n<10||n>20)?'балла':'баллов'))+' — '+t+'\nОриентир по рекомендациям ЕОК; сверяйте с действующей российской клинической рекомендацией.';}},
curb:{f:[{k:'a',l:'Спутанность сознания, нарушение ориентации',t:'c'},{k:'b',l:'Мочевина > 7 ммоль/л',t:'c'},{k:'c',l:'ЧДД ≥ 30 в минуту',t:'c'},{k:'d',l:'САД < 90 или ДАД ≤ 60 мм рт. ст.',t:'c'},{k:'e',l:'Возраст ≥ 65 лет',t:'c'}],run:function(v){
  var n=['a','b','c','d','e'].filter(function(k){return v[k];}).length;
  return 'CURB-65: '+n+' из 5 — '+(n<=1?'низкий риск, возможно амбулаторное лечение':n===2?'умеренный риск, рассмотреть госпитализацию или краткое наблюдение':n===3?'высокий риск, госпитализация':'очень высокий риск, госпитализация, рассмотреть ОРИТ')+'\nМочевину в амбулатории не всегда определяют: тогда оценивайте по остальным критериям (CRB-65).';}}
};
function renderCalc(t){
  var C=CALCS[t.calc],v=$('view');v.textContent='';
  var head=document.createElement('div');head.className='tophead noprint';
  var back=document.createElement('button');back.className='backbtn';back.textContent='← К списку';back.onclick=function(){setRoute({});};
  var h1=document.createElement('h1');h1.textContent='🧮 '+t.t;
  var meta=document.createElement('div');meta.className='meta srcline s-kr';meta.textContent='Калькулятор · данные нигде не сохраняются';
  var acts=document.createElement('div');acts.className='acts';
  var fb=document.createElement('button');fb.className='btn'+(isFav(t.id)?' on':'');fb.textContent=isFav(t.id)?'★ В избранном':'☆ В избранное';
  fb.onclick=function(){toggleFav(t.id);renderList();renderTopic();};
  acts.appendChild(fb);head.appendChild(back);head.appendChild(h1);head.appendChild(meta);head.appendChild(acts);v.appendChild(head);
  var panel=document.createElement('div');panel.className='fpanel';var grid=document.createElement('div');grid.className='fgrid';
  var vals={},res=document.createElement('div'),cb=document.createElement('button');
  res.className='calcres';res.setAttribute('aria-live','polite');cb.className='btn primary';cb.type='button';cb.textContent='Копировать результат';
  function upd(){var r=C.run(vals);res.textContent=r||'Заполните поля, результат появится здесь.';cb.disabled=!r;}
  C.f.forEach(function(f){
    var w=document.createElement('div'),el;
    if(f.t==='c'){w.className='fld wide';var lb=document.createElement('label');lb.className='ck';el=document.createElement('input');el.type='checkbox';
      el.onchange=function(){vals[f.k]=el.checked;upd();};vals[f.k]=false;var sp=document.createElement('span');sp.textContent=f.l;lb.appendChild(el);lb.appendChild(sp);w.appendChild(lb);}
    else{w.className='fld';var l=document.createElement('label');l.textContent=f.l;
      if(f.t==='s'){el=document.createElement('select');f.o.forEach(function(o){el.appendChild(new Option(o[1],o[0]));});vals[f.k]=f.o[0][0];el.onchange=function(){vals[f.k]=el.value;upd();};}
      else{el=document.createElement('input');el.type='text';el.inputMode='decimal';el.autocomplete='off';el.oninput=function(){vals[f.k]=parseFloat(el.value.replace(',','.'));upd();};}
      w.appendChild(l);w.appendChild(el);}
    grid.appendChild(w);
  });
  cb.onclick=function(){copy(t.t+'\n'+res.textContent,'Результат скопирован');};
  panel.appendChild(grid);panel.appendChild(res);panel.appendChild(cb);v.appendChild(panel);
  var note=document.createElement('p');note.className='note';note.textContent='Вспомогательный расчёт. Решение о диагнозе и лечении принимает врач; проверяйте пороги по актуальным клиническим рекомендациям.';v.appendChild(note);
  upd();v.scrollTop=0;if(window.innerWidth<880)window.scrollTo(0,0);
}

function route(){
  var r=getRoute();
  if(r.t&&byId[r.t]){
    var changed=curId!==r.t;if(changed)picked[r.t]={};
    curId=r.t;curTab=r.k||null;mode=isForm(byId[curId])?'forms':'ref';
    document.body.classList.add('in-topic');
    renderList();renderTopic(true);
    document.title=byId[curId].t+' — Справочник терапевта';
  }else{
    curId=null;document.body.classList.remove('in-topic');
    document.title='Справочник участкового терапевта';
    renderList();showWelcome();
  }
}
