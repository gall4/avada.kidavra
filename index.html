ь; флутиказона фуроат+вилантерол 22/92 мкг 1 раз в день; салметерол+флутиказон 25/125 или 25/250 2 раза в день. Удвоение дозы ИГКС менее эффективно, чем добавление ДДБА КР ЛЕЧ СПР 4 Средние или высокие дозы ИГКС+ДДБА. Добавить тиотропий 2,5 мкг (2 вдоха 1 раз в сутки). При неконтроле и ≥ 1 обострении в год: тройная комбинация: вилантерол+умеклидиний+флутиказона фуроат 22/55/92 мкг 1 раз в сутки; беклометазон+гликопиррония+формотерол 100/10/6 мкг по 2 инг. 2 раза в сутки КР ЛЕЧ 5 (тяжёлая) Биологическая терапия по решению консилиума (омализумаб, меполизумаб, реслизумаб, бенрализумаб, дупилумаб, тезепелумаб), оценка эффекта через 16 недель. Системные ГКС только крайняя мера (преднизолон не более 7,5 мг/сут). Азитромицин 500 мг 3 раза в неделю не менее 6 месяцев после ЭКГ (QT) и анализа мокроты. Это тактика специалиста КР ЛЕЧ Проверить: дозы ИГКС (низкие/средние/высокие, в мкг беклометазона) лежат в приложениях КР, которые я не получила. Перед повышением ИГКС откройте таблицу в КР. В вашем справочнике «Беклометазон 400 мкг/сут» указан как стартовая доза. Обострение (амбулаторно) Что Доза и режим Источник Фенотерол+ипратропий (Беродуал), ДАИ Лёгкое обострение: 2-4 дозы каждые 3-4 часа. Средней тяжести: 6-10 доз каждые 1-2 часа КР ЛЕЧ Небулайзер: Беродуал 10-15 капель на 2 мл физраствора, 10 минут, утром и вечером (под контролем врача) ПРАКТИКА Небулайзер: сальбутамол 2,5 мг, повтор не раньше чем через 30 минут, до 4 раз в сутки КР Будесонид через небулайзер По КР: 1-2 мг 1-2 раза в сутки после КДБА. По справочнику: 4 мг/сут; «Практики»: 0,5 мг/мл, 2 мл, 7-10 минут утром и вечером 5-10 дней КР ЛЕЧ ПРАКТИКА Что Доза и режим Источник Преднизолон внутрь Справочник: 40 мг 1 раз в сутки 7 дней. По КР курс 5-7 дней (доза взрослым не указана в доступном мне тексте) ЛЕЧ КР Базисный ИГКС Удвоить на 2-4 недели, затем вернуть прежнюю дозу КР Кислород Целевая SpO2 93-95% (не выше 96%) КР ЛЕЧ Антибиотики Только при явных признаках бактериальной инфекции КР 60-80% от должного, SpO2 > 94% на воздухе.\"> Госпитализация (СМП): нет эффекта или ухудшение в течение часа; тяжёлое обострение, признаки дыхательной недостаточности; SpO2 60-80% от должного, SpO2 > 94% на воздухе. КР"}, {"k": "t4", "l": "Наблюдение и контроль через 6…", "h": "<div class=\"tw\"><table><thead><tr><th>Что<\/th><th>Как часто<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Контроль симптомов (ACT, ACQ-5) — через 2-4 недели после назначения, далее каждые 3 месяца\"><span>Контроль симптомов (ACT, ACQ-5)<\/span><\/label><\/td><td>через 2-4 недели после назначения, далее каждые 3 месяца<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Спирометрия — через 2-4 недели после начала терапии, далее каждые 6-12 месяцев\"><span>Спирометрия<\/span><\/label><\/td><td>через 2-4 недели после начала терапии, далее каждые 6-12 месяцев<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Диспансерный приём (аллерголог/пульмонолог) — не реже 1 раза в год у взрослых\"><span>Диспансерный приём (аллерголог/пульмонолог)<\/span><\/label><\/td><td>не реже 1 раза в год у взрослых<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Техника ингаляции и приверженность — на каждом визите\"><span>Техника ингаляции и приверженность<\/span><\/label><\/td><td>на каждом визите<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Вакцинация — грипп ежегодно; пневмококк: ПКВ, затем ППВ23 через 12 месяцев, далее каждые 5 лет; не в обострение (через 2-4 недели после)\"><span>Вакцинация<\/span><\/label><\/td><td>грипп ежегодно; пневмококк: ПКВ, затем ППВ23 через 12 месяцев, далее каждые 5 лет; не в обострение (через 2-4 недели после)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Проверить: частоту участия терапевта по приказу 168н я не подтвердила; выше интервалы по КР.<\/p><p>Минимум на визите через 6 месяцев<\/p><ul><li>Приступы днём и ночью, потребность в КДБА или ингаляции «по потребности», ACT, обострения и СГКС за период.<\/li><li>ОФВ1 (спирометрия не реже 1 раза в 6-12 месяцев), курение, триггеры, ринит.<\/li><li>При контроле ≥ 3 месяцев: снижение ИГКС на 25-50%; при неконтроле: проверить технику и приверженность, затем ступень вверх или направление к специалисту.<\/li><\/ul>", "s": "Что Как часто Источник Контроль симптомов (ACT, ACQ-5) через 2-4 недели после назначения, далее каждые 3 месяца КР Спирометрия через 2-4 недели после начала терапии, далее каждые 6-12 месяцев КР Диспансерный приём (аллерголог/пульмонолог) не реже 1 раза в год у взрослых КР Техника ингаляции и приверженность на каждом визите КР Вакцинация грипп ежегодно; пневмококк: ПКВ, затем ППВ23 через 12 месяцев, далее каждые 5 лет; не в обострение (через 2-4 недели после) КР Проверить: частоту участия терапевта по приказу 168н я не подтвердила; выше интервалы по КР. Минимум на визите через 6 месяцев Приступы днём и ночью, потребность в КДБА или ингаляции «по потребности», ACT, обострения и СГКС за период. ОФВ1 (спирометрия не реже 1 раза в 6-12 месяцев), курение, триггеры, ринит. При контроле ≥ 3 месяцев: снижение ИГКС на 25-50%; при неконтроле: проверить технику и приверженность, затем ступень вверх или направление к специалисту."}, {"k": "t5", "l": "Проверка", "h": "<ul><li>Совпадает с КР: стартовые варианты 1-4, будесонид+формотерол 160/4,5 (1-2 инг., до 12 в сутки), беклометазон+формотерол 100/6, Беродуал при обострении (2-4 дозы / 6-10 доз), снижение терапии на 25-50% через 3 месяца, критерий ОФВ1 +12% и 200 мл.<\/li><li>Расхождение: в «Назначениях» и «Пульмонологии (ещё вариант)» ступень 1 описана через «будесонид+формотерол по потребности», а ступень 2 как «+ беклометазон 2 раза в день, суточная доза 400 мг» (в тексте опечатка «мг», должно быть «мкг»). Монотерапии сальбутамолом нет, это верно по КР.<\/li><li>Требует уточнения: схема «Беклазон 100 мкг х 2 р в сутки + Беродуал 20 капель при приступах» (раздел «Назначения») в КР 2024 не описана: по КР базисно ИГКС (лучше в комбинации с формотеролом), для приступов формотерол-содержащая комбинация или КДБА; Беродуал как основа приступов в КР не указан. Решите сами, оставлять ли её в практике.<\/li><li>Расхождение по ГКС: преднизолон 40 мг 7 дней (справочник) и курс 5-7 дней (КР): совпадает по сроку; доза для взрослых в КР в доступном мне тексте не указана.<\/li><li>Опечатки: «Флуктиказона», «сальметерол» (салметерол), «нейбулайзер», «Обледование».<\/li><li>В КР не нашла в ваших разделах: «Практики» (небулайзер Беродуал + будесонид на дому) в КР в такой форме нет, это мнение практиков. Как проверено: КР 2024 прочитана автоматически по тексту на pravo.ppt.ru (часть текста с ступенями, дозами ИГКС в приложениях и схемой обострения для взрослых получена не полностью). Перед использованием сверьте с официальным текстом в Рубрикаторе (cr.minzdrav.gov.ru) и с инструкциями препаратов.<\/li><\/ul>", "s": "Совпадает с КР: стартовые варианты 1-4, будесонид+формотерол 160/4,5 (1-2 инг., до 12 в сутки), беклометазон+формотерол 100/6, Беродуал при обострении (2-4 дозы / 6-10 доз), снижение терапии на 25-50% через 3 месяца, критерий ОФВ1 +12% и 200 мл. Расхождение: в «Назначениях» и «Пульмонологии (ещё вариант)» ступень 1 описана через «будесонид+формотерол по потребности», а ступень 2 как «+ беклометазон 2 раза в день, суточная доза 400 мг» (в тексте опечатка «мг», должно быть «мкг»). Монотерапии сальбутамолом нет, это верно по КР. Требует уточнения: схема «Беклазон 100 мкг х 2 р в сутки + Беродуал 20 капель при приступах» (раздел «Назначения») в КР 2024 не описана: по КР базисно ИГКС (лучше в комбинации с формотеролом), для приступов формотерол-содержащая комбинация или КДБА; Беродуал как основа приступов в КР не указан. Решите сами, оставлять ли её в практике. Расхождение по ГКС: преднизолон 40 мг 7 дней (справочник) и курс 5-7 дней (КР): совпадает по сроку; доза для взрослых в КР в доступном мне тексте не указана. Опечатки: «Флуктиказона», «сальметерол» (салметерол), «нейбулайзер», «Обледование». В КР не нашла в ваших разделах: «Практики» (небулайзер Беродуал + будесонид на дому) в КР в такой форме нет, это мнение практиков. Как проверено: КР 2024 прочитана автоматически по тексту на pravo.ppt.ru (часть текста с ступенями, дозами ИГКС в приложениях и схемой обострения для взрослых получена не полностью). Перед использованием сверьте с официальным текстом в Рубрикаторе (cr.minzdrav.gov.ru) и с инструкциями препаратов."}, {"k": "info", "l": "О листе", "h": "<p>Собрано из вашего справочника и сверено с КР «Бронхиальная астма» (взрослые и дети), 2024 г., одобрены Научно-практическим советом Минздрава РФ, пересмотр не позднее 2026 г. (текст читала на pravo.ppt.ru). Дата сборки: 16.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k06", "t": "Внебольничная пневмония", "g": "c2", "kw": "J13 J14 J15 J15.0 J15.1 J15.2 J15.3 J15.7 J15.8 J15.9 J16 J16.0 J16.8 J18 J18.0 J18.1 J18.8 J18.9", "tabs": [{"k": "t1", "l": "Жалобы и осмотр", "h": "<p><strong>Копируйте в карту, пустые места заполняйте<\/strong><\/p><p class=\"tpl\">Жалобы: на влажный кашель отделение мокроты светлого/зеленоватого цвета, одышка при умеренных физических нагрузках, боль в грудной клетке, связанную с дыханием, немотивированная слабость, утомляемость, ознобы, сильноепотоотделение по ночам<\/p><p class=\"tpl\">Анамнез жизни: Не отягощен, без особенностей/ описать. ВИЧ, Гепатит В, С, сифилис, туберкулез отрицает. Операции, гемотрансфузии отрицает. Вредные привычки: курение/отрицает<\/p><p class=\"tpl\">Аллергический анамнез: Без особенностей/ перечислить возможные аллергические реакции на пищевые продукты, препараты и т. п., указать характер проявлений: отек Квинке, крапивница, зуд и т. д.<\/p><p class=\"tpl\">Эпидемиологический анамнез: контакты с инфекционными больными за последние 3 недели отрицает, выезды в эпид. неблаг-е территории и другие страны отрицает.<\/p><p class=\"tpl\">Экспертный анамнез: Работает/не работает<\/p><p class=\"tpl\">Анамнез заболевания: Считает себя больным длительное время, постоянно принимает препараты______, состоит на Д учете/наблюдается у кардиолога/ терапевта/пульмонолога. Хронические заболевания: отрицает/ ИБС. ХСН 1 стадия, ГБ, БА, ХОБЛ. Ухудшение состояния отметил после перенесенного острой вирусной инфекции. Самостоятельно не лечился/лечился (чем?)<\/p><p class=\"tpl\">Объективный осмотр:<\/p><p class=\"tpl\">Общее состояние: удовлетворительное/средней степени тяжести/тяжелое. Сознание: ясное. Кожные покровы и видимые слизистые чистые, физиологической окраски/акроцианоз/диффузный цианоз/центральный серый цианоз/ конечности теплые/холодные. Зев и небные дужки без изменений; миндалины без изменений; склеры нормальной окраски/иктеричные. Походка и поза: без особенностей/ вынужденное положение ортопноэ (сидячее, с опущенными внизногами). Объем движений конечностей:в норме. Суставы без видимых изменений.Тип конституции нормостенический/астенический/гиперстенический. Рост 167 м, Вес 67 кг, ИМТ 23кг/м2, Окружность талии- 75см, Температура 36,6С. Периферические лимфатические узлы: не увеличены, безболезненны. Отеки: отсутствуют/пастозость/до нижней трети голеней/средней трети/ верхней трети.<\/p><p class=\"tpl\">Дыхательная система: отставание пораженной грудной клетки при дыхании; при перкуссии укорочение перкуторного звука над пораженным участком легкого; при аускультации дыхание везикулярное/жесткое/ослабленное/ локальновыслушиваемое бронхильное дыхание. Хрипов нет/сухие/влажные звучные мелкопузырчатые/крепитация. Усиление бронхофонии, голосового дрожания. ЧДД 22 в мин. Sp02- 90%/<\/p><p class=\"tpl\">Сердечно-сосудистая система: аускультация сердца: тоны сердца звучные/ приглушены, ритм правильный/неправильный, двухчленный/трехчленный; акцент/ раздвоение 2 тона над ЛА. Патологические шумы не выслушиваются/ систолический/диастолический шум над ЛА, систолический/голосистолический шум в области трикуспидального клапана, усиливающиеся на высоте вдоха. АД: На правой руке 120-130/70-80 мм.рт.ст. На левой руке 120-130/70-80 мм.рт.ст. ЧСС=80 уд в мин. Пульс=80 уд в мин регулярный/нерегулярный. ДП нет/есть. Пародоксальный пульс (снижение АД более 10 мм рт ст на выдохе). Осмотр яремных вен: набухание шейных вен только на выдохе/на вдохе и выдохе/положительный венный пульс/отрицательный венный пульс- в норме. Пульсация в надчревной области (увеличение ПЖ).<\/p><p class=\"tpl\">Пищеварительная система: язык влажный, чистый. Живот правильной формы, симметричен, участвует в акте дыхания, при пальпации мягкий, безболезненный. Пальпация печени: справа по краю реберной дуги/+1-2 см выступает из-под края реберной дуги (гепатомегалия)/ поверхность (гладкая, ровная, бугристая)/консистенция (мягкая/плотная)/болезненность. Гепатоюгулярный рефлюкс: надавливание на живот в области правого подреберья-набухание и пульсация яремных вен/в норме давление в шейных венах прежнее или снижается. Селезенка не пальпируются. Стул в норме.<\/p><p class=\"tpl\">Мочеполовая система: симптом Пастернацкого отрицательный. Диурез в норме.<\/p>", "s": "Копируйте в карту, пустые места заполняйте Жалобы: на влажный кашель отделение мокроты светлого/зеленоватого цвета, одышка при умеренных физических нагруз дые 12 часов или 0,75 г каждые 24 часа (в вашем справочнике: 500 мг 2 раза, совпадает) Моксифлоксацин 0,4 г внутрь каждые 24 часа Ампициллин/сульбактам В таблице только парентерально: 1,5-3 г в/в или в/м каждые 6-8 часов Длительность Нетяжёлая ВП обычно 5-7 дней (отмена при стойкой нормализации температуры не менее 48 часов и других критериях); при тяжёлой ВП 7 дней Оценка через 48-72 часа Температура, интоксикация, ЧДД; СРБ на 3-4 день (снижение менее чем на 50% говорит о неэффективности) Госпитализация CRB-65/CURB-65: 0 баллов (1 группа) можно амбулаторно; 3 и более баллов срочно в ОРИТ. Признаки: нарушение сознания, мочевина более 7, ЧДД ≥ 30, САД Симптоматическое Парацетамол или НПВП только при температуре выше 38,5 или выраженной плевральной боли; муколитики рутинно не рекомендованы; пить достаточно жидкости Вакцинация Грипп ежегодно (октябрь, первая половина ноября). Пневмококк: 18-64 года с факторами риска ППСВ23 однократно; высокий риск или 65 и старше ПКВ13, через 12 месяцев ППСВ23, затем ППСВ23 каждые 5 лет"}, {"k": "t6", "l": "Схемы из вашего справочника", "h": "<p>Тема c03: ОРВИ, бронхит, пневмония — общий шаблон<\/p><ul><li>Это мой общий шаблон лечения (ОРВИ, Фарингиты, Тонзиллиты, Трахеиты. Бронхиты, Пневмонии, Синуситы)<\/li><li>Пневмония - - левофлоксацин 500 мг по 1 таб х 2 раза в сутки - 5 дней - аципол 1 к х 1 раз в сутки - 10 дней<\/li><li>Амоксициллин+Клавулановая к-та (Флемоклав) 875/125 мг 2 раза в день 7 дней<\/li><li>Левофлоксацин (Таваник, Леволет, Глево) 500 мг 2 раза в день 5 дней<\/li><\/ul>", "s": "Тема c03: ОРВИ, бронхит, пневмония — общий шаблон Это мой общий шаблон лечения (ОРВИ, Фарингиты, Тонзиллиты, Трахеиты. Бронхиты, Пневмонии, Синуситы) Пневмония - - левофлоксацин 500 мг по 1 таб х 2 раза в сутки - 5 дней - аципол 1 к х 1 раз в сутки - 10 дней Амоксициллин+Клавулановая к-та (Флемоклав) 875/125 мг 2 раза в день 7 дней Левофлоксацин (Таваник, Леволет, Глево) 500 мг 2 раза в день 5 дней"}, {"k": "t7", "l": "Замечания", "h": "<ul><li>Расхождение: в справочнике (c03) «левофлоксацин 500 мг 2 раза в сутки 5 дней + Аципол 10 дней», а в вашем документе антибиотики названы только группой. По КР «Внебольничная пневмония» (редакция 2021, читала я) на амбулаторном этапе: нетяжёлая без сопутствующих заболеваний и без антибиотиков за 3 месяца: амоксициллин (альтернатива: макролид); при ХОБЛ, СД, ХСН, ХБП, циррозе, алкоголизме, приёме антибиотиков за 3 месяца: амоксициллин/клавуланат или ампициллин/сульбактам, респираторный фторхинолон (левофлоксацин, моксифлоксацин) как альтернатива. Макролиды первым рядом не рекомендованы из-за резистентности пневмококка. Дозы: блок 5а ниже (общая таблица доз из КР; в прочитанной части КР нет отдельной таблицы именно для амбулатории, поэтому режим выбирайте по инструкции).<\/li><li>Длительность обычно 5-7 дней; отмена возможна при температуре до 37,2 °C не менее 48 часов, ЧДД менее 20, нет гнойной мокроты, лейкоциты менее 10, нейтрофилы менее 80%. Оценка эффекта через 48-72 часа. Контрольный рентген для решения об отмене не нужен: инфильтрация исчезает за 3-4 недели. (КР 2021)<\/li><li>Госпитализация: тяжёлая ВП и неэффективность амбулаторного лечения; пороги CURB-65 в прочитанной части КР не найдены. Вакцинацию против пневмококка и гриппа в справочнике ищите в теме p12. Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам.<\/li><\/ul>", "s": "Расхождение: в справочнике (c03) «левофлоксацин 500 мг 2 раза в сутки 5 дней + Аципол 10 дней», а в вашем документе антибиотики названы только группой. По КР «Внебольничная пневмония» (редакция 2021, читала я) на амбулаторном этапе: нетяжёлая без сопутствующих заболеваний и без антибиотиков за 3 месяца: амоксициллин (альтернатива: макролид); при ХОБЛ, СД, ХСН, ХБП, циррозе, алкоголизме, приёме антибиотиков за 3 месяца: амоксициллин/клавуланат или ампициллин/сульбактам, респираторный фторхинолон (левофлоксацин, моксифлоксацин) как альтернатива. Макролиды первым рядом не рекомендованы из-за резистентности пневмококка. Дозы: блок 5а ниже (общая таблица доз из КР; в прочитанной части КР нет отдельной таблицы именно для амбулатории, поэтому режим выбирайте по инструкции). Длительность обычно 5-7 дней; отмена возможна при температуре до 37,2 °C не менее 48 часов, ЧДД менее 20, нет гнойной мокроты, лейкоциты менее 10, нейтрофилы менее 80%. Оценка эффекта через 48-72 часа. Контрольный рентген для решения об отмене не нужен: инфильтрация исчезает за 3-4 недели. (КР 2021) Госпитализация: тяжёлая ВП и неэффективность амбулаторного лечения; пороги CURB-65 в прочитанной части КР не найдены. Вакцинацию против пневмококка и гриппа в справочнике ищите в теме p12. Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам."}, {"k": "info", "l": "О листе", "h": "<p>Шаблон приёма, формулировки диагнозов, коды и обследование взяты из присланного вами документа (краткие КР). Источник - Клинические рекомендации «Внебольничная пневмония у взрослых», 2024 год.. Схемы лечения из вашего справочника добавлены отдельным блоком. Дата сборки: 18.11.2026.<\/p>", "s": ""}]}, {"id": "k07", "t": "Гипотиреоз", "g": "c4", "kw": "щитовидная железа ТТГ E89.0", "tabs": [{"k": "t1", "l": "Жалобы и осмотр", "h": "<p><strong>Копируйте в карту, пустые места заполняйте<\/strong><\/p><p class=\"tpl\">Жалобы: на момент осмотра не предъявляет/ на выраженную утомляемость, сонливость, сухость кожных покровов, выпадение волос, замедленную речь, отечность лица, пальцев рук и ног, увеличение веса, нарушение менструального цикла, запоры, снижение памяти, зябкость, охриплость голоса, подавленное настроение<\/p><div class=\"dx\" data-raw=\"Анамнез заболевания: Считает себя больным(ой) с __ года (указать период, когда впервые появились симптомы/ поставлен диагноз). Состоит на диспансерном учете/ наблюдается у эндокринолога/кардиолога/гастроэнтеролога/ревматолога/дерматолога/ психиатра/гинеколога. Принимает препараты (описать характер, дозы и эффект назначенного ранее лечения, если проводилось). В анамнезе отсутствуют данные/ присутствуют данные об оперативных вмешательствах на щитовидной железе/ терапии натрия йодидом [131I]/ опухолях гипоталамо-гипофизарной области/ оперативном и лучевом воздействии на гипоталамо-гипофизарную область/ проживании в условиях йододефицита/ семейном анамнезе заболеваний щитовидной железы. Хронические заболевания: желчнокаменная болезнь/ хронический гепатит/ полиартрит/полисиновит/прогрессирующий остеоартроз/дисфункциональные маточные кровотечения/бесплодие. Последнее обследование (при наличии): ТТГ, СТ4, антитела к ткани щитовидной железы (АТ-ТПО, АТ-ТГ), УЗИ щитовидной железы, ЭКГ, липидный профиль\"><\/div><p class=\"tpl\">Анамнез жизни: не отягощен, без особенностей/описать. ВИЧ, Гепатит В, С, сифилис, туберкулез отрицает. Операции, гемотрансфузии отрицает<\/p><p class=\"tpl\">Аллергологический анамнез: не отягощен/отягощен (указать аллерген и характер проявлений: отек Квинке, крапивница, зуд и тд.)<\/p><p class=\"tpl\">Эпидемиологический анамнез: выезды в эпидемиологически неблагополучные территории и другие страны отрицает. В контакте с инфекционными больными не находился<\/p><p class=\"tpl\">Лекарственная непереносимость: отрицает/да (перечислить лекарственные препараты и указать характер проявлений: отек Квинке, крапивница, зуд и тд.)<\/p><p class=\"tpl\">Хронические заболевания: отрицает/перечислить, если есть<\/p><p class=\"tpl\">Вредные привычки: отрицает/употребляет алкоголь/курение (стаж курения и сколько выкуриваемых сигарет в день)<\/p><p class=\"tpl\">Страховой анамнез: работает (указать, кем работает пациент)/не работает<\/p><p class=\"tpl\">Инвалидность: нет/есть (указать группу)<\/p><p class=\"tpl\">Объективный осмотр:<\/p><p class=\"tpl\">Общее состояние: состояние удовлетворительное. Сознание ясное, ориентирован во времени, в пространстве. Телосложение: нормостеническое/астеническое/ гиперстеническое. Рост - см, вес - кг. ИМТ - кг/м2. Подкожная жировая клетчатка развита снижено/умеренно/повышено. Температура тела 36.6 С (возможна гипотермия). Кожные покровы чистые, умеренной влажности/сухие, физиологической окраски/ бледные/c желтушным оттенком, холодные на ощупь, отмечается утолщение и гиперкератоз, особенно разгибательных поверхностей конечностей. Зоны гиперпигментации и депигментации отсутствуют, тургор сохранен/снижен; волосы без изменений/сухие, ломкие, имеется алопеция, выпадение волос наружной трети бровей (симптом Хертога), выпадение волос в области подмышечных впадин и лобка; ногти без изменений/ломкие, с поперечной исчерченностью; высыпания, расчесы, гнойники, язвы, стрии, рубцы не выявлены. Слизистые оболочки чистые, умеренной влажности/сухие, физиологической окраски/бледные. Слизистая конъюнктивы склер и нижнего века физиологической окраски/бледная. Зев розовый, чистый. Миндалины не увеличены, налета нет. Периферические лимфатические узлы не увеличены, безболезненны. Походка: без особенностей/медленная. Объем движений конечностей: в норме/снижен. Суставы без видимых изменений. Мышечная сила сохранена/снижена. Щитовидная железа: не увеличена/увеличена/отсутствует, при пальпации мягко-эластической/плотно-эластической консистенции, безболезненная, подвижная. Экзофтальм отсутствует; Тремор отсутствует. Отеки отсутствуют/ отмечаются микседематозные отеки, одутловатое лицо, отеки век, верхних и нижних конечностей<\/p><p class=\"tpl\">Дыхательная система: При перкуссии звук ясный легочной; при аускультации дыхание везикулярное/жесткое/ослабленное. Хрипов нет/сухие/влажные/крепитация. ЧДД 17 в мин. Sp02- 98%<\/p><p class=\"tpl\">Сердечно-сосудистая система: аускультация сердца: тоны сердца звучные/приглушены, ритм правильный/неправильный, двухчленный/трехчленный; Патологические шумы не выслушиваются АД: На правой руке 120-130/70-80 мм.рт.ст. На левой руке 120-130/70-80 мм.рт.ст. (воз го мкг/кг для первичного в КР нет; молодым полная доза по массе тела; пожилым и с ССЗ начинать с малых. После удаления или повреждения ЩЖ полная доза сразу\"><span>Старт при первичном гипотиреозе<\/span><\/label><\/td><td>Полная или неполная заместительная доза с постепенным повышением до целевого ТТГ; числового мкг/кг для первичного в КР нет; молодым полная доза по массе тела; пожилым и с ССЗ начинать с малых. После удаления или повреждения ЩЖ полная доза сразу<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Вторичный гипотиреоз — До 60 лет 1,21-1,6 мкг/кг/сут; старше 60 лет или с ССЗ 1,0-1,2 мкг/кг/сут. Перед стартом исключить надпочечниковую недостаточность (если не исключена, сначала глюкокортикоиды). Контроль по свТ4 (верхняя половина нормы)\"><span>Вторичный гипотиреоз<\/span><\/label><\/td><td>До 60 лет 1,21-1,6 мкг/кг/сут; старше 60 лет или с ССЗ 1,0-1,2 мкг/кг/сут. Перед стартом исключить надпочечниковую недостаточность (если не исключена, сначала глюкокортикоиды). Контроль по свТ4 (верхняя половина нормы)<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Контроль ТТГ — Через 6-8 недель после каждого изменения дозы и смены препарата; при нормальном ТТГ не реже 1 раза в год. Старше 70-80 лет целевой ТТГ 4-6 мЕд/л (комментарий без РКИ)\"><span>Контроль ТТГ<\/span><\/label><\/td><td>Через 6-8 недель после каждого изменения дозы и смены препарата; при нормальном ТТГ не реже 1 раза в год. Старше 70-80 лет целевой ТТГ 4-6 мЕд/л (комментарий без РКИ)<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Как принимать — Утром натощак за 30-60 минут до еды; интервал около 4 часов с кальция карбонатом и железа сульфатом; раствор можно непосредственно перед завтраком. Контроль ТТГ при приёме эстрогенов, андрогенов, фенобарбитала, фенитоина, карбамазепина, рифампицина, сертралина\"><span>Как принимать<\/span><\/label><\/td><td>Утром натощак за 30-60 минут до еды; интервал около 4 часов с кальция карбонатом и железа сульфатом; раствор можно непосредственно перед завтраком. Контроль ТТГ при приёме эстрогенов, андрогенов, фенобарбитала, фенитоина, карбамазепина, рифампицина, сертралина<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Субклинический гипотиреоз — Лечить при ТТГ более 10 мЕд/л или при двукратном ТТГ 4-10; старше 55 лет или ССЗ: при хорошей переносимости. Перед решением повторить ТТГ и свТ4 через 2-3 месяца, определить АТ-ТПО\"><span>Субклинический гипотиреоз<\/span><\/label><\/td><td>Лечить при ТТГ более 10 мЕд/л или при двукратном ТТГ 4-10; старше 55 лет или ССЗ: при хорошей переносимости. Перед решением повторить ТТГ и свТ4 через 2-3 месяца, определить АТ-ТПО<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Беременность — Увеличить дозу на 20-30% сразу после наступления беременности; ТТГ примерно каждые 4 недели до середины беременности и около 30 недели; после родов вернуть прежнюю дозу, ТТГ через 6 недель. Субклинический при АТ-ТПО(+) и ТТГ 4-10 лечить\"><span>Беременность<\/span><\/label><\/td><td>Увеличить дозу на 20-30% сразу после наступления беременности; ТТГ примерно каждые 4 недели до середины беременности и около 30 недели; после родов вернуть прежнюю дозу, ТТГ через 6 недель. Субклинический при АТ-ТПО(+) и ТТГ 4-10 лечить<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Направление — Явное направление в КР: нарушение функции ЩЖ, не поддающееся коррекции амбулаторно (плановая госпитализация)\"><span>Направление<\/span><\/label><\/td><td>Явное направление в КР: нарушение функции ЩЖ, не поддающееся коррекции амбулаторно (плановая госпитализация)<\/td><\/tr><\/tbody><\/table><\/div>", "s": "Консервативное лечение: Левотироксин натрия Пациентам молодого и среднего возраста, в случаях послеоперационного гипотиреоза или после краткосрочной отмены терапии - 1,21-1,6 мкг/кг/сутки Пациентам старшего возраста (старше 65-70 лет) и пациентам с сопутствующей кардиальной патологией терапию начинают с низких доз 12,5-25 мкг/сутки Женщинам с гипотиреозом при наступлении беременности увеличивается доза препарата на 20–30% При гипотиреозе, диагностированном во время беременности - 2,3 мкг/кг/сутки В документе даны группы препаратов и только часть доз; полные схемы смотрите ниже. 5а. Схемы и дозы по самой КР (прочитано мной по тексту КР): КР «Гипотиреоз» 2024 (взрослые, ID 531, РАЭ) Что Доза, схема, срок Старт при первичном гипотиреозе Полная или неполная заместительная доза с постепенным повышением до целевого ТТГ; числового мкг/кг для первичного в КР нет; молодым полная доза по массе тела; пожилым и с ССЗ начинать с малых. После удаления или повреждения ЩЖ полная доза сразу Вторичный гипотиреоз До 60 лет 1,21-1,6 мкг/кг/сут; старше 60 лет или с ССЗ 1,0-1,2 мкг/кг/сут. Перед стартом исключить надпочечниковую недостаточность (если не исключена, сначала глюкокортикоиды). Контроль по свТ4 (верхняя половина нормы) Контроль ТТГ Через 6-8 недель после каждого изменения дозы и смены препарата; при нормальном ТТГ не реже 1 раза в год. Старше 70-80 лет целевой ТТГ 4-6 мЕд/л (комментарий без РКИ) Как принимать Утром натощак за 30-60 минут до еды; интервал около 4 часов с кальция карбонатом и железа сульфатом; раствор можно непосредственно перед завтраком. Контроль ТТГ при приёме эстрогенов, андрогенов, фенобарбитала, фенитоина, карбамазепина, рифампицина, сертралина Субклинический гипотиреоз Лечить при ТТГ более 10 мЕд/л или при двукратном ТТГ 4-10; старше 55 лет или ССЗ: при хорошей переносимости. Перед решением повторить ТТГ и свТ4 через 2-3 месяца, определить АТ-ТПО Беременность Увеличить дозу на 20-30% сразу после наступления беременности; ТТГ примерно каждые 4 недели до середины беременности и около 30 недели; после родов вернуть прежнюю дозу, ТТГ через 6 недель. Субклинический при АТ-ТПО(+) и ТТГ 4-10 лечить Направление Явное направление в КР: нарушение функции ЩЖ, не поддающееся коррекции амбулаторно (плановая госпитализация)"}, {"k": "t6", "l": "Замечания", "h": "<ul><li>Справочник темы по гипотиреозу не содержит. Схема левотироксина в документе: 1,21-1,6 мкг/кг/сут молодым и среднего возраста, 12,5-25 мкг/сут старше 65-70 лет и при кардиальной патологии, +20-30% при беременности, при гипотиреозе, выявленном при беременности, 2,3 мкг/кг/сут.<\/li><li>Сверка с КР «Гипотиреоз» 2024 (ID 531): в КР мкг/кг приведены только для вторичного гипотиреоза (до 60 лет 1,21-1,6; старше 60 лет или при ССЗ 1,0-1,2). Для первичного: полная заместительная доза по массе тела молодым и среднего возраста, пожилым и при сердечной патологии малые дозы с титрованием; числового значения нет. Остальное (ТТГ через 6-8 недель, +20-30% при беременности) совпадает. Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам.<\/li><\/ul>", "s": "Справочник темы по гипотиреозу не содержит. Схема левотироксина в документе: 1,21-1,6 мкг/кг/сут молодым и среднего возраста, 12,5-25 мкг/сут старше 65-70 лет и при кардиальной патологии, +20-30% при беременности, при гипотиреозе, выявленном при беременности, 2,3 мкг/кг/сут. Сверка с КР «Гипотиреоз» 2024 (ID 531): в КР мкг/кг приведены только для вторичного гипотиреоза (до 60 лет 1,21-1,6; старше 60 лет или при ССЗ 1,0-1,2). Для первичного: полная заместительная доза по массе тела молодым и среднего возраста, пожилым и при сердечной патологии малые дозы с титрованием; числового значения нет. Остальное (ТТГ через 6-8 недель, +20-30% при беременности) совпадает. Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам."}, {"k": "info", "l": "О листе", "h": "<p>Шаблон приёма, формулировки диагнозов, коды и обследование взяты из присланного вами документа (краткие КР). Источник: Клинические рекомендации «Гипотиреоз», 2024 год. Схемы лечения из вашего справочника добавлены отдельным блоком. Дата сборки: 18.11.2026.<\/p>", "s": ""}]}, {"id": "k08", "t": "ГЭРБ и хронический гастрит", "g": "c3", "kw": "B12 K21.0 K21.9 K22.1 K22.7 K29.0 K29.3 K29.4 K29.5 K29.6 K29.7 K29.9", "tabs": [{"k": "t1", "l": "Часть А. ГЭРБ", "h": "<h3>А1. Диагностический минимум<\/h3><div class=\"tw\"><table><thead><tr><th>Что<\/th><th>Комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Жалобы: изжога, регургитация, боль за грудиной; внепищеводные (хронический кашель, бронхоспазм, осиплость)\"><span>Жалобы: изжога, регургитация, боль за грудиной; внепищеводные (хронический кашель, бронхоспазм, осиплость)<\/span><\/label><\/td><td>Тревожные симптомы: дисфагия, снижение массы тела, анемия, кровавая рвота, чёрный стул: ФГДС без отсрочки<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ОАК, кал на скрытую кровь, ЭКГ\"><span>ОАК, кал на скрытую кровь, ЭКГ<\/span><\/label><\/td><td>ЭКГ нужна и для исключения ИБС при боли за грудиной<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ФГДС (с биопсией антрума на H. pylori)\"><span>ФГДС (с биопсией антрума на H. pylori)<\/span><\/label><\/td><td>Степень эзофагита по Лос-Анджелес (A-D); при рефрактерном течении и осложнениях ФГДС с биопсией для исключения пищевода Барретта<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Проба с ИПП\"><span>Проба с ИПП<\/span><\/label><\/td><td>Помогает подтвердить неэрозивную ГЭРБ; отрицательная проба говорит против ГЭРБ (функциональная изжога)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Суточная рН-импедансометрия\"><span>Суточная рН-импедансометрия<\/span><\/label><\/td><td>Если нет эффекта за 4 недели ИПП: у гастроэнтеролога<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>А2. Формулировка диагноза и код<\/h3><div class=\"tw\"><table><thead><tr><th>ГЭРБ: [неэрозивная / эрозивная, эзофагит степени A-D по Лос-Анджелес], [лёгкой / средней / тяжёлой степени], [обострение / ремиссия]. [Осложнения: пищевод Барретта, стриктура, кровотечение.] [Грыжа пищеводного отверстия диафрагмы.] [H. pylori +/-.]<\/th><th><\/th><th><\/th><\/tr><\/thead><tbody><tr><td>Код<\/td><td>Название<\/td><td>Источник<\/td><\/tr><tr><td>K21.0<\/td><td>ГЭРБ с эзофагитом<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>K21.9<\/td><td>ГЭРБ без эзофагита<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>K22.1<\/td><td>Язва пищевода<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>K22.7<\/td><td>Пищевод Барретта (в вашем справочнике кода нет, из МКБ-10)<\/td><td><span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Примеры (ваш справочник): «Неэрозивная ГЭРБ, лёгкой степени тяжести, обострение»; «Эрозивная ГЭРБ с эзофагитом степени A, средней степени тяжести. Аксиальная грыжа пищеводного отверстия диафрагмы».<\/p><h3>А3. Лечение<\/h3><p>Образ жизни <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span>: питание 3-4 раза в день, не переедать, последний приём пищи за 2 часа до сна; исключить томаты, кислые соки, жирное, шоколад, кофе, газировку, очень горячее и холодное, алкоголь; снижение массы тела; не носить тугие пояса и корсеты, не поднимать более 8-10 кг, приподнять изголовье кровати; бросить курить. Избегать препаратов, расслабляющих нижний сфинктер или повреждающих слизистую: нитраты, нифедипин, теофиллин, антидепрессанты, НПВП, доксициклин.<\/p><div class=\"tw\"><table><thead><tr><th>Форма<\/th><th>Схема (стандартные дозы ИПП: эзомепразол 20-40 мг, омепразол 20 мг, пантопразол 40 м span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Подготовка к тесту\"><span>Подготовка к тесту<\/span><\/label><\/td><td>ИПП отменить за 2 недели, антибиотики и препараты висмута за 4 недели<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ОАК, железо, ферритин, витамин B12\"><span>ОАК, железо, ферритин, витамин B12<\/span><\/label><\/td><td>Для исключения анемии, при подозрении на аутоиммунный гастрит<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Кал на скрытую кровь, УЗИ органов брюшной полости\"><span>Кал на скрытую кровь, УЗИ органов брюшной полости<\/span><\/label><\/td><td>По справочнику<\/td><td><span class=\"lb lb-sp\">СПР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Антитела к париетальным клеткам, пепсиногены, гастрин-17\"><span>Антитела к париетальным клеткам, пепсиногены, гастрин-17<\/span><\/label><\/td><td>По показаниям: аутоиммунный гастрит, предраковые изменения<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Б2. Диагноз и код<\/p><p>Хронический гастрит [неатрофический / атрофический / аутоиммунный / химический], [антральный / фундальный / пангастрит], [H. pylori-ассоциированный (+/-)], [активность], [эрозивный], [фаза обострения]. [В12-дефицитная анемия.]<\/p><p>Коды: K29.3 хронический поверхностный; K29.4 хронический атрофический; K29.5 хронический неуточнённый; K29.6 другие; K29.7 гастрит неуточнённый (КР: подрубрики K29.0-K29.9). <span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span> Примеры (справочник): «Хронический неатрофический антральный гастрит умеренной активности, ассоциированный с H. pylori»; «Хронический химический антральный эрозивный гастрит, ассоциированный с НПВС».<\/p><p>Б3. Эрадикация H. pylori (14 дней) по КР 2024 Показана всем с хроническим гастритом и положительным тестом, при атрофическом гастрите (чтобы остановить атрофию). ИПП везде в стандартной дозе 2 раза в сутки (эзомепразол 20 мг, омепразол 20 мг, рабепразол 20 мг, пантопразол 40 мг).<\/p><div class=\"tw\"><table><thead><tr><th>Линия<\/th><th>Схема<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"1-я, вариант 1 — ИПП 2 р/д + кларитромицин 500 мг 2 р/д + амоксициллин 1000 мг 2 р/д + висмута трикалия дицитрат 240 мг 2 р/д (или 120 мг 4 р/д)\"><span>1-я, вариант 1<\/span><\/label><\/td><td>ИПП 2 р/д + кларитромицин 500 мг 2 р/д + амоксициллин 1000 мг 2 р/д + висмута трикалия дицитрат 240 мг 2 р/д (или 120 мг 4 р/д)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"1-я, вариант 2 — Классическая квадротерапия: висмута трикалия дицитрат 120 мг 4 р/д + ИПП 2 р/д + тетрациклин 500 мг 4 р/д + метронидазол 500 мг 3 р/д\"><span>1-я, вариант 2<\/span><\/label><\/td><td>Классическая квадротерапия: висмута трикалия дицитрат 120 мг 4 р/д + ИПП 2 р/д + тетрациклин 500 мг 4 р/д + метронидазол 500 мг 3 р/д<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"1-я, вариант 3 — Без висмута (сочетанная): ИПП 2 р/д + амоксициллин 1000 мг 2 р/д + кларитромицин 500 мг 2 р/д + метронидазол 500 мг 3 р/д\"><span>1-я, вариант 3<\/span><\/label><\/td><td>Без висмута (сочетанная): ИПП 2 р/д + амоксициллин 1000 мг 2 р/д + кларитромицин 500 мг 2 р/д + метронидазол 500 мг 3 р/д<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"1-я, допустимо — Стандартная тройная (ИПП + кларитромицин + амоксициллин) 14 дней только в регионах, где подтверждена й тест или антиген в кале (ИПП отменить за 2 недели, антибиотики и висмут за 4 недели). Серологию для контроля не использовать\"><span>Контроль<\/span><\/label><\/td><td>Не раньше чем через 4 недели после курса: дыхательный тест или антиген в кале (ИПП отменить за 2 недели, антибиотики и висмут за 4 недели). Серологию для контроля не использовать<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Б4. Симптоматическое лечение<\/p><div class=\"tw\"><table><thead><tr><th>Препарат<\/th><th>Доза и курс<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ИПП при эрозивном гастрите и дуодените (в т. ч. от НПВП) — Один раз утром за 30 минут до завтрака 4-6 недель по КР (справочник: 2-4 недели): омепразол 20, лансопразол 30, пантопразол 40, рабепразол 20, эзомепразол 20 мг\"><span>ИПП при эрозивном гастрите и дуодените (в т. ч. от НПВП)<\/span><\/label><\/td><td>Один раз утром за 30 минут до завтрака 4-6 недель по КР (справочник: 2-4 недели): омепразол 20, лансопразол 30, пантопразол 40, рабепразол 20, эзомепразол 20 мг<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Ребамипид — 100 мг 3 раза в сутки 2-4 недели при диспепсии, при необходимости до 8 недель; для заживления эрозий 4-8 недель\"><span>Ребамипид<\/span><\/label><\/td><td>100 мг 3 раза в сутки 2-4 недели при диспепсии, при необходимости до 8 недель; для заживления эрозий 4-8 недель<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Висмута трикалия дицитрат (монотерапия при H. pylori-) — 240 мг 2 раза в день (или 120 мг 4 раза) 4-8 недель\"><span>Висмута трикалия дицитрат (монотерапия при H. pylori-)<\/span><\/label><\/td><td>240 мг 2 раза в день (или 120 мг 4 раза) 4-8 недель<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Прокинетики при диспепсии — КР: акотиамид, итоприд, тримебутин, домперидон (риск удлинения QT). Справочник: итоприд (Иторид) 50 мг 3 раза до еды 4-8 недель; Тримедат 200 мг 3 раза 14 дней\"><span>Прокинетики при диспепсии<\/span><\/label><\/td><td>КР: акотиамид, итоприд, тримебутин, домперидон (риск удлинения QT). Справочник: итоприд (Иторид) 50 мг 3 раза до еды 4-8 недель; Тримедат 200 мг 3 раза 14 дней<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Антациды — Справочник: Алмагель/Фосфалюгель/Маалокс на 2 недели. В КР по гастриту антациды не упоминаются\"><span>Антациды<\/span><\/label><\/td><td>Справочник: Алмагель/Фосфалюгель/Маалокс на 2 недели. В КР по гастриту антациды не упоминаются<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>Б5. Наблюдение<\/h3><ul><li>Выраженный атрофический гастрит (OLGA/OLGIM III-IV): ФГДС каждые 3 года; при раке желудка у родственников 1 раз в 1-2 года. Слабая-умеренная атрофия только в антруме после эрадикации: наблюдение не нужно. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Кишечная метаплазия: обычно без наблюдения; при отягощённой наследственности, неполной метаплазии или сохранении H. pylori ФГДС с хромоэндоскопией 1 раз в 3 года. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Аутоиммунный гастрит: ФГДС 1 раз в 1-2 года (в комментариях КР: 1 раз в 3 года), контроль B12 и гемоглобина. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Гастроэнтеролог по приказу 173н 1 раз в год при хроническом атрофическом фундальном и мультифокальном гастрите (по тексту КР). Визит терапевта через 6 месяцев: симптомы, приём ИПП, тревожные признаки, результат контроля H. pylori. <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul><h3>В. Что я нашла в справочнике и проверила<\/h3><ul><li>Совпадает с КР: классическая квадротерапия (висмут 120 ×4, ИПП ×2, тетрациклин 500 ×4, метронидазол 500 ×3) в «лечении» (l301) и «Шаблонах»; кларитромицин 500 ×2 и амоксициллин 1000 ×2; контроль не раньше 4 недель; правила отмены ИПП и антибиотиков; ребамипид 100 ×3; эрозивная ГЭРБ A-B 4 недели.<\/li><li>Расхождения: (1) в «лечении» (l301) стандартная тройная без висмута названа схемой первой линии, а по КР 2024 основной вариант с висмутом или классическая квадротерапия; (2) в «Быстро» (Гастрит HP+, l314) тетрациклин 500 мг 3 раза, по КР 4 раза; пантопразол 40 мг и эзомепразол 40 мг 1 раз в день в эрадикации, по КР ИПП 2 раза в сутки; (3) в «Назначениях» (b14) вторая линия с левофлоксацином, по КР левофлоксацин третья линия; (4) контроль «ФГДС через 1 мес» (l301), по КР контроль тестом (дыхательный или антиген), не ФГДС; (5) эзофагит C-D: КР не менее 8 недель, в справочнике «8-2 недель» (опечатка).<\/li><li>Не из КР: Максилак, Линекс Форте, Энтерол как пробиотики (в КР только штаммоспецифичные, например S. boulardii); Фосфалюгель/Алмагель при гастрите; Гептрал, Урсофальк, Аллохол при ГЭРБ (в КР по ГЭРБ не упоминаются); ранитидин в списке Н2-блокаторов (проверьте наличие в аптеках, КР по ГЭРБ его не называет, Н2-блокаторы не первая линия).<\/li><li>Несоответствие внутри справочника: в «лечении» (l301) антациды при ГЭРБ: Фосфалюгель 2 недели, Маалокс 4 недели; КР срок не называет. Как проверено: КР по гастриту 2024 прочитана на pravo.ppt.ru (первые 100 тыс. знаков из 168 тыс.). КР по ГЭРБ: текст РГА без указания года, действующую взрослую КР Минздрава по ГЭРБ с датой я не нашла, поэтому сверьте сроки и дозы с рубрикатором (cr.minzdrav.gov.ru) и инструкциями препаратов. Все сведения из КР получены автоматическим чтением текста.<\/li><\/ul>", "s": "Б1. Диагностический минимум Что Комментарий Источник ФГДС с биопсией КР: минимум 2 биоптата из тела и 2 из антрального отдела (по малой и большой кривизне), из каждого патологического участка отдельно. ЭКГ перед ФГДС: старше 45 лет или на учёте у кардиолога (практика) КР ЛЕЧ Диагностика H. pylori Лучшие: дыхательный уреазный тест, антиген в кале. При ФГДС: быстрый уреазный тест или гистология. Серология IgG допустима как первичный метод (например, при недавнем приёме ИПП/антибиотиков, атрофическом гастрите), но не для контроля эрадикации КР СПР Подготовка к тесту ИПП отменить за 2 недели, антибиотики и препараты висмута за 4 недели КР СПР ОАК, железо, ферритин, витамин B12 Для исключения анемии, при подозрении на аутоиммунный гастрит КР СПР Кал на скрытую кровь, УЗИ органов брюшной полости По справочнику СПР ЛЕЧ Антитела к париетальным клеткам, пепсиногены, гастрин-17 По показаниям: аутоиммунный гастрит, предраковые изменения КР Б2. Диагноз и код Хронический гастрит [неатрофический / атрофический / аутоиммунный / химический], [антральный / фундальный / пангастрит], [H. pylori-ассоциированный (+/-)], [активность], [эрозивный], [фаза обострения]. [В12-дефицитная анемия.] Коды: K29.3 хронический поверхностный; K29.4 хронический атрофический; K29.5 хронический неуточнённый; K29.6 другие; K29.7 гастрит неуточнённый (КР: подрубрики K29.0-K29.9). ЛЕЧ КР Примеры (справочник): «Хронический неатрофический антральный гастрит умеренной активности, ассоциированный с H. pylori»; «Хронический химический антральный эрозивный гастрит, ассоциированный с НПВС». Б3. Эрадикация H. pylori (14 дней) по КР 2024 Показана всем с хроническим гастритом и положительным тестом, при атрофическом гастрите (чтобы остановить атрофию). ИПП везде в стандартной дозе 2 раза в сутки (эзомепразол 20 мг, омепразол 20 мг, рабепразол 20 мг, пантопразол 40 мг). Линия Схема Источник 1-я, вариант 1 ИПП 2 р/д + кларитромицин 500 мг 2 р/д + амоксициллин 1000 мг 2 р/д + висмута трикалия дицитрат 240 мг 2 р/д (или 120 мг 4 р/д) КР 1-я, вариант 2 Классическая квадротерапия: висмута трикалия дицитрат 120 мг 4 р/д + ИПП 2 р/д + тетрациклин 500 мг 4 р/д + метронидазол 500 мг 3 р/д КР ЛЕЧ СПР 1-я, вариант 3 Без висмута (сочетанная): ИПП 2 р/д + амоксициллин 1000 мг 2 р/д + кларитромицин 500 мг 2 р/д + метронидазол 500 мг 3 р/д КР 1-я, допустимо Стандартная тройная (ИПП + кларитромицин + амоксициллин) 14 дней только в регионах, где подтверждена эффективность КР ЛЕЧ 2-я Классическая квадротерапия с висмутом (как выше), если не помогла схема с висмутом/сочетанная КР 3-я Левофлоксацин 500 мг 2 р/д + амоксициллин 1000 мг 2 р/д + ИПП 2 р/д (± висмут 120 мг 4 р/д), 14 дней; лучше по чувствительности КР ЛЕЧ Повышают эффективность Ребамипид 100 мг 3 р/д в схеме; удвоенная доза ИПП; письменная инструкция пациенту (при приёме менее 60-80% препаратов эффективность падает); штаммоспецифичные пробиотики (S. boulardii 500-750 мг/сут) против диареи КР ЛЕЧ Линия Схема Источник Контроль Не раньше чем через 4 недели после курса: дыхательный тест или антиген в кале (ИПП отменить за 2 недели, антибиотики и висмут за 4 недели). Серологию для контроля не использовать КР ЛЕЧ Б4. Симптоматическое лечение Препарат Доза и курс Источник ИПП при эрозивном гастрите и дуодените (в т. ч. от НПВП) Один раз утром за 30 минут до завтрака 4-6 недель по КР (справочник: 2-4 недели): омепразол 20, лансопразол 30, пантопразол 40, рабепразол 20, эзомепразол 20 мг КР СПР Ребамипид 100 мг 3 раза в сутки 2-4 недели при диспепсии, при необходимости до 8 недель; для заживления эрозий 4-8 недель КР СПР Висмута трикалия дицитрат (монотерапия при H. pylori-) 240 мг 2 раза в день (или 120 мг 4 раза) 4-8 недель КР СПР Прокинетики при диспепсии КР: акотиамид, итоприд, тримебутин, домперидон (риск удлинения QT). Справочник: итоприд (Иторид) 50 мг 3 раза до еды 4-8 недель; Тримедат 200 мг 3 раза 14 дней КР ЛЕЧ СПР Антациды Справочник: Алмагель/Фосфалюгель/Маалокс на 2 недели. В КР по гастриту антациды не упоминаются ЛЕЧ СПР Б5. Наблюдение Выраженный атрофический гастрит (OLGA/OLGIM III-IV): ФГДС каждые 3 года; при раке желудка у родственников 1 раз в 1-2 года. Слабая-умеренная атрофия только в антруме после эрадикации: наблюдение не нужно. КР Кишечная метаплазия: обычно без наблюдения; при отягощённой наследственности, неполной метаплазии или сохранении H. pylori ФГДС с хромоэндоскопией 1 раз в 3 года. КР Аутоиммунный гастрит: ФГДС 1 раз в 1-2 года (в комментариях КР: 1 раз в 3 года), контроль B12 и гемоглобина. КР Гастроэнтеролог по приказу 173н 1 раз в год при хроническом атрофическом фундальном и мультифокальном гастрите (по тексту КР). Визит терапевта через 6 месяцев: симптомы, приём ИПП, тревожные признаки, результат контроля H. pylori. КР В. Что я нашла в справочнике и проверила Совпадает с КР: классическая квадротерапия (висмут 120 ×4, ИПП ×2, тетрациклин 500 ×4, метронидазол 500 ×3) в «лечении» (l301) и «Шаблонах»; кларитромицин 500 ×2 и амоксициллин 1000 ×2; контроль не раньше 4 недель; правила отмены ИПП и антибиотиков; ребамипид 100 ×3; эрозивная ГЭРБ A-B 4 недели. Расхождения: (1) в «лечении» (l301) стандартная тройная без висмута названа схемой первой линии, а по КР 2024 основной вариант с висмутом или классическая квадротерапия; (2) в «Быстро» (Гастрит HP+, l314) тетрациклин 500 мг 3 раза, по КР 4 раза; пантопразол 40 мг и эзомепразол 40 мг 1 раз в день в эрадикации, по КР ИПП 2 раза в сутки; (3) в «Назначениях» (b14) вторая линия с левофлоксацином, по КР левофлоксацин третья линия; (4) контроль «ФГДС через 1 мес» (l301), по КР контроль тестом (дыхательный или антиген), не ФГДС; (5) эзофагит C-D: КР не менее 8 недель, в справочнике «8-2 недель» (опечатка). Не из КР: Максилак, Линекс Форте, Энтерол как пробиотики (в КР только штаммоспецифичные, например S. boulardii); Фосфалюгель/Алмагель при гастрите; Гептрал, Урсофальк, Аллохол при ГЭРБ (в КР по ГЭРБ не упоминаются); ранитидин в списке Н2-блокаторов (проверьте наличие в аптеках, КР по ГЭРБ его не называет, Н2-блокаторы не первая линия). Несоответствие внутри справочника: в «лечении» (l301) антациды при ГЭРБ: Фосфалюгель 2 недели, Маалокс 4 недели; КР срок не называет. Как проверено: КР по гастриту 2024 прочитана на pravo.ppt.ru (первые 100 тыс. знаков из 168 тыс.). КР по ГЭРБ: текст РГА без указания года, действующую взрослую КР Минздрава по ГЭРБ с датой я не нашла, поэтому сверьте сроки и дозы с рубрикатором (cr.minzdrav.gov.ru) и инструкциями препаратов. Все сведения из КР получены автоматическим чтением текста."}, {"k": "info", "l": "О листе", "h": "<p>Собрано из вашего справочника («лечение.docx» ЖКТ, затем «Шаблоны», «Алгоритмы», «Назначения», «Быстро») и сверено: гастрит - КР «Гастрит и дуоденит» 2024 (взрослые, одобрены Минздравом, пересмотр не позднее 2026); ГЭРБ - КР Российской гастроэнтерологической ассоциации по ГЭРБ у взрослых (год редакции в прочитанном тексте не указан; найденные мной КР Минздрава по ГЭРБ 2025 года детские). Дата сборки: 16.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k09", "t": "Железодефицитная анемия", "g": "c7", "kw": "железодефицитная анемия ферритин железо B12 D50.0 D50.8 D50.9 D51 D52 E61.1 O99.0", "tabs": [{"k": "t1", "l": "Диагностический минимум", "h": "<div class=\"tw\"><table><thead><tr><th>Что сделать<\/th><th>Комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ОАК с ретикулоцитами и индексами (MCV, MCH, MCHC, RDW)\"><span>ОАК с ретикулоцитами и индексами (MCV, MCH, MCHC, RDW)<\/span><\/label><\/td><td>Начало обследования. MCV &lt; 80: микроцитарная; 80-100 нормоцитарная; &gt; 100 макроцитарная. Ретикулоциты норма или снижены: не хватает железа, B12, фолата; повышены: ищем кровопотерю или гемолиз<\/td><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Ферритин\"><span>Ферритин<\/span><\/label><\/td><td>Главный анализ: низкий ферритин подтверждает дефицит железа. Нормальный или высокий при анемии и воспалении: анемия хронических заболеваний. По «Практикам» достаточно ферритина, весь набор «железо, ОЖСС, трансферрин» сразу не нужен<\/td><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Сывороточное железо, трансферрин, ОЖСС, насыщение трансферрина\"><span>Сывороточное железо, трансферрин, ОЖСС, насыщение трансферрина<\/span><\/label><\/td><td>КР: при ЖДА железо и насыщение снижены, ОЖСС и трансферрин повышены (норма насыщения 17,8-43,3%). Нормальные значения не исключают ЖДА при приёме железа накануне. Ваш раздел l701 берёт весь набор<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"B12 и фолиевая кислота\"><span>B12 и фолиевая кислота<\/span><\/label><\/td><td>Только при MCV &gt; 100<\/td><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Гемолиз: ЛДГ, билирубин, гаптоглобин, мазок\"><span>Гемолиз: ЛДГ, билирубин, гаптоглобин, мазок<\/span><\/label><\/td><td>При подозрении на гемолиз (ретикулоциты повышены без кровопотери)<\/td><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Биохимия: общий белок, альбумин, билирубин, АЛТ, АСТ, креатинин, мочевина, ЩФ, ГГТ; ОАМ\"><span>Биохимия: общий белок, альбумин, билирубин, АЛТ, АСТ, креатинин, мочевина, ЩФ, ГГТ; ОАМ<\/span><\/label><\/td><td>По КР и l701; ОАМ для исключения гематурии<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Поиск причины: ЭГДС, колоноскопия\"><span>Поиск причины: ЭГДС, колоноскопия<\/span><\/label><\/td><td>Мужчины, женщины после менопаузы и женщины детородного возраста, если ЖДА не объясняется менструациями или родами: последовательно ЭГДС и колоноскопия, при неясности энтероскопия (КТ-колонография или капсула при недоступности колоноскопии)<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"УЗИ ОБП, малого таза, щитовидной железы; Rg ОГК; ЭКГ\"><span>УЗИ ОБП, малого таза, щитовидной железы; Rg ОГК; ЭКГ<\/span><\/label><\/td><td>По КР и l701 «при установленном диагнозе»; УЗИ малого таза для гинекологической причины<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Кал на скрытую кровь\"><span>Кал на скрытую кровь<\/span><\/label><\/td><td>В КР не упомянут в прочитанной части<\/td><td><span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Проверить: пороги Hb для взрослых небеременных (обычно по ВОЗ: женщины &lt; 120 г/л, мужчины &lt; 130 г/л) в прочитанном мной тексте КР не приведены; беременные: &lt; 110 г/л в I и III триместрах, &lt; 105 во II.<\/p>", "s": "Что сделать Комментарий Источник ОАК с ретикулоцитами и индексами (MCV, MCH, MCHC, RDW) Начало обследования. MCV 100 макроцитарная. Ретикулоциты норма или снижены: не хватает железа, B12, фолата; повышены: ищем кровопотерю или гемолиз ПРАКТИКА КР Ферритин Главный анализ: низкий ферритин подтверждает дефицит железа. Нормальный или высокий при анемии и воспалении: анемия хронических заболеваний. По «Практикам» достаточно ферритина, весь набор «железо, ОЖСС, трансферрин» сразу не нужен ПРАКТИКА КР Сывороточное железо, трансферрин, ОЖСС, насыщение трансферрина КР: при ЖДА железо и насыщение снижены, ОЖСС и трансферрин повышены (норма насыщения 17,8-43,3%). Нормальные значения не исключают ЖДА при приёме железа накануне. Ваш раздел l701 берёт весь набор КР ЛЕЧ B12 и фолиевая кислота Только при MCV > 100 ПРАКТИКА ЛЕЧ Гемолиз: ЛДГ, билирубин, гаптоглобин, мазок При подозрении на гемолиз (ретикулоциты повышены без кровопотери) ПРАКТИКА Биохимия: общий белок, альбумин, билирубин, АЛТ, АСТ, креатинин, мочевина, ЩФ, ГГТ; ОАМ По КР и l701; ОАМ для исключения гематурии КР ЛЕЧ Поиск причины: ЭГДС, колоноскопия Мужчины, женщины после менопаузы и женщины детородного возраста, если ЖДА не объясняется менструациями или родами: последовательно ЭГДС и колоноскопия, при неясности энтероскопия (КТ-колонография или капсула при недоступности колоноскопии) КР ЛЕЧ УЗИ ОБП, малого таза, щитовидной железы; Rg ОГК; ЭКГ По КР и l701 «при установленном диагнозе»; УЗИ малого таза для гинекологической причины КР ЛЕЧ Кал на скрытую кровь В КР не упомянут в прочитанной части СПР Проверить: пороги Hb для взрослых небеременных (обычно по ВОЗ: женщины"}, {"k": "t2", "l": "Формулировка диагноза и код", "h": "<div class=\"tw\"><table><thead><tr><th>Железодефицитная анемия [лёгкой / средней / тяжёлой степени] [хроническая], вследствие [хронической кровопотери из ЖКТ / меноррагий / недостаточного поступления / нарушения всасывания]. [Hb ___ г/л, ферритин ___ нг/мл.] [Сочетание с анемией хронических заболеваний.]<\/th><th><\/th><th><\/th><\/tr><\/thead><tbody><tr><td>Код<\/td><td>Название<\/td><td>Источник<\/td><\/tr><tr><td>D50.0<\/td><td>ЖДА вторичная вследствие хронической кровопотери<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td>D50.8 / D50.9<\/td><td>Другие ЖДА / ЖДА неуточнённая<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td>E61.1<\/td><td>Латентный дефицит железа (анемии нет)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>D51 / D52<\/td><td>B12-дефицитная / фолиеводефицитная анемия<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>O99.0<\/td><td>Анемия при беременности и родах<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Примеры (ваш справочник): «Железодефицитная анемия III степени вследствие хронических кровопотерь из ЖКТ»; «Хроническая железодефицитная анемия вследствие меноррагий, средней тяжести»; «ЖДА, ассоциированная с анемией хронических заболеваний».<\/p>", "s": "Железодефицитная анемия [лёгкой / средней / тяжёлой степени] [хроническая], вследствие [хронической кровопотери из ЖКТ / меноррагий / недостаточного поступления / нарушения всасывания]. [Hb ___ г/л, ферритин ___ нг/мл.] [Сочетание с анемией хронических заболеваний.] Код Название Источник D50.0 ЖДА вторичная вследствие хронической кровопотери КР СПР D50.8 / D50.9 Другие ЖДА / ЖДА неуточнённая КР СПР E61.1 Латентный дефицит железа (анемии нет) КР D51 / D52 B12-дефицитная / фолиеводефицитная анемия ЛЕЧ O99.0 Анемия при беременности и родах КР Примеры (ваш справочник): «Железодефицитная анемия III степени вследствие хронических кровопотерь из ЖКТ»; «Хроническая железодефицитная анемия вследствие меноррагий, средней тяжести»; «ЖДА, ассоциированная с анемией хронических заболеваний»."}, {"k": "t3", "l": "Лечение", "h": "<h3>Принципы по КР<\/h3><ul><li>Устранить причину кровопотери или дефицита. Рецидивы чаще связаны с неустранённой причиной. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Доза при ЖДА: 120 мг элементарного железа в сутки (профилактика 60 мг). Выше 120 мг в сутки чаще побочные эффекты ЖКТ. Допустимы короткие курсы (2 недели в месяц) или приём через день. Длительность лечения 1-3 месяца, запасы восстанавливаются через 3-6 месяцев (контроль по ферритину). <span class=\"lb lb-kr\">КР<\/span><\/li><li>Цель: Hb у женщин 120-140 г/л, у мужчин 130-160 г/л; ферритин &gt; 40-60 нг/мл. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Диета в КР как лечение «не применяется»: мясо и продукты с витамином С упомянуты в профилактике. В справочнике диета с красным мясом, печенью, гречкой и витамином С. <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/li><\/ul><h3>Пероральные препараты по вашему справочнику<\/h3><div class=\"tw\"><table><thead><tr><th>Препарат<\/th><th>Схема в справочнике<\/th><th>Комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Сорбифер Дурулес — 1 таб. 2 раза в день во время еды (можно до 2 таб. 2 раза) 3-6 месяцев (l701)\"><span>Сорбифер Дурулес<\/span><\/label><\/td><td>1 таб. 2 раза в день во время еды (можно до 2 таб. 2 раза) 3-6 месяцев (l701)<\/td><td>В таблетке по инструкции 100 мг железа: 2 таб. = 200 мг, 4 таб. = 400 мг, это выше 120 мг/сут КР. Сверьте с инструкцией<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Мальтофер / Феррум Лек — 100-300 мг (1-3 таб.) в сутки 3-5 месяцев, затем 100 мг 2 месяца (l701); в «Быстро» 1 таб. 2 раза 3 месяца\"><span>Мальтофер / Феррум Лек<\/span><\/label><\/td><td>100-300 мг (1-3 таб.) в сутки 3-5 месяцев, затем 100 мг 2 месяца (l701); в «Быстро» 1 таб. 2 раза 3 месяца<\/td><td>Таблетка 100 мг железа: 300 мг в сутки выше дозы КР<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Ферромальт (капли) — 40-120 капель 1 раз в день 3-5 месяцев, затем 20-40 капель 2 месяца (l701)\"><span>Ферромальт (капли)<\/span><\/label><\/td><td>40-120 капель 1 раз в день 3-5 месяцев, затем 20-40 капель 2 месяца (l701)<\/td><td>Содержание железа в капле по инструкции<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Сидерал форте — 1 капсула 1 раз в день, при тяжёлой степени 2 капсулы, 3 месяца\"><span>Сидерал форте<\/span><\/label><\/td><td>1 капсула 1 раз в день, при тяжёлой степени 2 капсулы, 3 месяца<\/td><td>Доза по инструкции<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Тотема — 50 мг 2 раза в день 20 дней, затем Сорбифер Дурулес 1 таб. 2 раза (при латентном дефиците 1 раз)\"><span>Тотема<\/span><\/label><\/td><td>50 мг 2 раза в день 20 дней, затем Сорбифер Дурулес 1 таб. 2 раза (при латентном дефиците 1 раз)<\/td><td>Ампула содержит 50 мг железа<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Бисакодил, метоклопрамид — Бисакодил 1-2 таб. до 10-14 дней при запоре; метоклопрамид 10 мг до 3 раз 3-4 дня при рвоте\"><span>Бисакодил, метоклопрамид<\/span><\/label><\/td><td>Бисакодил 1-2 таб. до 10-14 дней при запоре; метоклопрамид 10 мг до 3 раз 3-4 дня при рвоте<\/td><td>В КР не упоминаются<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>Внутривенное железо<\/h3><ul><li>Показания по КР: Hb &lt; 70 г/л; продолжающаяся кровопотеря; непереносимость, неэффективность или противопоказания к препаратам внутрь; нарушенное всасывание (резекция кишечника, воспалительные заболевания кишечника, мальабсорбция); ХБП, ХСН; нужен быстрый эффект; подготовка к операции (менее 6 недель); Hb вырос менее чем на 10 г/л через 4 недели приёма внутрь; беременность II-III триместр при средней и тяжёлой анемии. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Противопоказания: анемии не из-за дефицита железа, анафилаксия в анамнезе, I триместр, активная инфекция, хроническая болезнь печени. Внутривенное и пероральное железо одновременно не назначают; внутримышечное железо не применяют. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Справочник: Феринжект 2 мл №5 с 100 мл физраствора 2 раза в неделю капельно; Ликферр 5 мл капельно медленно однократно. Дозы по инструкции (в КР доз нет). <span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/li><li>Переливание эритроцитов: по индивидуальным показаниям при тяжёлой анемии и сердечно-сосудистой патологии с риском декомпенсации; беременным при Hb &lt; 70 г/л или выраженных симптомах. <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul>", "s": "Принципы по КР Устранить причину кровопотери или дефицита. Рецидивы чаще связаны с неустранённой причиной. КР Доза при ЖДА: 120 мг элементарного железа в сутки (профилактика 60 мг). Выше 120 мг в сутки чаще побочные эффекты ЖКТ. Допустимы короткие курсы (2 недели в месяц) или приём через день. Длительность лечения 1-3 месяца, запасы восстанавливаются через 3-6 месяцев (контроль по ферритину). КР Цель: Hb у женщин 120-140 г/л, у мужчин 130-160 г/л; ферритин > 40-60 нг/мл. КР Диета в КР как лечение «не применяется»: мясо и продукты с витамином С упомянуты в профилактике. В справочнике диета с красным мясом, печенью, гречкой и витамином С. КР ЛЕЧ Пероральные препараты по вашему справочнику Препарат Схема в справочнике Комментарий Источник Сорбифер Дурулес 1 таб. 2 раза в день во время еды (можно до 2 таб. 2 раза) 3-6 месяцев (l701) В таблетке по инструкции 100 мг железа: 2 таб. = 200 мг, 4 таб. = 400 мг, это выше 120 мг/сут КР. Сверьте с инструкцией ЛЕЧ КР Мальтофер / Феррум Лек 100-300 мг (1-3 таб.) в сутки 3-5 месяцев, затем 100 мг 2 месяца (l701); в «Быстро» 1 таб. 2 раза 3 месяца Таблетка 100 мг железа: 300 мг в сутки выше дозы КР ЛЕЧ КР Ферромальт (капли) 40-120 капель 1 раз в день 3-5 месяцев, затем 20-40 капель 2 месяца (l701) Содержание железа в капле по инструкции ЛЕЧ Сидерал форте 1 капсула 1 раз в день, при тяжёлой степени 2 капсулы, 3 месяца Доза по инструкции ЛЕЧ Тотема 50 мг 2 раза в день 20 дней, затем Сорбифер Дурулес 1 таб. 2 раза (при латентном дефиците 1 раз) Ампула содержит 50 мг железа ЛЕЧ Бисакодил, метоклопрамид Бисакодил 1-2 таб. до 10-14 дней при запоре; метоклопрамид 10 мг до 3 раз 3-4 дня при рвоте В КР не упоминаются ЛЕЧ Внутривенное железо Показания по КР: Hb КР Противопоказания: анемии не из-за дефицита железа, анафилаксия в анамнезе, I триместр, активная инфекция, хроническая болезнь печени. Внутривенное и пероральное железо одновременно не назначают; внутримышечное железо не применяют. КР Справочник: Феринжект 2 мл №5 с 100 мл физраствора 2 раза в неделю капельно; Ликферр 5 мл капельно медленно однократно. Дозы по инструкции (в КР доз нет). ЛЕЧ КР Переливание эритроцитов: по индивидуальным показаниям при тяжёлой анемии и сердечно-сосудистой патологии с риском декомпенсации; беременным при Hb КР"}, {"k": "t4", "l": "Контроль и наблюдение через 6…", "h": "<div class=\"tw\"><table><thead><tr><th>Что<\/th><th>Когда<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Ретикулоциты\"><span>Ретикулоциты<\/span><\/label><\/td><td>на 7-10-й день ответ (рост на 2-3%)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Hb и гематокрит\"><span>Hb и гематокрит<\/span><\/label><\/td><td>к концу 4-й недели Hb +10 г/л и Hct +3%; если рост меньше, пересмотреть диагноз, приёмы и причину (возможен переход на внутривенное железо)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Симптомы\"><span>Симптомы<\/span><\/label><\/td><td>проходят через 1-1,5 месяца<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Ферритин\"><span>Ферритин<\/span><\/label><\/td><td>через 3-6 месяцев: цель выше 30 нг/мл (по КР 40-60 нг/мл)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Hb после курса\"><span>Hb после курса<\/span><\/label><\/td><td>ежемесячно в течение года для решения о поддерживающей терапии<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Беременные: ОАК при первом обращении, на 28-й и 34-й неделях; железо 60-100 мг в сутки, не менее 3 месяцев после нормализации Hb. <span class=\"lb lb-kr\">КР<\/span> Направление к гематологу КР не называет; госпитализация для обследования при впервые выявленной умеренной и тяжёлой ЖДА, экстренно при декомпенсации. Проверить: частоту диспансерных приёмов по 168н не подтвердила.<\/p>", "s": "Что Когда Источник Ретикулоциты на 7-10-й день ответ (рост на 2-3%) КР Hb и гематокрит к концу 4-й недели Hb +10 г/л и Hct +3%; если рост меньше, пересмотреть диагноз, приёмы и причину (возможен переход на внутривенное железо) КР Симптомы проходят через 1-1,5 месяца КР Ферритин через 3-6 месяцев: цель выше 30 нг/мл (по КР 40-60 нг/мл) КР Hb после курса ежемесячно в течение года для решения о поддерживающей терапии КР Беременные: ОАК при первом обращении, на 28-й и 34-й неделях; железо 60-100 мг в сутки, не менее 3 месяцев после нормализации Hb. КР Направление к гематологу КР не называет; госпитализация для обследования при впервые выявленной умеренной и тяжёлой ЖДА, экстренно при декомпенсации. Проверить: частоту диспансерных приёмов по 168н не подтвердила."}, {"k": "t5", "l": "Проверка", "h": "<ul><li>Совпадает с КР: поиск причины ЖКТ и гинекологической, пероральное железо первой линией, срок 3 и более месяцев, внутривенное железо при тяжёлой анемии и нарушенном всасывании, ферритин как контроль.<\/li><li>Расхождения: (1) дозы Сорбифера (до 400 мг) и Мальтофера (до 300 мг) выше рекомендованных КР 120 мг элементарного железа в сутки; (2) l701 просит весь набор показателей обмена железа, «Практики» (p02) только ферритин (КР перечисляет и сывороточное железо, и насыщение трансферрина); (3) диета: в КР как лечение не применяется; (4) Тотема 50 мг 2 раза: 100 мг железа, в пределах КР.<\/li><li>В КР не нашла: Ферромальт, Сидерал, метоклопрамид и бисакодил (побочные эффекты), конкретные препараты вообще (КР даёт только дозу по элементарному железу). Как проверено: КР ЖДА 2024 прочитана автоматически (pravo.ppt.ru), дозы препаратов железа в КР только по элементарному железу. Содержание железа в таблетках и все остальные дозы сверяйте с инструкциями; официальный текст: cr.minzdrav.gov.ru.<\/li><\/ul>", "s": "Совпадает с КР: поиск причины ЖКТ и гинекологической, пероральное железо первой линией, срок 3 и более месяцев, внутривенное железо при тяжёлой анемии и нарушенном всасывании, ферритин как контроль. Расхождения: (1) дозы Сорбифера (до 400 мг) и Мальтофера (до 300 мг) выше рекомендованных КР 120 мг элементарного железа в сутки; (2) l701 просит весь набор показателей обмена железа, «Практики» (p02) только ферритин (КР перечисляет и сывороточное железо, и насыщение трансферрина); (3) диета: в КР как лечение не применяется; (4) Тотема 50 мг 2 раза: 100 мг железа, в пределах КР. В КР не нашла: Ферромальт, Сидерал, метоклопрамид и бисакодил (побочные эффекты), конкретные препараты вообще (КР даёт только дозу по элементарному железу). Как проверено: КР ЖДА 2024 прочитана автоматически (pravo.ppt.ru), дозы препаратов железа в КР только по элементарному железу. Содержание железа в таблетках и все остальные дозы сверяйте с инструкциями; официальный текст: cr.minzdrav.gov.ru."}, {"k": "info", "l": "О листе", "h": "<p>Собрано из вашего справочника («лечение.docx» Гематология l701; «Практики» p02; затем «Быстро» c02, c27, l702) и сверено с КР «Железодефицитная анемия» 2024 (ID 669, взрослые и дети, одобрены НПС Минздрава, пересмотр не позднее 2026; текст читала на pravo.ppt.ru, первые 100 тыс. из 130 тыс. знаков). Дата сборки: 16.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k10", "t": "Иммунная тромбоцитопения (ИТП)", "g": "c7", "kw": "тромбоцитопения тромбоциты D69.3", "tabs": [{"k": "t1", "l": "Жалобы и осмотр", "h": "<p><strong>Копируйте в карту, пустые места заполняйте<\/strong><\/p><p class=\"tpl\">Жалобы: на единичные или генерализованные петехиальные сыпи и экхимозы, петехии и экхимозы на слизистых, носовые и десневые кровотечения, мено- и метроррагии, желудочно-кишечные кровотечения( рвота цвета кофейной гущи, дегтеобразный кал), гематурию<\/p><p class=\"tpl\">Анамнез жизни:<\/p><p class=\"tpl\">Семейный анамнез отягощен, у близких родственников заболевание крови, со слов, мед документация не предоставлена/без особенностей . ВИЧ, Гепатит В, С, сифилис, туберкулез отрицает. Операции, гемотрансфузии отрицает. Вредные привычки: курение/отрицает<\/p><p class=\"tpl\">Аллергический анамнез:<\/p><p class=\"tpl\">Без особенностей/ перечислить возможные аллергические реакции на пищевые продукты, препараты и т. п., указать характер проявлений: отек Квинке, крапивница, зуд и т. д.<\/p><p class=\"tpl\">Эпидемиологический анамнез: контакты с инфекционными больными за последние 3 недели отрицает, выезды в эпид. неблаг-е территории и другие страны отрицает<\/p><p class=\"tpl\">Экспертный анамнез:<\/p><p class=\"tpl\">Работает/не работает<\/p><p class=\"tpl\">Анамнез заболевания:<\/p><p class=\"tpl\">Считает себя больным длительное время, самостоятельно не лечился, отметил ухудшение состояния в течение нескольких дней, после перенесенной вирусной/бактериальной инфекции. Обратился к специалисту. В анамнезе ВБНК, наблюдается у хирурга, постоянно препараты не принимает<\/p><p class=\"tpl\">Объективный осмотр: общее состояние: удовлетворительное/средней степени тяжести. Сознание: ясное. Кожные покровы и видимые слизистые чистые, физиологической окраски/бледные/пигментации цвета кофе с молоком/заеды в углу рта. Зев и небные дужки без изменений; миндалины без изменений; склеры нормальной окраски/иктеричные. Походка и поза: без особенностей. Объем движений конечностей: в норме. Осмотр нижних конечностей: варикозное расширение подкожных вен, телеангиоэктазии, отек нижних конечностей отсутствуют/ до верхней трети голеней, пульсация магистральных сосудов нижних конечностей ослабленная/в норме. Суставы без видимых изменений. Тип конституции нормостенический/астенический/гиперстенический. Рост 167 м, Вес 67 кг, ИМТ 23 кг/м2, Окружность талии- 75см, Температура 36,6С. Периферические лимфатические узлы: не увеличены, безболезненны/ увеличены, подвижны, умеренно болезненны в какой области?( паховая, подмышечная, подключичная, торакальная, шейная и т.п.) Дыхательная система: при перкуссии ясный легочной звук; при аускультации дыхание везикулярное/жесткое/ослабленное. Хрипов нет/сухие/влажные/крепитация. ЧДД 22 в мин. Sp02- 99%Сердечно-сосудистая система: аускультация сердца: тоны сердца звучные/приглушены, ритм правильный/неправильный, двухчленный/трехчленный. Патологические шумы не выслушиваются/систолический шум на верхушке сердца. АД: На правой руке 120-130/70-80 мм.рт.ст. На левой руке 120-130/70-80 мм.рт.ст. ЧСС=80 уд в мин. Пульс=80 уд в мин регулярный/нерегулярный. ДП нет/есть. Осмотр яремных вен: отрицательный венный пульс - в нормеПищеварительная система: язык влажный, чистый/обложен белым налетом. Живот правильной формы, симметричен, участвует в акте дыхания, при пальпации мягкий, безболезненный. Пальпация печени: справа по краю реберной дуги/+1-2 см выступает из-под края реберной дуги (гепатомегалия)/ поверхность ( гладкая, ровная, бугристая)/консистенция( мягкая/плотная)/болезненность. Селезенка не пальпируются/увеличена. Стул в нормеМочеполовая система: симптом Пастернацкого отрицательный. Диурез в н  до 10 мкг/кг; аватромбопаг 20 мг 1 раз в сутки (максимум 40 мг); элтромбопаг по приложению (в тексте дозы нет). Спленэктомия не ранее 12-24 месяцев от диагноза Третья линия Ритуксимаб 375 мг/м² (в среднем 500 мг) в/в раз в неделю, 4 введения, по решению комиссии; противопоказан при хроническом гепатите B Экстренно (кровотечение III-IV степени) Метилпреднизолон или дексаметазон пульс, ВВИГ; переливание тромбоцитов не рекомендовано, кроме массивного некупируемого кровотечения Что запретить пациенту НПВП не рекомендуются; наблюдение у гематолога, при ремиссии 1-2 раза в год. Экстренная госпитализация: кровотечения III-IV степени, тромбоциты до 20 с выраженным кровотечением в анамнезе"}, {"k": "t6", "l": "Замечания", "h": "<ul><li>Справочник темы по ИТП не содержит. Лечение ведёт гематолог; в документе только группы препаратов (ГКС, иммуноглобулин, ромиплостим, элтромбопаг, ритуксимаб, спленэктомия) без доз. Для терапевта главное: при подозрении на ИТП исключить вторичные причины (обследование выше) и направить к гематологу. Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам.<\/li><\/ul>", "s": "Справочник темы по ИТП не содержит. Лечение ведёт гематолог; в документе только группы препаратов (ГКС, иммуноглобулин, ромиплостим, элтромбопаг, ритуксимаб, спленэктомия) без доз. Для терапевта главное: при подозрении на ИТП исключить вторичные причины (обследование выше) и направить к гематологу. Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам."}, {"k": "info", "l": "О листе", "h": "<p>Шаблон приёма, формулировки диагнозов, коды и обследование взяты из присланного вами документа (краткие КР). Источник: Клинические рекомендации «Идиопатическая тромбоцитопеническая пурпура у взрослых», 2024 год.. Схемы лечения из вашего справочника доб
