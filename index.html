овная боль], [тяжесть, число дней с болью в месяц]. Код Название Источник G43.0 Мигрень без ауры Проверить: G43.1 Мигрень с аурой Проверить: G43.3 Осложнённая мигрень (G43.2 мигренозный статус) Проверить: G44.4 Лекарственно-индуцированная головная боль Проверить: Проверить: коды в справочнике для мигрени не указаны; из МКБ-10, сверьте."}, {"k": "t3", "l": "Купирование приступа", "h": "<div class=\"tw\"><table><thead><tr><th>Что<\/th><th>Схема<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td>Лёгкий и средний приступ (1 линия)<\/td><td>Ибупрофен 400 мг (препарат выбора по КР); ацетилсалициловая кислота 1000 мг; напроксен 500 мг; парацетамол 1000 мг (с осторожностью); диклофенак 50 мг (саше); кетопрофен 75 или 150 мг. Максимальные суточные дозы в КР не названы. В b01: ибупрофен 400 мг до 4 таб/день<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Тошнота<\/td><td>Метоклопрамид 10-20 мг внутрь (10 мг в/м) или домперидон 20-30 мг вместе с анальгетиком<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Тяжёлый приступ или нет эффекта НПВП<\/td><td>Триптаны в первые 30 мин: суматриптан 50 или 100 мг, элетриптан 40 или 80 мг, золмитриптан 2,5 или 5 мг. Повтор через 2 ч, не более 2 доз в сутки и не более 10 дней в месяц. При ауре не принимать во время ауры. Самый безопасный по сердцу: элетриптан<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Рвота, тяжёлый приступ<\/td><td>Кеторолак 60 мг в/м или 30 мг в/в<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Не рекомендуются<\/td><td>Метамизол, опиоиды, комбинации с кофеином, кодеином, барбитуратами<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>Что<\/th><th>Схема<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td>Мигренозный статус<\/td><td>В стационар. В КР: метоклопрамид 10 мг в/в, декскетопрофен 50 мг, кеторолак, дексаметазон 10-24 мг, магния сульфат 2 г (только при ауре)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Противопоказания к триптанам: ИБС, окклюзионные заболевания периферических сосудов, неконтролируемая АГ, стволовая аура. Не больше 2 дней в неделю (8 в месяц) для любых средств от приступа: иначе риск лекарственно-индуцированной головной боли (триптаны, комбинированные ≥ 10 дней/мес, НПВП и парацетамол ≥ 15 дней/мес). <span class=\"lb lb-kr\">КР<\/span><\/p>", "s": "Что Схема Источник Лёгкий и средний приступ (1 линия) Ибупрофен 400 мг (препарат выбора по КР); ацетилсалициловая кислота 1000 мг; напроксен 500 мг; парацетамол 1000 мг (с осторожностью); диклофенак 50 мг (саше); кетопрофен 75 или 150 мг. Максимальные суточные дозы в КР не названы. В b01: ибупрофен 400 мг до 4 таб/день КР ЛЕЧ Тошнота Метоклопрамид 10-20 мг внутрь (10 мг в/м) или домперидон 20-30 мг вместе с анальгетиком КР Тяжёлый приступ или нет эффекта НПВП Триптаны в первые 30 мин: суматриптан 50 или 100 мг, элетриптан 40 или 80 мг, золмитриптан 2,5 или 5 мг. Повтор через 2 ч, не более 2 доз в сутки и не более 10 дней в месяц. При ауре не принимать во время ауры. Самый безопасный по сердцу: элетриптан КР ЛЕЧ Рвота, тяжёлый приступ Кеторолак 60 мг в/м или 30 мг в/в КР Не рекомендуются Метамизол, опиоиды, комбинации с кофеином, кодеином, барбитуратами КР Что Схема Источник Мигренозный статус В стационар. В КР: метоклопрамид 10 мг в/в, декскетопрофен 50 мг, кеторолак, дексаметазон 10-24 мг, магния сульфат 2 г (только при ауре) КР Противопоказания к триптанам: ИБС, окклюзионные заболевания периферических сосудов, неконтролируемая АГ, стволовая аура. Не больше 2 дней в неделю (8 в месяц) для любых средств от приступа: иначе риск лекарственно-индуцированной головной боли (триптаны, комбинированные ≥ 10 дней/мес, НПВП и парацетамол ≥ 15 дней/мес). КР"}, {"k": "t4", "l": "Профилактика", "h": "<p>Показания: ≥ 3 тяжёлых приступов в месяц при адекватном лечении; ≥ 8 дней головной боли в месяц; затяжная аура; хроническая мигрень; злоупотребление обезболивающими; мигренозный инфаркт или статус в анамнезе; тяжёлые сопутствующие болезни. <span class=\"lb lb-kr\">КР<\/span><\/p><div class=\"tw\"><table><thead><tr><th>Линия<\/th><th>Препарат и доза<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Пропранолол 80-160 мг/сут (A); метопролол 100-200 мг/сут (B); топирамат 100-200 мг/сут, старт 25 мг, +25 мг в неделю (B)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>1 (специалист)<\/td><td>Ботулотоксин A 155-195 ЕД каждые 12 нед только при хронической мигрени; антитела к CGRP (эренумаб 70-140 мг, фреманезумаб) при ≥ 4 днях мигрени в месяц<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>2<\/td><td>Амитриптилин 50-150 мг/сут; венлафаксин 75-150 мг/сут; атенолол 100 мг; кандесартан 16 мг; вальпроевая кислота 400-1500 мг (нежелательна женщинам детородного возраста)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Оценка: снижение числа дней с болью ≥ 50% через 3 мес; нет эффекта за 3 мес: сменить препарат; курс 6-12 мес, затем попытка отмены. Ноотропы и психостимуляторы для профилактики не рекомендованы. <span class=\"lb lb-kr\">КР<\/span><\/p>", "s": "Показания: ≥ 3 тяжёлых приступов в месяц при адекватном лечении; ≥ 8 дней головной боли в месяц; затяжная аура; хроническая мигрень; злоупотребление обезболивающими; мигренозный инфаркт или статус в анамнезе; тяжёлые сопутствующие болезни. КР Линия Препарат и доза Источник 1 Пропранолол 80-160 мг/сут (A); метопролол 100-200 мг/сут (B); топирамат 100-200 мг/сут, старт 25 мг, +25 мг в неделю (B) КР 1 (специалист) Ботулотоксин A 155-195 ЕД каждые 12 нед только при хронической мигрени; антитела к CGRP (эренумаб 70-140 мг, фреманезумаб) при ≥ 4 днях мигрени в месяц КР 2 Амитриптилин 50-150 мг/сут; венлафаксин 75-150 мг/сут; атенолол 100 мг; кандесартан 16 мг; вальпроевая кислота 400-1500 мг (нежелательна женщинам детородного возраста) КР Оценка: снижение числа дней с болью ≥ 50% через 3 мес; нет эффекта за 3 мес: сменить препарат; курс 6-12 мес, затем попытка отмены. Ноотропы и психостимуляторы для профилактики не рекомендованы. КР"}, {"k": "t5", "l": "Наблюдение", "h": "<ul><li>Диспансерное наблюдение и частота визитов в КР и справочнике не описаны. Проверить: Хроническая мигрень, лекарственный абузус, красные флаги, нет эффекта: невролог.<\/li><\/ul>", "s": "Диспансерное наблюдение и частота визитов в КР и справочнике не описаны. Проверить: Хроническая мигрень, лекарственный абузус, красные флаги, нет эффекта: невролог."}, {"k": "t6", "l": "Расхождения", "h": "<ul><li>Суматриптан (l118, c29): 50 мг за 30 мин, повтор через 2 ч, до 24 ч, разово 100 мг: КР согласуется по 50-100 мг, повтору через 2 ч и пределу 2 доз в сутки. Но справочник не называет ≤ 10 дней в месяц и противопоказания (ИБС, неконтролируемая АГ); КР добавляет, что НПВП первого выбора, триптаны при их неэффективности.<\/li><li>Ноотропы (l119, c32) и Мексидол, Церебролизин, Милдронат (b01): в КР против ноотропов при мигрени как профилактики; для самой мигрени их применение КР не подтверждает. «Бетасерк, Предуктал, Стугерон» (c33, l120) относятся к головокружению: КР по мигрени их не охватывает.<\/li><li>Амитриптилин (p06): ¼ → ½ → 1 таб (25 мг) на ночь длительно; КР: 50-150 мг/сут как 2 линия. Дозы p06 ниже диапазона КР: проверить, это стартовая титрация или конечная.<\/li><li>b01 «Мигрень капориза 10 мг не более 20 мг»: непонятный препарат/запись, в КР не найден; уточните название и дозу.<\/li><li>Проверить: КР просрочена (до 2023), текст получен не полностью (нет раздела о беременности, наратриптана, римегепанта); максимальные суточные дозы НПВП в КР не указаны. Как проверено: КР прочитана автоматически (pravo.ppt.ru, первые 100 тыс. знаков). Проверяйте на cr.minzdrav.gov.ru и по инструкциям.<\/li><\/ul>", "s": "Суматриптан (l118, c29): 50 мг за 30 мин, повтор через 2 ч, до 24 ч, разово 100 мг: КР согласуется по 50-100 мг, повтору через 2 ч и пределу 2 доз в сутки. Но справочник не называет ≤ 10 дней в месяц и противопоказания (ИБС, неконтролируемая АГ); КР добавляет, что НПВП первого выбора, триптаны при их неэффективности. Ноотропы (l119, c32) и Мексидол, Церебролизин, Милдронат (b01): в КР против ноотропов при мигрени как профилактики; для самой мигрени их применение КР не подтверждает. «Бетасерк, Предуктал, Стугерон» (c33, l120) относятся к головокружению: КР по мигрени их не охватывает. Амитриптилин (p06): ¼ → ½ → 1 таб (25 мг) на ночь длительно; КР: 50-150 мг/сут как 2 линия. Дозы p06 ниже диапазона КР: проверить, это стартовая титрация или конечная. b01 «Мигрень капориза 10 мг не более 20 мг»: непонятный препарат/запись, в КР не найден; уточните название и дозу. Проверить: КР просрочена (до 2023), текст получен не полностью (нет раздела о беременности, наратриптана, римегепанта); максимальные суточные дозы НПВП в КР не указаны. Как проверено: КР прочитана автоматически (pravo.ppt.ru, первые 100 тыс. знаков). Проверяйте на cr.minzdrav.gov.ru и по инструкциям."}, {"k": "info", "l": "О листе", "h": "<p>Основа: справочник (Неврология l118, l119, l120; Быстро c29, c32, c33; Назначения b01; Практики p06). Сверка: КР «Мигрень» (ID 295, взрослые, 2021; в карточке срок действия до 2023, прочитано 100 тыс. из 200 тыс. знаков, часть текста обрезана). Дата сборки: 18.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k12", "t": "Мочекаменная болезнь", "g": "c5", "kw": "мочекаменная болезнь камни почечная колика N13.2 N20.0 N20.1 N20.2 N20.9 N23", "tabs": [{"k": "t1", "l": "Жалобы и осмотр", "h": "<p><strong>Копируйте в карту, пустые места заполняйте<\/strong><\/p><p class=\"tpl\">Жалобы: боль в поясничной области на стороне локализации камня, гематурию, периодическую лихорадку с ознобом, а также учащенное мочеиспускание, тошноту, рвоту<\/p><p class=\"tpl\">Анамнез жизни: Не отягощен, без особенностей/ описать. ВИЧ, Гепатит В, С, сифилис, туберкулез отрицает. Операции, гемотрансфузии отрицает. Вредные привычки: отрицает. +<\/p><p class=\"tpl\">Аллергический анамнез: Без особенностей/ перечислить возможные аллергические реакции на пищевые продукты, препараты и т. п., указать характер проявлений: отек Квинке, крапивница, зуд и т. д.<\/p><p class=\"tpl\">Эпидемиологический анамнез: контакты с инфекционными больными за последние 3 недели отрицает, выезды в эпид. неблаг-е территории и другие страны отрицает.<\/p><p class=\"tpl\">Экспертный анамнез: Работает/не работает<\/p><p class=\"tpl\">Анамнез заболевания: считает себя больным в течение нескольких дней, когда появились вышеуказанные симптомы, самостоятельно не лечился, в анамнезе хронический пиелонефрит/цистит, со слов. Постоянно принимает Аллопуринол, Аспирин кардио, антигипертензивные препараты, названия не помнит.<\/p><p class=\"tpl\">Объективный осмотр:<\/p><p class=\"tpl\">Общее состояние: удовлетворительное. Сознание: ясное. Кожные покровы и видимые слизистые чистые, физиологической окраски/акроцианоз. Зев- без изменений. Склеры нормальной окраски/иктеричные. Походка и поза: без особенностей. Объем движений конечностей:в норме. Суставы без видимых изменений. Тип конституции нормостенический/астенический/гиперстенический. Рост 167 м, Вес 67 кг, ИМТ 23 кг/м2, Окружность талии- 75см, Температура 36,6С.Лимфатические узлы подвижные. Отеки: отсутствуют/пастозость/до нижней трети голеней/средней трети/ верхней трети.<\/p><p class=\"tpl\">Дыхательная система: при перкуссии звук ясный легочной; при аускультации дыхание везикулярное/жесткое/ослабленное. Хрипов нет/сухие/влажные/крепитация. ЧДД 17 в мин. Sp02- 98%<\/p><p class=\"tpl\">Сердечно-сосудистая система: аускультация сердца: тоны сердца звучные/приглушены, ритм правильный/неправильный, двухчленный/трехчленный; Патологические шумы не выслушиваются АД: На правой руке 120-130/70-80 мм.рт.ст. На левой руке 120-130/70-80 мм.рт.ст. ЧСС=80 уд в мин. Пульс=80 уд в мин регулярный/нерегулярный. ДП нет/есть.<\/p><p class=\"tpl\">Пищеварительная система: язык влажный, чистый. Живот правильной формы, симметричен, участвует в акте дыхания, при пальпации мягкий, безболезненный. Пальпация печени: справа по краю реберной дуги/+1-2 см выступает из-под края реберной дуги (гепатомегалия)/ поверхность (гладкая, ровная, бугристая)/консистенция (мягкая/плотная)/болезненность. Селезенка не пальпируется. Стул в норме.<\/p><p class=\"tpl\">Мочеполовая система: пальпация почек: безболезненна/болезненная в костовертебральном углу. Перкуссия почек: симптом Пастернацкого отрицательный. Пальпация мочевого пузыря:безболезненна/ болезненность при пальпации в надлобковой области. Диурез- дизурия, поллакиурия, гематурия/ норма.<\/p>", "s": "Копируйте в карту, пустые места заполняйте Жалобы: боль в поясничной области на стороне локализации камня, гематурию, периодическую лихорадку с ознобом, а также учащенное мочеиспускание, тошноту, рвоту Анамнез жизни: Не отягощен, без особенностей/ описать. ВИЧ, Гепатит В, С, сифилис, туберкулез отрицает. Операции, гемотрансфузии отрицает. Вредные привычки: отрицает. + Аллергический анамнез: Без особенностей/ перечислить возможные аллергические реакции на пищевые продукты, препараты и т. п., указать характер проявлений: отек Квинке, крапивница, зуд и т. д. Эпидемиологический анамнез: контакты с инфекционными больными за последние 3 недели отрицает, выезды в эпид. неблаг-е территории и другие страны от пации в надлобковой области. Диурез- дизурия, поллакиурия, гематурия/ норма."}, {"k": "t2", "l": "Формулировка диагноза", "h": "<p>Предварительный диагноз: Мочекаменная болезнь, конкремент нижней 3ти левого мочеточника. Левосторонняя почечная колика. Острый обструктивный пиелонефрит слева.<\/p>", "s": "Предварительный диагноз: Мочекаменная болезнь, конкремент нижней 3ти левого мочеточника. Левосторонняя почечная колика. Острый обструктивный пиелонефрит слева."}, {"k": "t3", "l": "Код МКБ-10", "h": "<ul><li>N20.0 камни почки; N20.1 камни мочеточника; N20.2 камни почки с камнями мочеточника; N20.9 мочевые камни неуточнённые; N23 почечная колика неуточнённая<\/li><li>N13.2 гидронефроз с обструкцией камнем почки и мочеточника<\/li><\/ul>", "s": "N20.0 камни почки; N20.1 камни мочеточника; N20.2 камни почки с камнями мочеточника; N20.9 мочевые камни неуточнённые; N23 почечная колика неуточнённая N13.2 гидронефроз с обструкцией камнем почки и мочеточника"}, {"k": "t4", "l": "План обследования", "h": "<ul><li>ОАК (уровень лейкоцитов, лейкоцитарная формула, СОЭ)<\/li><li>ОАМ<\/li><li>Биохимический анализ крови: уровень креатинина<\/li><li>Анализ минерального состава мочевых камней (дифракция рентгеновских лучей или инфракрасная спектроскопия)<\/li><li>Микробиологическое (культуральное) исследование мочи на бактериальные патогены c определением чувствительности к антибиотикам ( перед выполнением плановой операции)<\/li><li>Коагулограмма: АЧТВ, МНО, фибриноген при планировании оперативного вмешательства<\/li><li>Мультиспиральная компьютерная томография (МСКТ) почек и мочевыводящих путей без контрастного усиления/ с контрастным усилением при планировании консервативного или оперативного лечения, с целью визуализации конкрементов мочевых путей, определения их локализации, размеров, плотности и количества<\/li><li>УЗИ почек и мочевыводящих путей и/или обзорная урография<\/li><\/ul>", "s": "ОАК (уровень лейкоцитов, лейкоцитарная формула, СОЭ) ОАМ Биохимический анализ крови: уровень креатинина Анализ минерального состава мочевых камней (дифракция рентгеновских лучей или инфракрасная спектроскопия) Микробиологическое (культуральное) исследование мочи на бактериальные патогены c определением чувствительности к антибиотикам ( перед выполнением плановой операции) Коагулограмма: АЧТВ, МНО, фибриноген при планировании оперативного вмешательства Мультиспиральная компьютерная томография (МСКТ) почек и мочевыводящих путей без контрастного усиления/ с контрастным усилением при планировании консервативного или оперативного лечения, с целью визуализации конкрементов мочевых путей, определения их локализации, размеров, плотности и количества УЗИ почек и мочевыводящих путей и/или обзорная урография"}, {"k": "t5", "l": "План лечения", "h": "<ul><li>Медикаментозная литокинетическая (камнеизгоняющая) терапия (МЛТ): селективными α1-адреноблокаторами (Тамсулозин)<\/li><li>Пероральный хемолиз цитратными смесями (калия гидрокарбонат + лимонная кислота + натрия цитрат и др. комбинации)<\/li><li>Пероральный хемолиз натрия гидрокарбонатом<\/li><li>Фитотерапевтические препараты содержащие золототысячник, корень любистока, листья розмарина обыкновенного<\/li><li>Хирургическое лечение В документе даны группы препаратов и только часть доз; полные схемы смотрите ниже.<\/li><\/ul><h3>5а. Схемы и дозы по самой КР (прочитано мной по тексту КР): КР «Мочекаменная болезнь»<\/h3><h3>(взрослые, 2024, Российское общество урологов), прочитано 100 тыс. из 238 тыс. знаков<\/h3><div class=\"tw\"><table><thead><tr><th>Что<\/th><th>Доза, схема, срок<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Почечная колика — Доз и путей обезболивающих в прочитанной части нет; парацетамол при беременности. Некупируемая боль: экстренная госпитализация и дренирование\"><span>Почечная колика<\/span><\/label><\/td><td>Доз и путей обезболивающих в прочитанной части нет; парацетамол при беременности. Некупируемая боль: экстренная госпитализация и дренирование<\/ и гиперурикемии или гиперурикурии; фебуксостат 80 мг/сут при непереносимости\"><span>Лекарства для профилактики<\/span><\/label><\/td><td>Гидрохлоротиазид 25-50 мг 1 раз/сут при гиперкальциурии &gt; 8 ммоль/сут (или 5-8, если диета и ощелачивание не помогли); аллопуринол 100-300 мг/сут при гиперурикемии или гиперурикурии; фебуксостат 80 мг/сут при непереносимости<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Антибиотики — При бактериурии: курс по антибиотикограмме с контрольным посевом перед плановой операцией; острая инфекция на обструкции: после дренирования. Антибиотики при колике без инфекции в прочитанной части не упомянуты\"><span>Антибиотики<\/span><\/label><\/td><td>При бактериурии: курс по антибиотикограмме с контрольным посевом перед плановой операцией; острая инфекция на обструкции: после дренирования. Антибиотики при колике без инфекции в прочитанной части не упомянуты<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Экстренная госпитализация — Инфекционные осложнения МКБ; некупируемая боль; полная обструкция верхних мочевых путей камнем\"><span>Экстренная госпитализация<\/span><\/label><\/td><td>Инфекционные осложнения МКБ; некупируемая боль; полная обструкция верхних мочевых путей камнем<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Хирургия — Камень почки &gt; 5 мм, рост, обструкция, рецидивирующая инфекция; ДУВЛ, ПНЛ, ТНЛ при камнях &lt; 2 см, при &gt; 2 см ПНЛ; камни мочеточника: ДУВЛ или ТУЛ\"><span>Хирургия<\/span><\/label><\/td><td>Камень почки &gt; 5 мм, рост, обструкция, рецидивирующая инфекция; ДУВЛ, ПНЛ, ТНЛ при камнях &lt; 2 см, при &gt; 2 см ПНЛ; камни мочеточника: ДУВЛ или ТУЛ<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Наблюдение — Высокий риск рецидива: пожизненно у уролога; иначе 5 лет; УЗИ почек ежегодно; анализы крови и суточной мочи не реже 1 раза в 6 месяцев\"><span>Наблюдение<\/span><\/label><\/td><td>Высокий риск рецидива: пожизненно у уролога; иначе 5 лет; УЗИ почек ежегодно; анализы крови и суточной мочи не реже 1 раза в 6 месяцев<\/td><\/tr><\/tbody><\/table><\/div>", "s": "Медикаментозная литокинетическая (камнеизгоняющая) терапия (МЛТ): селективными α1-адреноблокаторами (Тамсулозин) Пероральный хемолиз цитратными смесями (калия гидрокарбонат + лимонная кислота + натрия цитрат и др. комбинации) Пероральный хемолиз натрия гидрокарбонатом Фитотерапевтические препараты содержащие золототысячник, корень любистока, листья розмарина обыкновенного Хирургическое лечение В документе даны группы препаратов и только часть доз; полные схемы смотрите ниже. 5а. Схемы и дозы по самой КР (прочитано мной по тексту КР): КР «Мочекаменная болезнь» (взрослые, 2024, Российское общество урологов), прочитано 100 тыс. из 238 тыс. знаков Что Доза, схема, срок Почечная колика Доз и путей обезболивающих в прочитанной части нет; парацетамол при беременности. Некупируемая боль: экстренная госпитализация и дренирование Литокинетика Тамсулозин 0,4 мг 1 раз/сут до 28 дней при камне мочеточника ≤ 7 мм без показаний к операции; через 28 дней без эффекта: операция. Альтернативы: доксазозин 4 мг, теразозин 10 мг, алфузозин 10 мг, силодозин 8 мг. Беременным не назначать Хемолиз уратных камней Цитратные смеси или натрия гидрокарбонат; pH мочи 6,8-7,2, контроль 3 раза в день; через 30 дней МСКТ или УЗИ; курс 1 месяц, затем +2 месяца, затем при необходимости +3 месяца; без уменьшения за 28 дней: удалять. Признаки уратных: ≤ 600 HU, pH мочи Метафилактика Диурез не менее 2,5 л/сут (плотность мочи ≤ 1010); соль 3-5 г; кальций с пищей 1000-1200 мг (не ограничивать); белок 0,8-1 г/кг; пурины до 500 мг/сут; pH мочи 6,2-6,8 8 ммоль/сут (или 5-8, если диета и ощелачивание не помогли); аллопуринол 100-300 мг/сут при гиперурикемии или гиперурикурии; фебуксостат 80 мг/сут при непереносимости\"> Лекарства для профилактики Гидрохлоротиазид 25-50 мг 1 раз/сут при гиперкальциурии > 8 ммоль/сут (или 5-8, если диета и ощелачивание не помогли); аллопуринол 100-300 мг/сут при гиперурикемии или гиперурикурии; фебуксостат 80 мг/сут при непереносимости Антибиотики При бактериурии: курс по антибиотикограмме с контрольным посевом перед плановой операцией; острая инфекция на обструкции: после дренирования. Антибиотики при колике без инфекции в прочитанной части не упомянуты Экстренная госпитализация Инфекционные осложнения МКБ; некупируемая боль; полная обструкция верхних мочевых путей камнем 5 мм, рост, обструкция, рецидивирующая инфекция; ДУВЛ, ПНЛ, ТНЛ при камнях 2 см ПНЛ; камни мочеточника: ДУВЛ или ТУЛ\"> Хирургия Камень почки > 5 мм, рост, обструкция, рецидивирующая инфекция; ДУВЛ, ПНЛ, ТНЛ при камнях 2 см ПНЛ; камни мочеточника: ДУВЛ или ТУЛ Наблюдение Высокий риск рецидива: пожизненно у уролога; иначе 5 лет; УЗИ почек ежегодно; анализы крови и суточной мочи не реже 1 раза в 6 месяцев"}, {"k": "t6", "l": "Схемы из вашего справочника", "h": "<p>Тема s18: Мочекаменная болезнь (МКБ)<\/p><ul><li>Схема лечения:<\/li><li>Лечение проводится урологами индивидуально для каждого пациента.<\/li><li>На первом этапе всем пациентам с МКБ рекомендуется купирование болевого синдрома.<\/li><li>Купирование почечной колики<\/li><li>НПВП (диклофенак, кеторолак) — препараты первой линии .<\/li><li>Литокинетическая терапия (изгнание камня)<\/li><li>Тамсулозин 0,4 мг/сут — препарат выбора<\/li><li>. Показан при камнях мочеточника размером до 7 мм.<\/li><li>Длительность курса — не более 28 дней. Сочетание с НПВП увеличивает эффективность .<\/li><li>Литолитическая терапия (растворение камня)<\/li><li>Возможна ТОЛЬКО для уратных камней.<\/li><li>Цитратные смеси (Блемарен, Уралит-У) — поддерживать pH мочи на уровне 6,5–7,2 под контролем pH-метрии . Длительность от 3 до 6 месяцев .<\/li><li>Метафилактика (профилактика рецидивов)<\/li><li>Показана ВСЕМ пациентам с МКБ . Подбор средства зависит от состава камня и кислотности мочи .<\/li><li>Уратные камни:<\/li><li>ощелачивание (цитраты) + аллопуринол при гиперурикемии.<\/li><li>Оксалатные камни:<\/li><li>калия цитрат, пиридоксин, ограничение щавелевой кислоты.<\/li><li>Инфекционные камни:<\/li><li>подкисление мочи + хирургическое удаление камня.<\/li><li>Направление к урологу<\/li><li>Камни &gt; 6–7 мм, камни единственной почки, стойкая обструкция/гидронефроз, инфекционные камни, неэффективность консервативной терапии.<\/li><\/ul><p>Тема l404: Мочекаменная болезнь (МКБ)<\/p><ul><li>Купирование болевого синдрома<\/li><li>достигается при применении различных комбинаций следующих НПВС и спазмолитиков (дозировка и длительность приема препаратов зависит от интенсивности болевого синдрома):<\/li><li>· Диклофенакнатрия 3,0-5,0 (75 – 125мг в сутки);<\/li><li>· Кетопрофен 2,0 в/м;<\/li><li>· Антибиотики: цефтриаксон 1г х 1- 2 раза в/м-5-7 дней или цефоперазон по 1,0 х 2 раза в/м 5-7 дней;<\/li><li>· Уросептики фторхинолонового ряда или нитрофуранового ряда: ципрофлоксацин 500 мг х 2 раза внутрь7-10дней или Фуразидин по 50-100 мг х 3-4 раза в сутки;<\/li><li>· Противогрибковые: флуконазол 150 мг х 1 раз внутрь 2-3 приема, фентиконазол 600 мг или 1000* мг 1 капсулу интравагинально однократно.<\/li><li>Стол №7. Рекомендуется ограничение поваренной соли до 2 г в сутки, ограничение животного и растительного белка (до 1 грамма на кг массы тела).<\/li><li>Обследование: ОАМ,ОАК, бак посек мочи, БАКрови (мочевина, креатинин). УЗИ почек. Консультация нефролога.<\/li><\/ul>", "s": "Тема s18: Мочекаменная болезнь (МКБ) Схема лечения: Лечение проводится урологами индивидуально для каждого пациента. На первом этапе всем пациентам с МКБ рекомендуется купирование болевого синдрома. Купирование почечной колики НПВП (диклофенак, кеторолак) — препараты первой линии . Литокинетическая терапия (изгнание камня) Тамсулозин 0,4 мг/сут — препарат выбора . Показан при камнях мочеточника размером до 7 мм. Длительность курса — не более 28 дней. Сочетание с НПВП увеличивает эффективность . Литолитическая терапия (растворение камня) Возможна ТОЛЬКО для уратных камней. Цитратные смеси (Блемарен, Уралит-У) — поддерживать pH мочи на уровне 6,5–7,2 под контролем pH-метрии . Длительность от 3 до 6 месяцев . Метафилактика (профилактика рецидивов) Показана ВСЕМ пациентам с МКБ . Подбор средства зависит от состава камня и кислотности мочи . Уратные камни: ощелачивание (цитраты) + аллопуринол при гиперурикемии. Оксалатные камни: калия цитрат, пиридоксин, ограничение щавелевой кислоты. Инфекционные камни: подкисление мочи + хирургическое удаление камня. Направление к урологу Камни > 6–7 мм, камни единственной почки, стойкая обструкция/гидронефроз, инфекционные камни, неэффективность консервативной терапии. Тема l404: Мочекаменная болезнь (МКБ) Купирование болевого синдрома достигается при применении различных комбинаций следующих НПВС и спазмолитиков (дозировка и длительность приема препаратов зависит от интенсивности болевого синдрома): · Диклофенакнатрия 3,0-5,0 (75 – 125мг в сутки); · Кетопрофен 2,0 в/м; · Антибиотики: цефтриаксон 1г х 1- 2 раза в/м-5-7 дней или цефоперазон по 1,0 х 2 раза в/м 5-7 дней; · Уросептики фторхинолонового ряда или нитрофуранового ряда: ципрофлоксацин 500 мг х 2 раза внутрь7-10дней или Фуразидин по 50-100 мг х 3-4 раза в сутки; · Противогрибковые: флуконазол 150 мг х 1 раз внутрь 2-3 приема, фентиконазол 600 мг или 1000* мг 1 капсулу интравагинально однократно. Стол №7. Рекомендуется ограничение поваренной соли до 2 г в сутки, ограничение животного и растительного белка (до 1 грамма на кг массы тела). Обследование: ОАМ,ОАК, бак посек мочи, БАКрови (мочевина, креатинин). УЗИ почек. Консультация нефролога."}, {"k": "t7", "l": "Замечания", "h": "<ul><li>В документе только группы препаратов. Схема из справочника s18: НПВП, тамсулозин 0,4 мг до 28 дней при камнях до 7 мм, цитратные смеси при уратных камнях (pH 6,5-7,2, 3-6 месяцев). Совпадает с планом документа.<\/li><li>Расхождение: в l404 в схеме колики стоят цефтриаксон, ципрофлоксацин и флуконазол; в вашем документе антибиотиков и противогрибковых нет. Назначайте их только при признаках инфекции.<\/li><li>Направление к урологу: камни более 6-7 мм, единственная почка, стойкая обструкция или гидронефроз, инфекционные камни (s18). Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам.<\/li><\/ul>", "s": "В документе только группы препаратов. Схема из справочника s18: НПВП, тамсулозин 0,4 мг до 28 дней при камнях до 7 мм, цитратные смеси при уратных камнях (pH 6,5-7,2, 3-6 месяцев). Совпадает с планом документа. Расхождение: в l404 в схеме колики стоят цефтриаксон, ципрофлоксацин и флуконазол; в вашем документе антибиотиков и противогрибковых нет. Назначайте их только при признаках инфекции. Направление к урологу: камни более 6-7 мм, единственная почка, стойкая обструкция или гидронефроз, инфекционные камни (s18). Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам."}, {"k": "info", "l": "О листе", "h": "<p>Шаблон приёма, формулировки диагнозов, коды и обследование взяты из присланного вами документа (краткие КР). Источник - Клинические рекомендации «Мочекаменная болезнь», 2024 год.. Схемы лечения из вашего справочника добавлены отдельным блоком. Дата сборки: 18.11.2026.<\/p>", "s": ""}]}, {"id": "k13", "t": "Нарушение липидного обмена", "g": "c1", "kw": "E78.0 E78.1 E78.2 E78.3 E78.4", "tabs": [{"k": "t1", "l": "Жалобы и осмотр", "h": "<p><strong>Копируйте в карту, пустые места заполняйте<\/strong><\/p><p class=\"tpl\">Жалобы: на момент осмотра не предъявляет/при поражении коронарного русла: на боли в левой половине грудной клетки, загрудинной области при физической нагрузке/в покое, неритмичное, резко учащенное сердцебиение или ощущение «замирания», «перебоев в работе сердца», одышку, отеки нижних конечностей; при локализации в цереброваскулярном бассейне: на головную боль, субъективное чувство головокружения, снижение памяти, внимания, работоспособности, появление «шума в ушах», «шума в голове»; при облитерирующем атеросклерозе артерий нижних конечностей: на перемежающуюся хромоту, в тяжелых случаях – появление интенсивных болей в нижних конечностях в покое, больше в ночное время, в горизонтальном положении пациента, интенсивность которых снижается после перехода в положение сидя/стоя<\/p><p class=\"tpl\">Анамнез заболевания: Считает себя больным(ой) с __ года (указать период, когда впервые выявлена дислипидемия/диагностирован атеросклероз). Состоит на диспансерном учете/наблюдается: у эндокринолога/кардиолога/терапевта. Длительно принимает препараты (описать характер назначенного ранее лечения, особое внимание обращаем на прием статинов, эзетимиба, ингибиторов PCSK9, фибратов, омега-3 ПНЖК, антигипертензивных препаратов). Хронические заболевания: ИБС, АГ, СД, атеросклероз периферических артерий, семейная гиперхолестеринемия (СГХС), метаболический синдром, ожирение, ХБП. В анамнезе отсутствуют данные/присутствуют данные о ранее перенесенных острых коронарных синдромах (дата), реваскуляризации миокарда (стентирование/АКШ, дата), инсультах/ТИА, операциях на сосудах нижних конечностей. Последнее обследование (при наличии): липидный профиль (на фоне терапии/без): ОХС ____ ммоль/л, ХС ЛПНП __ ммоль/л, ХС ЛПВП __ ммоль/л, ТГ __ ммоль/л. Оценка сердечно-сосудистого риска (SCORE2/SCORE2-OP): низкий/умеренный/высокий/очень высокий<\/p><p class=\"tpl\">Анамнез жизни: не отягощен, без особенностей/описать. ВИЧ, Гепатит В, С, сифилис, туберкулез отрицает. Операции, гемотрансфузии отрицает<\/p><p class=\"tpl\">Аллергологический анамнез: не отягощен/отягощен (указать аллерген и характер проявлений: отек Квинке, крапивница, зуд и тд.)<\/p><p class=\"tpl\">Эпидемиологический анамнез: выезды в эпидемиологически неблагополучные территории и другие страны отрицает. В контакте с инфекционными больными не находился<\/p><p class=\"tpl\">Лекарственная непереносимость: отрицает/да ( вастатин 20-40 мг/сут Статины умеренной интенсивности Аторвастатин 10-20 мг/сут; розувастатин 5-10 мг/сут; питавастатин 4 мг Эзетимиб 10 мг (дозу в прочитанной части не вижу, 10 мг стандарт по инструкции); снижает ЛНП на 15-22%; предпочтительно в одной таблетке со статином; при непереносимости статинов (IIa) Ингибиторы PCSK9 Алирокумаб 75 или 150 мг п/к раз в 2 недели; эволокумаб 140 мг раз в 2 недели или 420 мг раз в месяц; инклисиран 3 раза в первый год, затем 2 раза в год. При очень высоком риске, если цель не достигнута на максимальном статине с эзетимибом Триглицериды на статине 1,7-2,3 ммоль/л: омега-3 до 2 г 2 раза в день; более 2,3: фенофибрат или омега-3; более 5,0: фенофибрат и омега-3 до 2 г 2 раза в день Контроль Липиды через 8 (±4) недель после старта или смены дозы; АЛТ и АСТ через 4-12 недель; после достижения цели ежегодно; рутинный контроль печёночных ферментов при отсутствии симптомов не рекомендован Семейная гиперхолестеринемия Диагноз по критериям DLCN, генетика при 6 и более баллах; статин сразу; каскадный скрининг родственников; при беременности и грудном вскармливании гиполипидемические препараты не рекомендуются"}, {"k": "t6", "l": "Схемы из вашего справочника", "h": "<p>Тема c44: Гиперхолестеринемия и атеросклероз<\/p><ul><li>ГИПЕРХОЛИСТЕРИНЕМИЯ И АТЕРОСКЛЕРОЗ<\/li><li>Причины появления бляшек:<\/li><li>- Теория повреждения: при активном и пассивном курении, повышении АД – поэтому у людей со всегда нормальных холестерином есть бляшки в сосудах, гиперхолистеринемии.<\/li><li>- Липидная теория: приклеивание внутри сосуда липидов приводит к разрастанию бляшки и истончению ее покрышки за счет энзимов, что при высоком АД или физ нагрузки приводит к разрыву.<\/li><li>При повреждении клеточки – моноциты и тромбоциты, устремляются в интиму сосуда вызывая утолщение стенки. – происходит гипоксия бляшки и участков сосуда. – некротические изменения – усиление васкуляризации бляшки. – как в жерле вулкана повреждаюся сосуды, что приводит к большому наслаиванию клеточек. Происходит растяжение мышечного слоя сосуда – он растягивается, затем спазмируется – появляется нестабильность бляшки. А также изменяются функции в сосудах из сократительной в провоспалительную с высвобождением цитокинов и факторов воспаления.<\/li><li>Пример диагноза:<\/li><\/ul>", "s": "Тема c44: Гиперхолестеринемия и атеросклероз ГИПЕРХОЛИСТЕРИНЕМИЯ И АТЕРОСКЛЕРОЗ Причины появления бляшек: - Теория повреждения: при активном и пассивном курении, повышении АД – поэтому у людей со всегда нормальных холестерином есть бляшки в сосудах, гиперхолистеринемии. - Липидная теория: приклеивание внутри сосуда липидов приводит к разрастанию бляшки и истончению ее покрышки за счет энзимов, что при высоком АД или физ нагрузки приводит к разрыву. При повреждении клеточки – моноциты и тромбоциты, устремляются в интиму сосуда вызывая утолщение стенки. – происходит гипоксия бляшки и участков сосуда. – некротические изменения – усиление васкуляризации бляшки. – как в жерле вулкана повреждаюся сосуды, что приводит к большому наслаиванию клеточек. Происходит растяжение мышечного слоя сосуда – он растягивается, затем спазмируется – появляется нестабильность бляшки. А также изменяются функции в сосудах из сократительной в провоспалительную с высвобождением цитокинов и факторов воспаления. Пример диагноза:"}, {"k": "t7", "l": "Замечания", "h": "<ul><li>Справочник c44 содержит теорию и пример диагноза, схем статинов нет. Дозы статинов и эзетимиба: блок 5а по КР 2023. Исправление целевого ЛНП по КР: очень высокий риск &lt; 1,4 ммоль/л и снижение не менее чем на 50%; высокий &lt; 1,8 и снижение не менее 50%; умеренный &lt; 2,6; низкий &lt; 3,0; &lt; 1,0 только при повторном событии за 2 года на максимальном статине. Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам.<\/li><\/ul>", "s": "Справочник c44 содержит теорию и пример диагноза, схем статинов нет. Дозы статинов и эзетимиба: блок 5а по КР 2023. Исправление целевого ЛНП по КР: очень высокий риск"}, {"k": "info", "l": "О листе", "h": "<p>Шаблон приёма, формулировки диагнозов, коды и обследование взяты из присланного вами документа (краткие КР). Источник: Клинические рекомендации «Нарушения липидного обмена», 2023 год. Схемы лечения из вашего справочника добавлены отдельным блоком. Дата сборки: 18.11.2026.<\/p>", "s": ""}]}, {"id": "k14", "t": "Опоясывающий герпес", "g": "c8", "kw": "B02.0 B02.1 B02.2 B02.3 B02.7 B02.8 B02.9", "tabs": [{"k": "t1", "l": "Диагностический минимум", "h": "<div class=\"tw\"><table><thead><tr><th>Что сделать<\/th><th>Комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Клиника\"><span>Клиника<\/span><\/label><\/td><td>Боль и парестезии в продроме, затем односторонние пузырьки на гиперемированном фоне по ходу дерматома<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ПЦР содержимого везикул на VZV\"><span>ПЦР содержимого везикул на VZV<\/span><\/label><\/td><td>Только при необходимости (B); чувствительность 98-100%<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Тест на ВИЧ\"><span>Тест на ВИЧ<\/span><\/label><\/td><td>По справочнику (l018); в КР ВИЧ упомянут как фактор риска, консультация инфекциониста<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Поражение глаза\"><span>Поражение глаза<\/span><\/label><\/td><td>Глазная ветвь V нерва у 10-15%; везикулы на крыле или кончике носа (признак Гетчинсона) = высокий риск осложнений: офтальмолог срочно, лечение вместе с неврологом<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/t ней<\/td><td>90 мг 1 раз 7 дней (беременным нельзя)<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Интерферон альфа-2b интраназально — 3 капли в каждый носовой ход 5-6 раз в день 5 дней — Грипферон, Генферон Лайт 3000 МЕ, 3 капли 5 раз в день 5 дней\"><span>Интерферон альфа-2b интраназально<\/span><\/label><\/td><td>3 капли в каждый носовой ход 5-6 раз в день 5 дней<\/td><td>Грипферон, Генферон Лайт 3000 МЕ, 3 капли 5 раз в день 5 дней<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Осельтамивир (Тамифлю) — В КР по ОРВИ нет: он для гриппа — 75 мг 2 раза 5 дней (и в p12 «Практики» для гриппа)\"><span>Осельтамивир (Тамифлю)<\/span><\/label><\/td><td>В КР по ОРВИ нет: он для гриппа<\/td><td>75 мг 2 раза 5 дней (и в p12 «Практики» для гриппа)<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Фавипиравир (Коронавир) — В КР по ОРВИ нет: для COVID-19 — 1600 мг 2 раза в 1-й день, затем 600 мг 2 раза до 10 дней (&lt; 75 кг)\"><span>Фавипиравир (Коронавир)<\/span><\/label><\/td><td>В КР по ОРВИ нет: для COVID-19<\/td><td>1600 мг 2 раза в 1-й день, затем 600 мг 2 раза до 10 дней (&lt; 75 кг)<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Проверить: доказательная база препаратов первой и второй линии в КР слабая (по комментариям врачей); кагоцел из КР исключён. Осельтамивир назначают при гриппе, особенно при факторах риска и беременности (первая линия по пересланному тексту КР по гриппу в p12, с оригиналом он не сверялся). При подозрении на грипп сделайте экспресс-тест, не откладывая лечение.<\/p><h3>Симптоматическая терапия<\/h3><div class=\"tw\"><table><thead><tr><th>Симптом<\/th><th>Схема<\/th><th>Что говорит КР<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td>Температура<\/td><td>Парацетамол 500 мг при &gt; 38,5 °C, до 8 таб. в сутки; ибупрофен 400 мг 3 раза (Ибуклин 400+325 мг 3 раза, максимум 3 табл.)<\/td><td>Порог &gt; 38 °C (у вас 38,5). Парацетамол 500-1000 мг каждые 4-6 часов, максимум 4000 мг; ибупрофен 400 мг 3 раза, максимум 1200 мг. Омепразол 20 мг при приёме НПВП. Детям и до 18 лет салицилаты не нужны<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Насморк<\/td><td>Физраствор или морская вода; ксилометазолин 1 впрыск 3 раза не более 7 дней<\/td><td>Физраствор 2-3 раза; ксилометазолин 1-2 дозы 3 раза; Синупрет 1 таб. 3 раза 7-14 дней<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Боль в горле<\/td><td>Полоскания (сода+соль, мирамистин, ромашка), пастилки (Фарингосепт, Граммидин, Лизобакт), спреи (Гексорал, Тантум Верде)<\/td><td>Антисептики: полоскания, пастилки, спреи<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Сухой кашель<\/td><td>Бутамират 50 мг 2 раза 3-5 дней; Ренгалин<\/td><td>Бутамират, леводропропизин, декстрометорфан; при продуктивном кашле противокашлевые не нужны<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Влажный кашель<\/td><td>Ацетилцистеин 200 мг 3 раза или 600 мг 1 раз 7 дней; амброксол 30 мг 3 раза 5-7 дней; Мукалтин<\/td><td>Амброксол 90 мг/сут, бромгексин 8 мг 3-4 раза, ацетилцистеин 600 мг/сут 5-7 дней. Отхаркивающие и противокашлевые одновременно не рекомендуются<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Витамины<\/td><td>Витамин С 1 г, витамин D 2000 МЕ в сутки<\/td><td>Колекальциферол 2000 МЕ/сут для профилактики; витамина С нет<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>Антибиотики<\/h3><div class=\"tw\"><table><thead><tr><th>При неосложнённой ОРВИ антибиотики не нужны. Показаны при бактериальных осложнениях (пневмония, синусит, бронхит с признаками бактериальной инфекции). При остром бронхите антибиотики в целом не рекомендованы; показаны при гнойной мокроте + выраженной интоксикации + хотя бы одном из: лейкоциты ≥ 12×10⁹/л и/или нейтрофилы ≥ 5,5×10⁹/л, палочкоядерные ≥ 10%, СРБ &gt; 50 мг/л (совпадает с вашим l002). <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/th><th><\/th><th><\/th><th><\/th><\/tr><\/thead><tbody><tr><td>Препарат<\/td><td>КР 2025 (бактериальный риносинусит)<\/td><td>Справочник (l001)<\/td><td>Источник<\/td><\/tr><tr><td>Амоксициллин/клавулана т<\/td><td>500/125 мг 3 раза или 875/125 мг 2 раза 7-10 дней<\/td><td>875/125 мг 2 раза 7 дней<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Амоксициллин<\/td><td>500-1000 мг 3 раза 7-10 дней<\/td><td>нет<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Азитромицин<\/td><td>500 мг 1 раз 3 дня<\/td><td>500 мг 1 раз 5 дней<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Кларитромицин<\/td><td>500 мг 1 раз в сутки 7-10 дней<\/td><td>500 мг 1 раз 5 дней<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Левофлоксацин<\/td><td>500 мг 1 раз в сутки 5-7 дней, по особым показаниям<\/td><td>500 мг 2 раза в день 5 дней (ошибка)<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>В КР по бронхиту доз антибиотиков нет; доза левофлоксацина 500 мг 2 раза в день не соответствует ни КР, ни инструкции (обычно 500 мг 1 раз). Подозрение на коклюш: кларитромицин (КР по бронхиту). Пробиотик при длительной антибиотикотерапии (Линекс Форте): КР допускает. Критерии начала антибиотика в l001 («температура на 4-й день 37,5 и выше») КР не называет.<\/p><h3>Что в справочнике не подтверждается КР<\/h3><ul><li>Ингаляционные ГКС (Пульмикорт, Симбикорт) при кашле дольше 14 дней: КР по бронхиту их рутинно не рекомендует; бронхолитики только при неотвязном кашле и бронхиальной гиперреактивности. При затяжном кашле дольше 4 недель КР: исключить постназальный затёк, астму и ГЭРБ. <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/li><li>Гомеопатия и «безрецептурные» средства (Бронхо-мунал, Стодаль, Пиносол, Гомеовокс, Грудной сбор), Синусэфрин/Полидекса, антигистаминные при ОРВИ: в прочитанных частях КР не нашла. <span class=\"lb lb-le\">ЛЕЧ<\/span><\/li><li>Иммуномодулятор Полиоксидоний (p12 «Практики»): в КР 2025 азоксимера бромид во второй линии (таблетки сублингвально 2 раза 7 дней), без инъекционных схем; уровень доказательности низкий. <span class=\"lb lb-pk\">ПРАКТИКА<\/span> <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul>", "s": "Режим: постельный режим при высокой температуре, обильное питьё (в амбулаторных условиях 2-3 л в сутки). КР ЛЕЧ Противовирусные и иммунотропные (начать не позднее 48 часов от начала) Препарат Доза по КР 2025 У вас в справочнике Источник Первая линия (по КР): риамиловир 250 мг 3 раза в сутки 5 дней нет КР Умифеновир (Арбидол) 200 мг 4 раза в сутки 5 дней 200 мг 4 раза 5-7 дней КР ЛЕЧ Энисамия йодид 500 мг 3 раза в сутки 5-7 дней нет КР Препарат Доза по КР 2025 У вас в справочнике Источник Вторая линия (иммунотропные): Ингавирин (имидазолилэтанамид пентандиовой кислоты) 90 мг 1 раз в сутки 5-7 дней 90 мг 1 раз 7 дней (беременным нельзя) КР ЛЕЧ Интерферон альфа-2b интраназально 3 капли в каждый носовой ход 5-6 раз в день 5 дней Грипферон, Генферон Лайт 3000 МЕ, 3 капли 5 раз в день 5 дней КР ЛЕЧ Осельтамивир (Тамифлю) В КР по ОРВИ нет: он для гриппа 75 мг 2 раза 5 дней (и в p12 «Практики» для гриппа) ЛЕЧ ПРАКТИКА Фавипиравир (Коронавир) В КР по ОРВИ нет: для COVID-19 1600 мг 2 раза в 1-й день, затем 600 мг 2 раза до 10 дней ( ЛЕЧ Проверить: доказательная база препа нструкциями препаратов. КР по гриппу взрослых 2025 я не читала."}, {"k": "info", "l": "О листе", "h": "<p>Собрано из вашего справочника («лечение.docx» Инфекции l001 ОРВИ, l002 Острый бронхит, l003 Фарингит; затем «Шаблоны», «Быстро»; «Практики» p12 про грипп) и сверено с КР «Острые респираторные вирусные инфекции (ОРВИ) у взрослых» 2025 (ID 724_2, РНМОТ и НАСИБ, одобрены НПС Минздрава, пересмотр не позднее 2027; в коды входит и J20) и КР «Острый бронхит у взрослых» 2022 (Российское респираторное общество и РНМОТ; найден проект, срок действия указан до 2025: статус в рубрикаторе проверьте). Дата сборки: 16.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k16", "t": "Остеоартроз (гонартроз, коксартроз, полиостеоартроз)", "g": "c6", "kw": "M15.0 M15.1 M15.2 M16 M17.0 M17.9 M18 M19 M24.5", "tabs": [{"k": "t1", "l": "Диагностический минимум", "h": "<div class=\"tw\"><table><thead><tr><th>Что сделать<\/th><th>Комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Жалобы, осмотр суставов\"><span>Жалобы, осмотр суставов<\/span><\/label><\/td><td>Постепенная боль, усиление при ходьбе, «стартовые» боли, скованность менее 30 минут, крепитация, ограничение движений, деформации, узелки Гебердена и Бушара, синовит. Боль по ВАШ или ЧРШ в самом болезненном суставе; ИМТ и АД<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Рентген коленных суставов стоя, прямая и боковая проекции\"><span>Рентген коленных суставов стоя, прямая и боковая проекции<\/span><\/label><\/td><td>КР: рентген в 2 проекциях всем (УУР A). Для тазобедренных: обзорный снимок таза; для кистей: прямая проекция обеих кистей на одном снимке. В l102 при возрасте 40+ и типичной картине допускают без рентгена, КР это не предусматривает<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"МРТ, УЗИ\"><span>МРТ, УЗИ<\/span><\/label><\/td><td>МРТ при клинике без рентгенологических изменений, подозрении на повреждение мениска, связок, остеонекроз, кисту Бейкера. УЗИ если МРТ недоступна<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"ОАК, СРБ, РФ, АЦЦП, мочевая кислота\"><span>ОАК, СРБ, РФ, АЦЦП, мочевая кислота<\/span><\/label><\/td><td>СОЭ и СРБ при синовите; РФ, анти-ЦЦП, мочевая кислота при поражении мелких суставов кистей и стоп (для отличия от ревматических болезней и подагры). Умеренное повышение при синовите, выраженное указывает на другое заболевание<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Креатинин и СКФ, АЛТ, АСТ, глюкоза, липиды, ОАМ\"><span>Креатинин и СКФ, АЛТ, АСТ, глюкоза, липиды, ОАМ<\/span><\/label><\/td><td>Перед НПВП и для сердечно-сосудистого риска<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Ревматолог\"><span>Ревматолог<\/span><\/label><\/td><td>Синовит; боль по ВАШ &gt; 7 или более 10 дней; необычная интенсивная боль; кисти у женщин до менопаузы или старше 50 лет с припухлостью, поражение проксимальных межфаланговых суставов, псориаз, несколько суставов с постоянной болью<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span> <span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div>", "s": "Что сделать Комментарий Источник Жалобы, осмотр суставов Постепенная боль, усиление при ходьбе, «стартовые» боли, скованность менее 30 минут, крепитация, ограничение движений, деформации, узелки Гебердена и Бушара, синовит. Боль по ВАШ или ЧРШ в самом болезненном суставе; ИМТ и АД КР СПР Рентген коленных суставов стоя, прямая и боковая проекции КР: рентген в 2 проекциях всем (УУР A). Для тазобедренных: обзорный снимок таза; для кистей: прямая проекция обеих кистей на одном снимке. В l102 при возрасте 40+ и типичной картине допускают без рентгена, КР это не предусматривает КР ЛЕЧ СПР МРТ, УЗИ МРТ при клинике без рентгенологических изменений, подозрении на повреждение мениска, связок, остеонекроз, кисту Бейкера. УЗИ если МРТ недоступна КР ОАК, СРБ, РФ, АЦЦП, мочевая кислота СОЭ и СРБ при синовите; РФ, анти-ЦЦП, мочевая кислота при поражении мелких суставов кистей и стоп (для отличия от ревматических болезней и подагры). Умеренное повышение при синовите, выраженное указывает на другое заболевание КР ЛЕЧ Креатинин и СКФ, АЛТ, АСТ, глюкоза, липиды, ОАМ Перед НПВП и для сердечно-сосудистого риска КР СПР ЛЕЧ Ревматолог Синовит; боль по ВАШ > 7 или более 10 дней; необычная интенсивная боль; кисти у женщин до менопаузы или старше 50 лет с припухлостью, поражение проксимальных межфаланговых суставов, псориаз, несколько суставов с постоянной болью ЛЕЧ КР"}, {"k": "t2", "l": "Формулировка диагноза и код", "h": "<div class=\"tw\"><table><thead><tr><th>Первичный [генерализованный] остеоартроз: гонартроз [справа / слева / двусторонний] [Косинская I-III, Kellgren-Lawrence 0-IV], коксартроз [стадия], [узелковая форма (узелки Гебердена, Бушара)]. [Синовит.] [Деформация варусная / вальгусная.] Функциональный класс [I-III]. [ВАШ __.] Сопутствующие: [ожирение, АГ, остеопороз ...].<\/th><th><\/th><th><\/th><\/tr><\/thead><tbody><tr><td>Код<\/td><td>Название<\/td><td>Источник<\/td><\/tr><tr><td>M15.0 / M15.1 / M15.2<\/td><td>Первичный генерализованный остеоартроз / узлы Гебердена / узлы Бушара<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>M16<\/td><td>Коксартроз<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>M17.0-M17.9<\/td><td>Гонартроз (первичный, посттравматический, другой вторичный; двусторонний, неуточнённый)<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>M18<\/td><td>Артроз первого запястно-пястного сустава<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>M19<\/td><td>Другие остеоартрозы<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>M24.5<\/td><td>Контрактура сустава (если есть)<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><\/tbody><\/table><\/div><div class=\"dx\" data-raw=\"Пример (ваш справочник): «Первичный генерализованный остеоартроз: гонартроз II ст. справа, II ст. слева, коксартроз I ст. с обеих сторон, суставы кистей (узелковая форма). Синовит правого коленного сустава. ФК II». Указывайте осложнения (синовит, деформации) и сопутствующее (ожирение, АГ): они влияют на выбор терапии. [ЛЕЧ]\"><\/div>", "s": "Первичный [генерализованный] остеоартроз: гонартроз [справа / слева / двусторонний] [Косинская I-III, Kellgren-Lawrence 0-IV], коксартроз [стадия], [узелковая форма (узелки Гебердена, Бушара)]. [Синовит.] [Деформация варусная / вальгусная.] Функциональный класс [I-III]. [ВАШ __.] Сопутствующие: [ожирение, АГ, остеопороз ...]. Код Название Источник M15.0 / M15.1 / M15.2 Первичный генерализованный остеоартроз / узлы Гебердена / узлы Бушара ЛЕЧ M16 Коксартроз ЛЕЧ M17.0-M17.9 Гонартроз (первичный, посттравматический, другой вторичный; двусторонний, неуточнённый) КР ЛЕЧ M18 Артроз первого запястно-пястного сустава ЛЕЧ M19 Другие остеоартрозы ЛЕЧ M24.5 Контрактура сустава (если есть) КР"}, {"k": "t3", "l": "Лечение", "h": "<h3>Немедикаментозное (основа, пожизненно)<\/h3><ul><li>ЛФК на укрепление мышц бедра и голени, аэробные упражнения (ходьба, плавание), модификация нагрузок, амортизирующая обувь, трость в руке на здоровой стороне при обострении. <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/li><li>Снижение массы тела при избытке: эффект дозозависимый (5-10%, 10-20%, более 20%). Справочник: на 10-12% при ИМТ ≥ 25. <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/li><li>Ортез при обострении; ударно-волновая терапия 5-6 процедур; мануальная терапия, массаж, криотерапия, санаторное лечение без выраженного синовита. Акупунктура не рекомендуется. <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul><h3>Лекарства: порядок по КР<\/h3><div class=\"tw\"><table><thead><tr><th>Шаг<\/th><th>Что по КР<\/th><th>Что в справочнике<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td>Местные НПВП<\/td><td>При умеренной боли до пероральных (A1); диклофенак местно 70-81 мг в сутки<\/td><td>Вольтарен-гель, кетопрофен-гель, Найз-гель, Аэртал 2 раза в день на область сустава; Димексид-компрессы<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Пероральные НПВП<\/td><td>При умеренной и выраженной боли. Один препарат, курс непрерывный, оценка через 5-7 суток, отмена при улучшении. Эторикоксиб 60 мг, диклофенак 150 мг в сутки. При риске ЖКТ (65+, язва в анамнезе, ГКС, антитромботики): селективные ЦОГ-2 или НПВП + ИПП. Очень высокий сердечный риск: НПВП не назначать<\/td><td>Эторикоксиб (Аркоксиа) 60-90 мг 1 раз 7-14 дней; целекоксиб 200 мг 2 раза или 100 мг 2 раза; мелоксикам 15 мг; Ксефокам 8 мг в/м 5 дней, затем ацеклофенак (Аэртал) 100 мг 2 раза 5 дней; ИПП: пантопразол 40 мг 2 раза (l102), эзомепразол 20 мг 2 раза, омепразол 20 мг<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Хондроитин и глюкозамин (СЛСЗД)<\/td><td>УУР A: глюкозамин сульфат 1500 мг/сут; хондроитин 500 мг 2 раза в сутки (или 800-1200 мг 1 раз). Эффект через 8-12 недель; нет эффекта 3 месяца: заменить; курс 5-6 месяцев. Эффект оригинальных препаратов не переносится на дженерики и БАДы<\/td><td>Артра 1 таб. 2 раза 3 недели, затем 1 раз до 3 месяцев; Терафлекс 1 капс. 3 раза 3 недели, затем 2 раза, 3-6 месяцев; Дона 1500 мг/сут 3 месяца; хондроитин (Структум) 750 мг 2 раза 3 недели, затем 500 мг 1 раз 6 месяцев<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Диацереин<\/td><td>УУР B: альтернатива НПВП; побочные: диарея, боль в эпигастрии<\/td><td>Артрокер 50 мг 2 раза 1 месяц, затем 1 раз 2 месяца (l102); в b09 1 капс. в день 14 дней, затем 2 капс.<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Другие СЛСЗД<\/td><td>Неомыляемые соединения авокадо и сои 300 мг/сут (B1); препараты морских рыб или гликозаминогликан-пептидный комплекс (B2)<\/td><td>Алфлутоп 1 мл/сут 20 инъекций или 2 мл через день 10 инъекций; Румалон; Мукосат, Хондролон<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><tr><td>Парацетамол, трамадол, дулоксетин<\/td><td>Парацетамол до 3 г в сутки при противопоказаниях к НПВП (эффект слабый); трамадол при неэффективности (18+); дулоксетин с 30 мг/сут при сильной хронической боли, невропатическом компоненте или депрессии<\/td><td>В справочнике нет<\/td><td><span class=\"lb lb-kr\">КР<\/span><\/td><\/tr><tr><td>Внутрисуставно<\/td><td>Гиалуроновая кислота при боли без синовита (B1), эффект 4-6 мес.; ГКС при выраженной боли и синовите не чаще 1 раза в 3 месяца, курсами нельзя; ПРП по желанию пациента<\/td><td>Гиалуроновая кислота в a05<\/td><td><span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/td><\/tr><\/tbody><\/table><\/div><p>Проверить: два и более НПВП одновременно КР не рекоменд ", "h": "<ul><li>Отдельного графика приёмов в прочитанной части КР нет. Практически: боль по ВАШ, функция, масса тела, переносимость НПВП (АД, креатинин и СКФ, АЛТ, АСТ, ЖКТ), эффект СЛСЗД (оценка через 8-12 недель, курс 5-6 месяцев), контрольный рентген при ухудшении. <span class=\"lb lb-kr\">КР<\/span> <span class=\"lb lb-sp\">СПР<\/span><\/li><li>Нежелательные явления НПВП нарастают через 4 недели непрерывного приёма: длительно без показаний не назначать. <span class=\"lb lb-kr\">КР<\/span><\/li><li>Проверить: частоту диспансерных приёмов по 168н не подтвердила.<\/li><\/ul>", "s": "Отдельного графика приёмов в прочитанной части КР нет. Практически: боль по ВАШ, функция, масса тела, переносимость НПВП (АД, креатинин и СКФ, АЛТ, АСТ, ЖКТ), эффект СЛСЗД (оценка через 8-12 недель, курс 5-6 месяцев), контрольный рентген при ухудшении. КР СПР Нежелательные явления НПВП нарастают через 4 недели непрерывного приёма: длительно без показаний не назначать. КР Проверить: частоту диспансерных приёмов по 168н не подтвердила."}, {"k": "t5", "l": "Проверка", "h": "<ul><li>Совпадает с КР: ЛФК и снижение веса, НПВП с ИПП, хондроитин и глюкозамин, диацереин, гиалуроновая кислота, рентген коленных суставов стоя, дифференциальная диагностика с РА и подагрой (РФ, АЦЦП, мочевая кислота).<\/li><li>Расхождения: (1) эторикоксиб 90 мг (s08, l102): КР приводит 60 мг; (2) пантопразол 40 мг 2 раза 15 дней в l102 как гастропротекция: дозы КР не указывает, обычно достаточно 1 раза (сверьте с инструкцией); (3) рентген при возрасте 40+ можно без рентгена (l102): КР рекомендует рентген всем; (4) в справочнике нет оценки сердечно-сосудистого риска перед НПВП.<\/li><li>В КР не нашла: Траумель, Димексид-компрессы, Румалон, Мукосат (гликозаминогликан-пептидный комплекс есть в КР, но торговые названия нет); дексаметазон в компрессе (c18); диета «молочные, рыбные продукты»; витамин D с целевым уровнем 60 нг/мл и кальций при остеопорозе (в КР по гонартрозу не рассматриваются: проверьте по КР по остеопорозу, цель 60 нг/мл мне кажется завышенной, но я её не проверяла). Как проверено: КР «Гонартроз» 2024 прочитана автоматически (pravo.ppt.ru). КР «Коксартроз» и «Остеоартрит» отдельно не читала. Дозы и состав препаратов сверяйте с инструкциями; официальный текст: cr.minzdrav.gov.ru.<\/li><\/ul>", "s": "Совпадает с КР: ЛФК и снижение веса, НПВП с ИПП, хондроитин и глюкозамин, диацереин, гиалуроновая кислота, рентген коленных суставов стоя, дифференциальная диагностика с РА и подагрой (РФ, АЦЦП, мочевая кислота). Расхождения: (1) эторикоксиб 90 мг (s08, l102): КР приводит 60 мг; (2) пантопразол 40 мг 2 раза 15 дней в l102 как гастропротекция: дозы КР не указывает, обычно достаточно 1 раза (сверьте с инструкцией); (3) рентген при возрасте 40+ можно без рентгена (l102): КР рекомендует рентген всем; (4) в справочнике нет оценки сердечно-сосудистого риска перед НПВП. В КР не нашла: Траумель, Димексид-компрессы, Румалон, Мукосат (гликозаминогликан-пептидный комплекс есть в КР, но торговые названия нет); дексаметазон в компрессе (c18); диета «молочные, рыбные продукты»; витамин D с целевым уровнем 60 нг/мл и кальций при остеопорозе (в КР по гонартрозу не рассматриваются: проверьте по КР по остеопорозу, цель 60 нг/мл мне кажется завышенной, но я её не проверяла). Как проверено: КР «Гонартроз» 2024 прочитана автоматически (pravo.ppt.ru). КР «Коксартроз» и «Остеоартрит» отдельно не читала. Дозы и состав препаратов сверяйте с инструкциями; официальный текст: cr.minzdrav.gov.ru."}, {"k": "info", "l": "О листе", "h": "<p>Собрано из вашего справочника («лечение.docx» Неврология l102 «Полиостеоартроз»; затем «Шаблоны» s08, «Алгоритмы» a05, «Назначения» b09, «Быстро» c18) и сверено с КР «Гонартроз» 2024 (ID 667_2, Ассоциации ревматологов, травматологов-ортопедов и реабилитологов, взрослые и дети, пересмотр не позднее 2026; прочитано 100 тыс. из 208 тыс. знаков на pravo.ppt.ru). КР по коксартрозу и полиостеоартрозу я отдельно не читала: принципы лечения у них общие, но проверьте. Дата сборки: 16.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k17", "t": "Остеопороз", "g": "c4", "kw": "M81.0 M81.8", "tabs": [{"k": "t1", "l": "Жалобы и осмотр", "h": "<p><strong>Копируйте в карту, пустые места заполняйте<\/strong><\/p><p class=\"tpl\">Жалобы: на боли в спине, тазобедренных суставах, ребрах и грудной клетке, снижение роста на 2 см и более за 1-3 года/на 4 см и более за жизнь, изменение осанки в виде сутулости, появление «горба», ограничение объема движений, нарушение походки, частые переломы при минимальной травме (компрессионный перелом тел позвонков/ переломы шейки бедра/ дистального отдела костей предплечья)<\/p><p class=\"tpl\">Анамнез заболевания: Считает себя больным(ой) с __ года (указать период, когда впервые поставлен диагноз остеопороза/ появились симптомы). Терапию для купирования болевого синдрома (НПВС) самостоятельно принимал/ не принимал (описать эффективность). Состоит на диспансерном учете/ наблюдается у эндокринолога/ ревматолога/ травматолога. Длительно принимает препараты (описать характер назначенного ранее лечения, особое внимание обращаем на прием глюкокортикоидов, противоопухолевых препаратов, барбитуратов, ингибиторов протонного насоса, антидепрессантов, пиоглитазона/росиглитазона, в случае установленного ранее остеопороза оцениваем эффективность антирезорбтивной/ анаболической терапии). В анамнезе отсутствуют данные/ присутствуют данные о перенесенных низкоэнергетических переломах (бедренной кости/ тел(а) позвонков(а)/ дистального отдела костей предплечья/ множественных переломов). Менопауза наступила с ___ лет, заместительная гормональная терапия назначалась/ не назначалась. Последнее обследование (при наличии): биохимический анализ крови, маркеры костного ремоделирования, рентгеноденситометрия поясничного отдела позвоночника и проксимального отдела бедренной кости<\/p><p class=\"tpl\">Анамнез жизни: не отягощен, без особенностей/ описать. ВИЧ, Гепатит В, С, сифилис, туберкулез отрицает. Операции, гемотрансфузии отрицает<\/p><p class=\"tpl\">Аллергологический анамнез: не отягощен/ отягощен (указать аллерген и характер проявлений: отек Квинке, крапивница, зуд и тд.)<\/p><p class=\"tpl\">Эпидемиологический анамнез: выезды в эпидемиологически неблагополучные территории и другие страны отрицает. В контакте с инфекционными больными не находился<\/p><p class=\"tpl\">Лекарственная непереносимость: отрицает/ да (перечислить лекарственные препараты и указать характер проявлений: отек Квинке, крапивница, зуд и тд.)<\/p><p class=\"tpl\">Хронические заболевания: отрицает/ перечислить если есть<\/p><p class=\"tpl\">Вредные привычки: отрицает/ употребляет алкоголь/ курение (стаж курения и сколько выкуриваемых сигарет в день)<\/p><p class=\"tpl\">Страховой анамнез: работает (указать, кем работает пациент)/ не работает<\/p><p class=\"tpl\">Инвалидность: нет/ есть (указать группу)<\/p><p class=\"tpl\">Объективный осмотр:<\/p><p class=\"tpl\">Общее состояние: состояние удовлетворительное. Сознание ясное, ориентирован во времени, в пространстве. Телосложение: нормостеническое/ астеническое/ гиперстеническое. Рост - см (уточнить максимальный рост в 25 лет и/или при последнем предыдущем измерении роста), вес - кг. ИМТ - кг/м2. Подкожная жировая клетчатка развита снижено/ умеренно/ повышено. Температура тела 36.6 С. Кожные покровы чистые, умеренной влажности/сухие, физиологической окраски. Зоны гиперпигментации и депигментации отсутствуют, тургор сохранен; волосы без изменений/сухие, ломкие, ногти без изменений/ ломкие, высыпания, расчесы, гнойники, язвы, стрии, рубцы не выявлены. Слизистые оболочки чистые, умеренной влажности, физиологической окраски. Слизистая конъюнктивы склер и нижнего века физиологической окраски. Зев розовый, чистый. Миндалины не увеличены, налета нет. Периферические лимфатические узлы не увеличены, безболезненны. Походка: без особенностей/ шаркающая походка. Объем движений конечностей: в норме/ снижен. Кости без изменений/ уменьшение расстояния между реберными дугами и гребнями подвздошных костей меньше ширины 2 пальцев. Суставы без видимых изменений/отечны, болезненны при пальпации. Мышечная сила сохранена/снижена. Щитовидная железа: визуально не увеличена, при пальпации мягко-эластической консистенции, безболезненная, подвижная. Экзофтальм отсутствует; Тремор отсутствует. Периферических отеков нет<\/p><p class=\"tpl\">Дыхательная система: грудная клетка обычной формы/ кифотическая деформация с формированием «вдовьего горба». При перкуссии звук ясный легочной; при аускультации дыхание везикулярное/жесткое/ослабленное. Хрипов нет/сухие/влажные/крепитация. ЧДД 17 в мин. Sp02- 98%<\/p><p class=\"tpl\">Сердечно-сосудистая система: аускультация сердца: тоны сердца звучные/приглушены, ритм правильный/неправильный, двухчленный/трехчленный; Патологические шумы не выслушиваются АД: На правой руке 120-130/70-80 мм.рт.ст. На левой руке 120-130/70-80 мм.рт.ст. ЧСС- 80 уд в мин. Пульс - 80 уд в мин регулярный/нерегулярный. ДП нет/есть<\/p><p class=\"tpl\">Пищеварительная система: язык влажный, чистый. Живот правильной формы/ выпячивание передней брюшной стенки, симметричен, участвует в акте дыхания, при пальпации мягкий, безболезненный. Пальпация печени: справа по краю реберной дуги, гладкая, безболезненная<\/p><p class=\"tpl\">Мочеполовая система: симптом Пастернацкого отрицательный. Диурез в норме<\/p>", "s": "Копируйте в карту, пустые места заполняй ования в моче (при СКФ&gt; 60мл/мин) у отдельных групп пациентов (редко):<\/li><li>Электрофорез белков (UPEP) (диагностика множественной миеломы и др. моноклональных гаммапатий)<\/li><li>Определение кальция, фосфора в суточной или разовой порции мочи (с коррекцией по креатинину) (в ряде случаев при диагностике гиперпаратиреоза, фосфопенических форм остеомаляции)<\/li><li>Свободный кортизол в суточной моче (эндогенный гиперкортицизм)<\/li><li>Гистамин в моче (системный мастоцитоз, некоторые гормонально-активные карциноидные опухоли)<\/li><li>Инструментальные исследования:<\/li><li>Рентгенография грудного и поясничного отдела в боковой проекции у пациентов (для выявления компрессионных переломов тел позвонков)<\/li><li>Двухэнергетическая рентгеноденситометрия (DXA) поясничного отдела позвоночника и проксимального отдела бедренной кости<\/li><li>Дополнительные остеоденситометрические технологии:<\/li><li>Количественная компьютерная томография (ККТ)<\/li><li>Периферическая DXA<\/li><li>Количественная ультразвуковая денситометрия (КУЗД, QUS)<\/li><\/ul>", "s": "Лабораторные исследования: Обязательный набор исследований при впервые установленном остеопорозе: ОАК ОАМ Б/х анализ крови (исключение вторичного остеопороза, исключение ограничений для назначения терапии): Уровень общего кальция Креатинин, расчет СКФ (СКD-EPI) Неорганический фосфор Общий магний Щелочная фосфатаза Печеночные ферменты (АЛТ, АСТ) Глюкоза Исследование C-концевого телопептида в крови, и/или исследование уровня N-терминального пропептида проколлагена 1-го типа (P1NP) в крови (маркер резорбции при назначении антирезорбтивной терапии и костеобразования при назначении анаболической терапии) По показаниям (при наличии клинической картины, по мнению врача): Тиреотропный гормон (ТТГ) +/- свободный Т4 (патология щитовидной железы) 25(OH)-витамин D (диагностика нарушений минерализации скелета) Паратиреоидный гормон (ПТГ) (диагностика гипер- и гипопаратиреоза) Общий тестостерон и гонадотропины у молодых мужчин/ : 2 и более перелома, потеря МПК 4% в бедре или 5% в позвонках<\/td><\/tr><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Рентген позвоночника, госпитализация — Рентген Th4-L5 при боли в спине, снижении роста на 4 см (или 2 см при контроле), глюкокортикоидах, плохо контролируемом СД; перелом шейки бедра: госпитализация и операция в течение 48 часов\"><span>Рентген позвоночника, госпитализация<\/span><\/label><\/td><td>Рентген Th4-L5 при боли в спине, снижении роста на 4 см (или 2 см при контроле), глюкокортикоидах, плохо контролируемом СД; перелом шейки бедра: госпитализация и операция в течение 48 часов<\/td><\/tr><\/tbody><\/table><\/div>", "s": "Антирезорбтивная терапия Бифосфонаты Алендроновая кислота внутрь 70 мг 1 раз в 7 дней Ризедроновая кислота 5 мг 1 раз в сутки Ибандроновая кислота 150 мг 1 раз в месяц и 3 мг 1 раз в 3 месяца в/в болюсно (только при постменопаузальном остеопорозе) Золедроновая кислота 5 мг 1 раз в год после хирургического лечения по поводу патологического перелома проксимального отдела бедренной кости; 5 мг 1 раз в 24 месяца для предупреждения потери МПК у женщин в постменопаузе с остеопенией; 1 раз в 18 месяцев для предупреждения переломов в группе женщин старше 65 лет Деносумаб 60 мг 1 раз в 6 месяцев Анаболическая терапия Терипаратид 20 мкг 1 раз в сутки Хирургическое лечение (при переломах проксимального отдела бедренной кости) Коррекция дефицита витамина D: Колекальциферол Активные метаболиты витамина D (пожилым с высоким риском падений как монотерапия или в комбинации с антирезорбтивной терапией для улучшения МПК): Альфакальцидол Кальцитриол Коррекция дефицита Са (при невозможности достичь необходимого потребления кальция с пищевыми продуктами): Карбонат кальция Цитрат кальция В документе даны группы препаратов и только часть доз; полные схемы смотрите ниже. 5а. Схемы и дозы по самой КР (прочитано мной по тексту КР): КР «Остеопороз» (КР87, утверждена 2016, срок пересмотра истёк), прочитано 100 тыс. из 263 тыс. знаков Что Доза, схема, срок Когда лечить Низкотравматический перелом бедра, позвонка или множественные переломы; Т-критерий -2,5 и ниже (шейка, бедро или позвонки L1-L4); высокий 10-летний риск по FRAX. FRAX порог вмешательства: 50-54 года 6,3%; 60-64: 9,9%; 65-69: 13,4%; 70-74: 17,6% Препараты Алендроновая, ризедроновая, золедроновая кислоты (А) при постменопаузальном остеопорозе, у мужчин и при глюкокортикоидном; деносумаб 60 мг 1 раз в 6 месяцев; терипаратид 20 мкг (до 24 месяцев); ибандроновая 150 мг раз в месяц. Дозы алендроната и ризедроната в прочитанной части не приведены (в справочнике алендронат 70 мг 1 раз в неделю, это стандартная дозировка по инструкции) Кальций, витамин D Все препараты с кальцием 500-1000 мг/сут и колекальциферолом не менее 800 МЕ/сут; целевой уровень 25(OH)D в прочитанной части не указан Длительность Пероральные бисфосфонаты 5 лет, внутривенные 3 года; перерыв при МПК не ниже -2,0 и без новых переломов; после терипаратида или деносумаба 1-2 года антирезорбтивная терапия Контроль DXA не чаще 1 раза в 12 месяцев; маркеры ремоделирования исходно и через 3 месяца (снижение не менее 30%). Неэффективность: 2 и более перелома, потеря МПК 4% в бедре или 5% в позвонках Рентген позвоночника, госпитализация Рентген Th4-L5 при боли в спине, снижении роста на 4 см (или 2 см при контроле), глюкокортикоидах, плохо контролируемом СД; перелом шейки бедра: госпитализация и операция в течение 48 часов"}, {"k": "t6", "l": "Схемы из вашего справочника", "h": "<p>Тема l116: Остеопороз<\/p><ul><li>Вит.Д : Аквадетрим или Вигантол или Оксидевит (желательно вит Д на масляной основе) 8-14 кап в сутки во время еды + Кальция карбонат (цитрат) 500 мг 2 раза<\/li><li>в день<\/li><li>После на постоянной основе вит Д 8 кап + Кальция карбонат (цитрат) 500 мг 1 раз в день<\/li><li>Фосамакс (ингибитор костной резорбции при остеопорозе) 70 мг по 1 таб<\/li><li>1 р/неделю длительно<\/li><\/ul>", "s": "Тема l116: Остеопороз Вит.Д : Аквадетрим или Вигантол или Оксидевит (желательно вит Д на масляной основе) 8-14 кап в сутки во время еды + Кальция карбонат (цитрат) 500 мг 2 раза в день После на постоянной основе вит Д 8 кап + Кальция карбонат (цитрат) 500 мг 1 раз в день Фосамакс (ингибитор костной резорбции при остеопорозе) 70 мг по 1 таб 1 р/неделю длительно"}, {"k": "t7", "l": "Замечания", "h": "<ul><li>Совпадает: алендроновая кислота 70 мг 1 раз в неделю (в справочнике Фосамакс), колекальциферол и препараты кальция (500 мг 2 раза).<\/li><li>Проверить: в справочнике «вит. Д 8-14 капель в сутки» без дозы в МЕ; по документу колекальциферол без дозы. Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам.<\/li><\/ul>", "s": "Совпадает: алендроновая кислота 70 мг 1 раз в неделю (в справочнике Фосамакс), колекальциферол и препараты кальция (500 мг 2 раза). Проверить: в справочнике «вит. Д 8-14 капель в сутки» без дозы в МЕ; по документу колекальциферол без дозы. Как проверено: текст документа перенесён автоматически без правок смысла; схемы справочника приведены как есть. Сверяйте на cr.minzdrav.gov.ru и по инструкциям к препаратам."}, {"k": "info", "l": "О листе", "h": "<p>Шаблон приёма, формулировки диагнозов, коды и обследование взяты из присланного вами документа (краткие КР). Источник: Клинические рекомендации «Остеопороз», 2021 год. Схемы лечения из вашего справочника добавлены отдельным блоком. Дата сборки: 18.11.2026.<\/p>", "s": ""}]}, {"id": "k18", "t": "Острый гастроэнтерит (ОКИ)", "g": "c3", "kw": "A02 A05 A08.0 A09 A09.9 K52 K52.1 K52.2 K52.9", "tabs": [{"k": "t1", "l": "Диагностический минимум", "h": "<div class=\"tw\"><table><thead><tr><th>Что сделать<\/th><th>Комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Оценка дегидратации\"><span>Оценка дегидратации<\/span><\/label><\/td><td>Тургор кожи, слизистые, диурез, ЧСС, АД, масса тела, температура. ное по детской КР: нифуроксазид не рекомендован; противодиарейные (лоперамид) не показаны. Для взрослых это не подтверждено: уточнить в КР для взрослых. Не проверено: критерии тяжести и дегидратации у взрослых, показания к антибиотику и ципрофлоксацин (КР не прочитана), объёмы регидратации (формула l305 и 2 л/сут) и госпитализация. Как проверено: взрослая КР не прочитана; детская КР ID 755 прочитана автоматически. Проверяйте на cr.minzdrav.gov.ru и по инструкциям."}, {"k": "info", "l": "О листе", "h": "<p>Основа: справочник (ЖКТ l305, l313; Шаблоны s22; Быстро c21; Инфекции l019). Сверка: КР для взрослых по ОКИ получить не удалось (страницы не открылись); прочитана только КР «Ротавирусный гастроэнтерит у детей» (2023, ID 755), она взрослых не охватывает, использована лишь как ориентир по принципам (регидратация, смектит, пробиотики, нет противодиарейных). Дозы взрослых проверить в КР «Острые кишечные инфекции у взрослых» на cr.minzdrav.gov.ru. Дата сборки: 18.11.2026.<\/p><div class=\"tw\"><table><thead><tr><th>Метка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><span class=\"lb lb-kr\">КР<\/span><\/td><td>подтверждено текстом КР<\/td><\/tr><tr><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><td>из вашего документа «лечение.docx»: основной источник для схем лечения<\/td><\/tr><tr><td><span class=\"lb lb-sp\">СПР<\/span><\/td><td>из других разделов вашего справочника (Шаблоны, Алгоритмы, Назначения)<\/td><\/tr><tr><td><span class=\"lb lb-pk\">ПРАКТИКА<\/span><\/td><td>практика (рекомендации практикующих врачей); в КР не найдено, решение за вами<\/td><\/tr><\/tbody><\/table><\/div>", "s": ""}]}, {"id": "k19", "t": "Острый синусит и гайморит", "g": "c8", "kw": "J01.0 J01.1 J01.2 J01.3 J01.4 J01.8 J01.9", "tabs": [{"k": "t1", "l": "Диагностический минимум", "h": "<div class=\"tw\"><table><thead><tr><th>Что сделать<\/th><th>Комментарий<\/th><th>Источник<\/th><\/tr><\/thead><tbody><tr><td><label class=\"ck\"><input type=\"checkbox\" data-o=\"Жалобы, осмотр, перед  data-o=\"Пробиотик — Линекс 2 капс. 3 раза 7 дней (c06)\"><span>Пробиотик<\/span><\/label><\/td><td>В КР не упоминается<\/td><td>Линекс 2 капс. 3 раза 7 дней (c06)<\/td><td><span class=\"lb lb-le\">ЛЕЧ<\/span><\/td><\/tr><\/tbody><\/table><\/div><h3>Другое<\/h3><ul><li>Пункция верхнечелюстной пазухи (ЛОР): при рентгенологическом подтверждении и тяжёлом течении или среднетяжёлом без эффекта системной терапии 5-7 дней. Синус-катетер при затяжном экссудативном течении. Одонтогенный синусит: убрать причину (стоматолог). <span class=\"lb lb-kr\">КР<\/span><\/li><li>Гомеопатические препараты при лёгком течении (УДД 4) и бактериофаги местно при непереносимости антибиотиков: в КР упомянуты. <span class=\"lb lb-kr\">КР<\/span><\/li><\/ul>", "s": "Местное и симптоматическое Что Что говорит КР Схема в справочнике Источник Промывание носа Изотонический или слабогипертонический морской раствор (УУР C); гипертонический не более 5-7 дней До 5 раз в день (Аквамарис, Долфин, Аквалор) КР ЛЕЧ Что Что говорит КР Схема в справочнике Источник Сосудосуживающ ие Альфа-адреномиметики (УУР A) только 5-7 дней, из-за риска медикаментозного ринита. Нафазолин не рекомендуется Ксилометазолин (Ксилен) 1-2 впрыска 3 раза, 5 дней; нафазолин 2 впрыска 3 раза (l008); Дезринит 2 дозы 2 раза 14 дней (p11, c41: сильно дольше 7 дней) КР ЛЕЧ ПРАКТИКА Интраназальные ГКС Только с 12 лет (УУР B); мометазон зарегистрирован для монотерапии без признаков бактериальной инфекции; дозы в КР нет Мометазон 2 впрыска в каждый нос 2 раза 7 дней (l008, при аллергическом рините); в c06 «3 раза в день 10 дней» КР ЛЕЧ Растительные препараты Комбинации с горечавкой, первоцветом, шалфеем, бузиной, вербеной, миртолом, пеларгонией (УУР B). Синупрет в КР только в списке литературы Синупрет 1-2 таб. 3 раза 7-14 дней; Инфласинусанс 1 капс. 2 раза 14 дней; Респиро Миртол 1 капс. 3 раза 7-14 дней; Касцебене КР ЛЕЧ ПРАКТИКА Муколитики Ацетилцистеин, карбоцистеин Нет КР 38,5 °C, до 8 таб. в сутки\"> Жаропонижающи е При лихорадке или
